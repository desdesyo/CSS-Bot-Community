name: Publish SOLO Engine V2

on:
  push:
    branches:
      - feature/solo-engine-v2
    paths:
      - "engine/v2/**"
      - "engine/cloud/**"
      - "engine/play.html"
      - "engine/import.html"
      - "engine/client/**"
      - ".github/workflows/solo-engine-v2-checks.yml"
      - ".github/workflows/publish-solo-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: solo-engine-pages
  cancel-in-progress: true

jobs:
  test:
    name: Verify source before publishing
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript modules
        run: |
          node --check engine/v2/engine.js
          node --check engine/v2/engine-core.mjs
          node --check engine/v2/human-bots.mjs
          node --check engine/v2/gameplay-log-session.mjs
          node --check engine/v2/weapon-viewmodel.mjs
          node --check engine/v2/wet-ground-map.mjs
      - name: Run SOLO Engine regression tests
        run: node --test engine/v2/engine.test.mjs

  build:
    name: Package playable V2
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out tested source
        uses: actions/checkout@v4
      - name: Prepare GitHub Pages artifact
        run: |
          test -s engine/v2/index.html
          test -s engine/v2/engine.js
          test -s engine/v2/wet-ground-map.mjs
          mkdir -p dist/engine/v2 dist/engine/cloud dist/legacy/client
          # Keep the documented /engine/v2/ URL and provide the same V2 at the site root.
          cp -R engine/v2/. dist/engine/v2/
          cp -R engine/v2/. dist/
          if [ -d engine/cloud ]; then cp -R engine/cloud/. dist/engine/cloud/; fi
          cp engine/play.html dist/legacy/index.html
          cp engine/import.html dist/legacy/import.html
          cp -R engine/client/. dist/legacy/client/
          mkdir -p "dist/solo-v2-${GITHUB_SHA}"
          cp -R engine/v2/. "dist/solo-v2-${GITHUB_SHA}/"
          touch dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy tested V2 to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
