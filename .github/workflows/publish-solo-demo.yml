name: Publish SOLO Engine playable demo
on:
  push:
    branches:
      - feature/solo-crossplay-foundation
      - feature/browser-27-character-operator-pack
      - feature/solo-engine-v2
    paths:
      - "engine/client/**"
      - "engine/play.html"
      - "engine/import.html"
      - "engine/v2/**"
      - ".github/workflows/publish-solo-demo.yml"
  workflow_dispatch:

# GitHub Pages deployment uses the Pages deployment API directly.
# Avoid the configure-pages enablement call: it requires repository-level
# administration access and is unnecessary when Pages is already configured
# for GitHub Actions.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: solo-engine-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare static game
        shell: bash
        run: |
          set -euo pipefail
          test -f engine/play.html
          test -f engine/import.html
          test -f engine/v2/index.html
          test -f engine/v2/engine.js
          rm -rf dist
          mkdir -p dist/client dist/engine/v2
          cp engine/play.html dist/index.html
          cp engine/import.html dist/import.html
          cp -R engine/client/. dist/client/
          cp -R engine/v2/. dist/engine/v2/
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/engine/v2/index.html
          test -s dist/engine/v2/engine.js
          echo "Prepared Pages artifact:"
          find dist -maxdepth 3 -type f -printf '%p (%s bytes)\n' | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
