name: Build CSSBC AI Logger
on:
  push:
    branches: [sdk-foundation]
    paths:
      - "sourcemod/scripting/cssbc_ai_logger.sp"
      - "setup.ps1"
      - "START_SETUP.bat"
      - ".github/workflows/build-ai-logger.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sdk-foundation
      - name: Download SourceMod compiler
        run: |
          curl -fsSL "https://sm.alliedmods.net/smdrop/1.12/sourcemod-latest-linux" -o /tmp/sourcemod.tar.gz
          mkdir -p /tmp/sourcemod
          tar -xzf /tmp/sourcemod.tar.gz -C /tmp/sourcemod
      - name: Compile SourcePawn
        run: |
          chmod +x /tmp/sourcemod/addons/sourcemod/scripting/spcomp
          /tmp/sourcemod/addons/sourcemod/scripting/spcomp sourcemod/scripting/cssbc_ai_logger.sp -i/tmp/sourcemod/addons/sourcemod/scripting/include -o cssbc_ai_logger.smx
      - name: Assemble installer
        run: |
          mkdir -p package
          cp cssbc_ai_logger.smx setup.ps1 START_SETUP.bat package/
          cp sourcemod/scripting/cssbc_ai_logger.sp package/
          printf '%s\n' 'CSSBC AI Logger' '1. Extract this ZIP.' '2. Run START_SETUP.bat.' '3. Requires CS:S with SourceMod installed.' '4. Events: addons/sourcemod/logs/cssbc_ai.jsonl' > package/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cssbc-ai-logger-installer
          path: package/
          if-no-files-found: error
          retention-days: 30
