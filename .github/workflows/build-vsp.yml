name: Build CSSBC VSP (Win32)

on:
  push:
    branches: ["**"]
    paths:
      - "sdk/dll/**"
      - "src/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "tools/build-cssbc.ps1"
      - "BUILD_CSSBC.bat"
      - ".github/workflows/build-vsp.yml"
  pull_request:
    paths:
      - "sdk/dll/**"
      - "src/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "tools/build-cssbc.ps1"
      - "BUILD_CSSBC.bat"
      - ".github/workflows/build-vsp.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Download compatible CS:S SDK headers
        shell: pwsh
        run: |
          $url = "https://codeload.github.com/alliedmodders/hl2sdk/zip/refs/heads/css"
          $zip = Join-Path $env:RUNNER_TEMP "hl2sdk-css.zip"
          $dest = Join-Path $env:RUNNER_TEMP "hl2sdk-css"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $root = Get-ChildItem $dest -Directory | Select-Object -First 1
          $required = @(
            "public\tier1\interface.h",
            "public\eiface.h",
            "public\engine\iserverplugin.h"
          )
          foreach ($relative in $required) {
            if (!(Test-Path (Join-Path $root.FullName $relative))) {
              throw "SDK archive is missing required header: $relative"
            }
          }
          "CSSBC_SOURCE_SDK=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: microsoft/setup-msbuild@v2

      - name: Build core, run tests, and build native Win32 DLL
        shell: pwsh
        run: ./tools/build-cssbc.ps1

      - name: Verify DLL
        shell: pwsh
        run: |
          $dll = "dist/CSSBC_VSP.dll"
          if (!(Test-Path $dll)) { throw "Build succeeded but $dll is missing" }
          Get-Item $dll | Format-List FullName,Length

      - name: Upload compiled DLL
        uses: actions/upload-artifact@v4
        with:
          name: CSSBC-VSP-Win32
          path: dist/CSSBC_VSP.dll
          if-no-files-found: error
