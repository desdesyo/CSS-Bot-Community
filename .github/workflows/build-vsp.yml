name: Build CSSBC native modules (Win32)

on:
  push:
    branches: [sdk-foundation]
    paths:
      - "src/**"
      - "sdk/**"
      - "tools/**"
      - ".github/workflows/build-vsp.yml"
  pull_request:
    paths:
      - "src/**"
      - "sdk/**"
      - "tools/**"
      - ".github/workflows/build-vsp.yml"
  workflow_dispatch:

jobs:
  build-vsp:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Download AlliedModders CS:S SDK (css branch)
        shell: pwsh
        run: |
          $sdkCommit = "47f0ea659bc70718f9c41a7830b6ad943a68ba09"
          $url = "https://codeload.github.com/alliedmodders/hl2sdk/zip/$sdkCommit"
          $zip = Join-Path $env:RUNNER_TEMP "hl2sdk-css.zip"
          $dest = Join-Path $env:RUNNER_TEMP "hl2sdk-css"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $root = Get-ChildItem $dest -Directory | Select-Object -First 1
          foreach ($file in @("public\eiface.h","public\engine\iserverplugin.h","public\tier1\interface.h")) {
            if (!(Test-Path (Join-Path $root.FullName $file))) { throw "SDK file missing: $file" }
          }
          "CSSBC_SOURCE_SDK=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure MSVC x86 environment
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x86
          if errorlevel 1 exit /b 1
          msbuild sdk\dll\CSSBC_VSP.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /p:CSSBC_SOURCE_SDK="%CSSBC_SOURCE_SDK%"
          if errorlevel 1 exit /b 1

      - name: Verify Win32 VSP DLL
        shell: pwsh
        run: |
          $dll = "sdk/dll/bin/CSSBC_VSP.dll"
          if (!(Test-Path $dll)) { throw "Build succeeded but $dll is missing" }
          $file = Get-Item $dll
          if ($file.Length -le 0) { throw "Built DLL is empty" }
          Get-Item $dll | Format-List FullName,Length

      - name: Upload compiled VSP DLL
        uses: actions/upload-artifact@v4
        with:
          name: CSSBC-VSP-Win32
          path: sdk/dll/bin/CSSBC_VSP.dll
          if-no-files-found: error

  build-v34-gamedll:
    runs-on: windows-2022
    steps:
      - name: Checkout CSSBC integration sources
        uses: actions/checkout@v4
        with:
          ref: sdk-foundation
          path: cssbc
          fetch-depth: 1

      - name: Checkout pinned CS:S v34 source tree
        uses: actions/checkout@v4
        with:
          repository: sl1mshady-cs/cssv34-client
          ref: 55f860bf42a537ac55aaef684f6fa0effee714a8
          path: cssv34-source
          fetch-depth: 1

      - name: Apply CSSBC native GameDLL integration (PowerShell only)
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\cssbc\tools\integrate-v34-gamedll.ps1" -CssbcRoot "$env:GITHUB_WORKSPACE\cssbc" -GameSourceRoot "$env:GITHUB_WORKSPACE\cssv34-source\src"

      - name: Prepare and inspect native VPC generator (no Python)
        shell: pwsh
        run: |
          Set-Location cssv34-source/src
          New-Item -ItemType Directory -Force utils\dx_proxy | Out-Null
          Set-Content utils\dx_proxy\dx_proxy_all.vgc "// CSSBC does not build the optional DirectX proxy tools."
          $help = & .\devtools\bin\vpc.exe /? 2>&1 | Out-String
          $help | Set-Content "$env:GITHUB_WORKSPACE\vpc-help.txt"
          Write-Host $help
          if ($LASTEXITCODE -ne 0) { throw "VPC help probe failed" }

      - name: Generate v34 GameDLL Visual Studio solution (no Python)
        shell: pwsh
        run: |
          Set-Location cssv34-source/src
          & .\devtools\bin\vpc.exe /cstrike /win32 /2019 +choreoobjects +dmxloader +server /mksln CSSBC_GameDLL.sln /f
          if ($LASTEXITCODE -ne 0) { throw "VPC failed to generate the GameDLL solution" }
          if (!(Test-Path CSSBC_GameDLL.sln)) { throw "VPC did not create CSSBC_GameDLL.sln" }
          $projects = Get-ChildItem -Recurse -Filter *.vcxproj | Select-Object -ExpandProperty FullName
          $projects | Set-Content "$env:GITHUB_WORKSPACE\gamedll-projects.txt"
          Write-Host "Generated projects:"
          $projects

      - name: Set C++17 and disable PCH for CSSBC translation units
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\cssbc\tools\patch-gamedll-project.ps1" -ProjectPath "cssv34-source/src/game/server/server_cstrike.vcxproj"

      - name: Upload generated GameDLL projects
        uses: actions/upload-artifact@v4
        with:
          name: CSSBC-v34-GameDLL-Projects
          path: |
            cssv34-source/src/CSSBC_GameDLL.sln
            gamedll-projects.txt
            cssv34-source/src/game/server/*.vcxproj
            cssv34-source/src/game/server/*.vcxproj.filters
          if-no-files-found: warn

      - name: Stage the pinned x86 ftol3 linker object
        shell: pwsh
        run: |
          $source = "cssv34-source/src/lib/win32/x86/ftol3.obj"
          $target = "cssv34-source/src/lib/public/ftol3.obj"
          if (!(Test-Path $source)) { throw "Pinned x86 ftol3.obj is missing: $source" }
          New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
          Copy-Item $source $target -Force
          Write-Host "Staged $source -> $target"

      - name: Build the required choreoobjects static library
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x86
          if errorlevel 1 exit /b 1
          msbuild cssv34-source\src\choreoobjects\choreoobjects.vcxproj /m /p:Configuration=Release /p:Platform=Win32
          if errorlevel 1 exit /b 1

      - name: Build the required dmxloader static library
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x86
          if errorlevel 1 exit /b 1
          msbuild cssv34-source\src\dmxloader\dmxloader.vcxproj /m /p:Configuration=Release /p:Platform=Win32
          if errorlevel 1 exit /b 1

      - name: Compile CSSBC-integrated CS:S v34 GameDLL with MSVC x86 (no Python)
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x86
          if errorlevel 1 exit /b 1
          msbuild cssv34-source\src\game\server\server_cstrike.vcxproj /m /p:Configuration=Release /p:Platform=Win32
          if errorlevel 1 exit /b 1

      - name: Verify server GameDLL output
        shell: pwsh
        run: |
          $dll = Get-ChildItem cssv34-source -Recurse -Filter server.dll | Where-Object { $_.Length -gt 0 } | Select-Object -First 1
          if (!$dll) { throw "MSBuild did not produce server.dll" }
          Write-Host "GameDLL: $($dll.FullName)"
          Write-Host "Bytes: $($dll.Length)"
          Copy-Item $dll.FullName "$env:GITHUB_WORKSPACE\server-v34-win32.dll" -Force

      - name: Upload compiled CSSBC GameDLL
        uses: actions/upload-artifact@v4
        with:
          name: CSSBC-v34-GameDLL-Win32
          path: server-v34-win32.dll
          if-no-files-found: error
