name: Build CSSBC VSP (Win32)

on:
  push:
    branches: [sdk-foundation]
    paths:
      - "sdk/dll/**"
      - ".github/workflows/build-vsp.yml"
  pull_request:
    paths:
      - "sdk/dll/**"
      - ".github/workflows/build-vsp.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Download Source SDK 2006 archive (public)
        shell: pwsh
        run: |
          $url = "https://codeload.github.com/ValveSoftware/source-sdk-2006/zip/refs/heads/master"
          $zip = Join-Path $env:RUNNER_TEMP "source-sdk-2006.zip"
          $dest = Join-Path $env:RUNNER_TEMP "source-sdk-2006"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $root = Get-ChildItem $dest -Directory | Select-Object -First 1
          if (!(Test-Path (Join-Path $root.FullName "public\interface.h"))) {
            throw "Downloaded archive doesn't contain expected Source SDK public headers"
          }
          "CSSBC_SOURCE_SDK=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build Win32 Release DLL
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x86
          msbuild sdk\dll\CSSBC_VSP.vcxproj /m /p:Configuration=Release /p:Platform=Win32
      - name: Verify DLL
        shell: pwsh
        run: |
          $dll = "sdk/dll/bin/CSSBC_VSP.dll"
          if (!(Test-Path $dll)) { throw "Build succeeded but $dll is missing" }
          Get-Item $dll | Format-List FullName,Length
      - name: Upload compiled DLL
        uses: actions/upload-artifact@v4
        with:
          name: CSSBC-VSP-Win32
          path: sdk/dll/bin/CSSBC_VSP.dll
          if-no-files-found: error
