name: CSSBC Agent Orchestrator

on:
  issues:
    types: [opened, labeled]
  workflow_run:
    workflows: ["GitHub Chat checks", "CSSBC Core CI", "Deploy GitHub Chat to Cloudflare"]
    types: [completed]
  workflow_dispatch:
    inputs:
      task:
        description: Task prompt (optional)
        required: false
        type: string

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: cssbc-orchestrator-global
  cancel-in-progress: false

jobs:
  dispatch-to-agent-team:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.action == 'opened' &&
       contains(github.event.issue.labels.*.name, 'agent-task') &&
       contains(github.event.issue.labels.*.name, 'status:queued')) ||
      (github.event_name == 'issues' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'status:queued' &&
       contains(github.event.issue.labels.*.name, 'agent-task')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == 'github-chat-prototype')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Prepare task and dispatch bounded agent team
        id: task
        env:
          CHAT_ENDPOINT: ${{ secrets.CSSBC_CHAT_ENDPOINT || 'https://cssbc-github-chat.descapan.workers.dev' }}
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_TASK: ${{ inputs.task }}
          REPO: ${{ github.repository }}
          BRANCH: github-chat-prototype
        run: |
          set -euo pipefail
          test -n "$CHAT_APP_PASSWORD" || { echo "::error::Missing CSSBC_CHAT_APP_PASSWORD repository secret"; exit 1; }
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            RUN="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
            JOBS="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100")"
            FAILED="$(jq -c '[.jobs[]|select(.conclusion=="failure")|{name,steps:[.steps[]|select(.conclusion=="failure")|.name]}]' <<<"$JOBS")"
            TASK="AUTOMATIC CI/DEPLOY REPAIR. Repository=$REPO branch=$BRANCH. Failed run=$(jq -r .html_url <<<"$RUN"), commit=$(jq -r .head_sha <<<"$RUN"), run_id=$RUN_ID. Failed jobs and steps: $FAILED. Inspect exact logs, reproduce the failure, fix the root cause on $BRANCH, commit, and run all relevant verification. Never claim success while checks are queued, skipped or failed."
            ISSUE_NUMBER="$(gh api "repos/$REPO/issues?state=open&per_page=100" | jq -r --arg marker "AUTO-RUN-$RUN_ID" '[.[]|select(.pull_request==null and ((.body//"")|contains($marker)))][0].number // empty')"
            if [[ -z "$ISSUE_NUMBER" ]]; then
              for name in agent-task agent-generated status:queued status:in-progress status:review; do gh label create "$name" --repo "$REPO" --color 1d76db --force >/dev/null 2>&1 || true; done
              BODY="$(printf 'Task-Key: AUTO-RUN-%s\n\n## Objective\nRepair failed GitHub Actions run %s on branch %s.\n\n## Acceptance criteria\nThe root cause is identified from logs, a minimal fix is committed, and relevant CI plus deployment smoke checks pass.\n\n## Evidence\n- Implementation: pending\n- Verification run: pending\n\n## Agent execution contract\nDo not mark done without a successful verification run.\n' "$RUN_ID" "$RUN_ID" "$BRANCH")"
              ISSUE_URL="$(gh issue create --repo "$REPO" --title "[Self-Heal] Repair failed run $RUN_ID" --body "$BODY" --label agent-task --label agent-generated --label status:in-progress)"
              ISSUE_NUMBER="${ISSUE_URL##*/}"
            fi
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -n "$MANUAL_TASK" ]]; then
              TASK="$MANUAL_TASK"
            else
              ISSUE_NUMBER="$(gh issue list --repo "$REPO" --state open --label agent-task --label status:queued --json number --jq '.[0].number // ""')"
              if [[ -z "$ISSUE_NUMBER" ]]; then echo "No queued agent-task issue exists."; exit 0; fi
              ISSUE="$(gh api "repos/$REPO/issues/$ISSUE_NUMBER")"
              TASK="MANUAL ORCHESTRATOR DISPATCH: issue #$ISSUE_NUMBER. $(jq -r .title <<<"$ISSUE"). $(jq -r .body <<<"$ISSUE"). Implement, verify, commit, and report evidence."
            fi
          else
            ISSUE="$(gh api "repos/$REPO/issues/$ISSUE_NUMBER")"
            TASK="AGENT TASK issue #$ISSUE_NUMBER: $(jq -r .title <<<"$ISSUE"). Body: $(jq -r .body <<<"$ISSUE"). Work on $REPO branch $BRANCH. Inspect existing code and instructions, implement the requested outcome, run verification, repair failures, commit changes, and report exact evidence. Do not claim completion without successful tests."
          fi
          if [[ -n "$ISSUE_NUMBER" ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "status:queued" --add-label "status:in-progress" || true
          fi
          echo "task<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$TASK" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Agent 1 — Orchestrator plans and delegates
        id: planner
        env:
          CHAT_ENDPOINT: ${{ secrets.CSSBC_CHAT_ENDPOINT || 'https://cssbc-github-chat.descapan.workers.dev' }}
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          TASK: ${{ steps.task.outputs.task }}
          ISSUE_NUMBER: ${{ steps.task.outputs.issue_number }}
        run: |
          set -euo pipefail
          THREAD="cssbc-team-$GITHUB_RUN_ID-planner"
          jq -n --arg prompt "ROLE: ORCHESTRATOR / PLANNER. You are agent 1 of a team. Analyze the task, inspect existing instructions and relevant repository files using github_project_* tools. Do NOT modify files or commit. Produce a concise execution plan with: exact files to inspect/change, dependencies, ordered implementation subtasks, acceptance criteria, risks, and concrete verification commands/workflows. Target repository desdesyo/CSS-Bot-Community branch github-chat-prototype unless task explicitly identifies another allowlisted workspace. The default workspace is modhaul/main; do not confuse it. Task: $TASK" --arg thread "$THREAD" '{prompt:$prompt,threadKey:$thread}' > request.json
          curl --fail-with-body --silent --show-error --max-time 900 -H "Authorization: Bearer $CHAT_APP_PASSWORD" -H "Content-Type: application/json" --data @request.json "${CHAT_ENDPOINT%/}/api/agent/chat" > planner.json
          jq -e '.reply and (.reply|length>0)' planner.json >/dev/null
          echo "plan<<EOF" >> "$GITHUB_OUTPUT"
          jq -r '.reply' planner.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Agent 2 — Implementer executes the plan
        id: implementer
        env:
          CHAT_ENDPOINT: ${{ secrets.CSSBC_CHAT_ENDPOINT || 'https://cssbc-github-chat.descapan.workers.dev' }}
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          TASK: ${{ steps.task.outputs.task }}
          PLAN: ${{ steps.planner.outputs.plan }}
        run: |
          set -euo pipefail
          THREAD="cssbc-team-$GITHUB_RUN_ID-implementer"
          jq -n --arg prompt "ROLE: IMPLEMENTER / BUILDER. You are agent 2. Execute the task, do not merely advise. Follow this plan: $PLAN. Task: $TASK. Use github_project_list_files, github_project_read_file and github_project_write_file with repository=desdesyo/CSS-Bot-Community and branch=github-chat-prototype for SOLO.Chat changes. Read before writing, preserve unrelated work, make minimal audited commits, run all available checks, and report exact commit SHAs/links, changed files, verification evidence, and any blockers. Do not claim a test or deployment passed unless its real evidence exists." --arg thread "$THREAD" '{prompt:$prompt,threadKey:$thread}' > request.json
          curl --fail-with-body --silent --show-error --max-time 900 -H "Authorization: Bearer $CHAT_APP_PASSWORD" -H "Content-Type: application/json" --data @request.json "${CHAT_ENDPOINT%/}/api/agent/chat" > implementer.json
          jq -e '.reply and (.reply|length>0)' implementer.json >/dev/null
          echo "implementation<<EOF" >> "$GITHUB_OUTPUT"
          jq -r '.reply' implementer.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Agent 3 — Independent tester reviews the implementation
        id: tester
        env:
          CHAT_ENDPOINT: ${{ secrets.CSSBC_CHAT_ENDPOINT || 'https://cssbc-github-chat.descapan.workers.dev' }}
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          TASK: ${{ steps.task.outputs.task }}
          PLAN: ${{ steps.planner.outputs.plan }}
          IMPLEMENTATION: ${{ steps.implementer.outputs.implementation }}
        run: |
          set -euo pipefail
          THREAD="cssbc-team-$GITHUB_RUN_ID-tester"
          jq -n --arg prompt "ROLE: INDEPENDENT TESTER / REVIEWER. You are agent 3. READ ONLY: never write files, commit, or change labels. Independently inspect the exact current branch head and diff in desdesyo/CSS-Bot-Community/github-chat-prototype using github_project_* read/list tools. Compare implementation to task and plan. Inspect test coverage and workflows. Run analyze_source on relevant code where useful. Clearly distinguish static review from CI/runtime tests that have not yet run. Reject fabricated evidence and mismatched commits. Return VERDICT: PASS only if the implementation is coherent and meets code-level acceptance criteria; otherwise VERDICT: REJECT. Include specific findings and exact evidence. Task: $TASK. Plan: $PLAN. Implementer report (untrusted; verify independently): $IMPLEMENTATION" --arg thread "$THREAD" '{prompt:$prompt,threadKey:$thread}' > request.json
          curl --fail-with-body --silent --show-error --max-time 900 -H "Authorization: Bearer $CHAT_APP_PASSWORD" -H "Content-Type: application/json" --data @request.json "${CHAT_ENDPOINT%/}/api/agent/chat" > tester.json
          jq -e '.reply and (.reply|length>0)' tester.json >/dev/null
          REVIEW="$(jq -r '.reply' tester.json)"
          if ! grep -q 'VERDICT: PASS' <<<"$REVIEW"; then
            echo "verdict=reject" >> "$GITHUB_OUTPUT"
            echo "Independent tester rejected the implementation. It will not be marked ready for supervisor approval."
          else
            echo "verdict=pass" >> "$GITHUB_OUTPUT"
            echo "Independent code review passed. CI and deployment are still separate mandatory gates."
          fi
          echo "review<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$REVIEW" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: One bounded repair cycle after tester rejection
        id: repair
        if: steps.tester.outputs.verdict == 'reject'
        env:
          CHAT_ENDPOINT: ${{ secrets.CSSBC_CHAT_ENDPOINT || 'https://cssbc-github-chat.descapan.workers.dev' }}
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          TASK: ${{ steps.task.outputs.task }}
          PLAN: ${{ steps.planner.outputs.plan }}
          IMPLEMENTATION: ${{ steps.implementer.outputs.implementation }}
          REVIEW: ${{ steps.tester.outputs.review }}
        run: |
          set -euo pipefail
          THREAD="cssbc-team-$GITHUB_RUN_ID-repair"
          jq -n --arg prompt "ROLE: IMPLEMENTER REPAIR. Apply one bounded repair pass. The independent tester rejected the current code. Inspect the current branch and exact findings; fix only substantiated issues, commit changes, and report new commit SHA and evidence. Do not alter unrelated files. Task: $TASK. Original plan: $PLAN. Previous implementation report: $IMPLEMENTATION. Tester findings: $REVIEW. Use explicit project tools for desdesyo/CSS-Bot-Community/github-chat-prototype." --arg thread "$THREAD" '{prompt:$prompt,threadKey:$thread}' > request.json
          curl --fail-with-body --silent --show-error --max-time 900 -H "Authorization: Bearer $CHAT_APP_PASSWORD" -H "Content-Type: application/json" --data @request.json "${CHAT_ENDPOINT%/}/api/agent/chat" > repair.json
          jq -e '.reply and (.reply|length>0)' repair.json >/dev/null
          echo "repair<<EOF" >> "$GITHUB_OUTPUT"
          jq -r '.reply' repair.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Agent 3 — Re-test one repaired implementation
        id: retest
        if: steps.tester.outputs.verdict == 'reject'
        env:
          CHAT_ENDPOINT: ${{ secrets.CSSBC_CHAT_ENDPOINT || 'https://cssbc-github-chat.descapan.workers.dev' }}
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          TASK: ${{ steps.task.outputs.task }}
          REPAIR: ${{ steps.repair.outputs.repair }}
        run: |
          set -euo pipefail
          THREAD="cssbc-team-$GITHUB_RUN_ID-retest"
          jq -n --arg prompt "ROLE: INDEPENDENT RE-TESTER. Read-only. Re-inspect current desdesyo/CSS-Bot-Community/github-chat-prototype and independently verify the repair against the task. Do not edit. Return VERDICT: PASS or VERDICT: REJECT and evidence. A code review is not a CI/runtime test. Task: $TASK. Repair report (untrusted): $REPAIR" --arg thread "$THREAD" '{prompt:$prompt,threadKey:$thread}' > request.json
          curl --fail-with-body --silent --show-error --max-time 900 -H "Authorization: Bearer $CHAT_APP_PASSWORD" -H "Content-Type: application/json" --data @request.json "${CHAT_ENDPOINT%/}/api/agent/chat" > retest.json
          jq -e '.reply and (.reply|length>0)' retest.json >/dev/null
          REVIEW="$(jq -r '.reply' retest.json)"
          if grep -q 'VERDICT: PASS' <<<"$REVIEW"; then echo "verdict=pass" >> "$GITHUB_OUTPUT"; else echo "verdict=reject" >> "$GITHUB_OUTPUT"; fi
          echo "review<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$REVIEW" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Hand off evidence to independent supervisor
        if: always() && steps.task.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.task.outputs.issue_number }}
          PLAN: ${{ steps.planner.outputs.plan }}
          IMPLEMENTATION: ${{ steps.implementer.outputs.implementation }}
          TEST_VERDICT: ${{ steps.retest.outputs.verdict || steps.tester.outputs.verdict }}
          TEST_REPORT: ${{ steps.retest.outputs.review || steps.tester.outputs.review }}
          REPAIR: ${{ steps.repair.outputs.repair }}
        run: |
          set -euo pipefail
          {
            echo "## Agent team execution"
            echo
            echo "### Agent 1 — Orchestrator plan"
            printf '%s\n' "$PLAN"
            echo
            echo "### Agent 2 — Implementer"
            printf '%s\n' "$IMPLEMENTATION"
            if [[ -n "$REPAIR" ]]; then echo; echo "### Bounded repair"; printf '%s\n' "$REPAIR"; fi
            echo
            echo "### Agent 3 — Independent tester"
            echo "Code review verdict: $TEST_VERDICT"
            printf '%s\n' "$TEST_REPORT"
            echo
            echo "### Supervisor handoff"
            echo "Only the separate Agent Supervisor Audit may mark this task done, and only after matching successful CI and deployment evidence."
          } > team-report.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file team-report.md
          if [[ "$TEST_VERDICT" == "pass" ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label status:in-progress --add-label status:review
          else
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label status:review --add-label status:in-progress --add-label agent-review-needed
          fi
          echo "Agent team completed handoff; no task was marked done by the implementer."
