name: CSSBC Agent Orchestrator

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-orchestrator.yml"
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ["GitHub Chat checks", "Deploy GitHub Chat to Cloudflare", "GitHub Chat live end-to-end test", "CSSBC Core CI"]
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      task:
        description: Task prompt (optional; empty means process next queued task)
        required: false
        type: string

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  process-chat-feedback:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Drain SOLO.Chat feedback inbox into queued agent tasks
        env:
          CHAT_ENDPOINT: https://cssbc-github-chat.descapan.workers.dev
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$CHAT_APP_PASSWORD" || { echo "::error::Missing CSSBC_CHAT_APP_PASSWORD repository secret"; exit 1; }
          for name in agent-task agent-generated agent-chat-runtime agent-feedback status:queued status:in-progress status:review status:done; do gh label create "$name" --repo "$SOURCE_REPO" --color 1d76db --force >/dev/null 2>&1 || true; done
          curl --fail-with-body --silent --show-error --max-time 30 -H "Authorization: Bearer $CHAT_APP_PASSWORD" "$CHAT_ENDPOINT/api/agent/feedback" > feedback.json
          jq -c '.items[]' feedback.json | while read -r RECORD; do
            ID="$(jq -r '.id' <<<"$RECORD")"
            RATING="$(jq -r '.rating' <<<"$RECORD")"
            THREAD="$(jq -r '.threadId' <<<"$RECORD")"
            TASK_KEY="FEEDBACK-$THREAD-$(printf '%s' "$ID" | tr '[:lower:]' '[:upper:]' | tr -cd 'A-Z0-9-' | cut -c1-16)"
            OP="$(jq -r '.operationId' <<<"$RECORD")"
            USER_TEXT="$(jq -r '.userMessage' <<<"$RECORD")"
            ASSISTANT_TEXT="$(jq -r '.assistantReply' <<<"$RECORD")"
            NOTE="$(jq -r '.note' <<<"$RECORD")"
            TITLE="[SOLO.Chat feedback] $RATING · thread $THREAD"
            BODY="$(jq -n --arg task "$TASK_KEY" --arg target "$SOURCE_REPO@github-chat-prototype" --arg id "$ID" --arg rating "$RATING" --arg thread "$THREAD" --arg op "$OP" --arg user "$USER_TEXT" --arg answer "$ASSISTANT_TEXT" --arg note "$NOTE" '{body:("Task-Key: "+$task+"\nAgent-Target: "+$target+"\nFeedback ID: "+$id+"\nRating: "+$rating+"\nThread: "+$thread+"\nOperation: "+$op+"\n\n## Objective\nReproduce and fix this SOLO.Chat user feedback.\n\n## Acceptance criteria\n- Inspect source and runtime evidence.\n- Implement a safe fix and add regression tests.\n- Verify the fix and report commit/test evidence.\n- Promote reusable skills only after independent verification on at least two cases.\n- Never expose secrets.\n\nUSER REQUEST\n"+$user+"\n\nASSISTANT RESPONSE\n"+$answer+"\n\nFEEDBACK / ERROR\n"+$note+"\n\n## Evidence\n- Implementation: pending\n- Verification run: pending")}' | jq -r '.body')"
            ISSUE_URL="$(gh issue create --repo "$SOURCE_REPO" --title "$TITLE" --body "$BODY" --label agent-task --label agent-generated --label agent-feedback --label agent-chat-runtime --label status:queued)"
            curl --fail-with-body --silent --show-error --max-time 30 -H "Authorization: Bearer $CHAT_APP_PASSWORD" -H "Content-Type: application/json" --data "$(jq -n --arg id "$ID" --arg url "$ISSUE_URL" '{id:$id,issueUrl:$url}')" "$CHAT_ENDPOINT/api/agent/feedback/ack" >/dev/null
            echo "- $ID → $ISSUE_URL" >> "$GITHUB_STEP_SUMMARY"
          done

  queue-ci-failure:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Scan or ingest CI/deploy failures and enqueue deduplicated repair tasks
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_JSON: ${{ toJSON(github.event.workflow_run) }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            RUNS="$(jq -n --argjson run "$WORKFLOW_RUN_JSON" '{workflow_runs:[$run]}')"
          else
            RUNS="$(gh api "repos/$SOURCE_REPO/actions/runs?per_page=100")"
          fi
          jq -c '.workflow_runs[] | select(.status=="completed" and .conclusion=="failure" and ((.name=="GitHub Chat checks" and .head_branch=="github-chat-prototype") or (.name=="Deploy GitHub Chat to Cloudflare" and .head_branch=="github-chat-prototype") or (.name=="GitHub Chat live end-to-end test") or (.name=="CSSBC Core CI" and (.head_branch=="main" or .head_branch=="sdk-foundation"))))' <<<"$RUNS" | while IFS= read -r RUN; do
            RUN_ID="$(jq -r .id <<<"$RUN")"
            RUN_NAME="$(jq -r .name <<<"$RUN")"
            RUN_BRANCH="$(jq -r .head_branch <<<"$RUN")"
            RUN_SHA="$(jq -r .head_sha <<<"$RUN")"
            if [[ "$RUN_NAME" == "CSSBC Core CI" ]]; then
              TARGET_REPO="$SOURCE_REPO"; TARGET_BRANCH="$RUN_BRANCH"; TARGET_LABEL="agent-core-runtime"
            else
              TARGET_REPO="$SOURCE_REPO"; TARGET_BRANCH="github-chat-prototype"; TARGET_LABEL="agent-chat-runtime"
            fi
            EXISTING="$(gh api "repos/$SOURCE_REPO/issues?state=open&per_page=100" | jq -r --arg prefix "[Self-Heal] $RUN_NAME failed (" --arg target "$TARGET_REPO@$TARGET_BRANCH" '[.[]|select(.pull_request==null and (.title|startswith($prefix)) and ((.body//"")|contains("Agent-Target: "+$target)) and (.labels|any(.name=="status:queued" or .name=="status:in-progress" or .name=="status:review")))][0].number // empty')"
            if [[ -n "$EXISTING" ]]; then
              REPEAT_BODY="$(printf 'Repeated failure detected.\nWorkflow run: %s/%s/actions/runs/%s\nBranch: %s\nCommit: %s\n' "$GITHUB_SERVER_URL" "$SOURCE_REPO" "$RUN_ID" "$RUN_BRANCH" "$RUN_SHA")"
              gh issue comment "$EXISTING" --repo "$SOURCE_REPO" --body "$REPEAT_BODY"
              echo "Aggregated repeated failure run $RUN_ID into issue #$EXISTING."
              continue
            fi
            JOBS="$(gh api "repos/$SOURCE_REPO/actions/runs/$RUN_ID/jobs?per_page=100")"
            FAILED="$(jq -c '[.jobs[]|select(.conclusion=="failure")|{name,steps:[.steps[]|select(.conclusion=="failure")|.name]}]' <<<"$JOBS")"
            for name in agent-task agent-generated "$TARGET_LABEL" status:queued status:in-progress status:review status:done agent-review-needed; do gh label create "$name" --repo "$SOURCE_REPO" --color 1d76db --force >/dev/null 2>&1 || true; done
            BODY="$(printf 'Task-Key: AUTO-RUN-%s\nAgent-Target: %s@%s\n\n## Objective\nRepair failed workflow %s on branch %s at commit %s.\n\n## Acceptance criteria\n- Identify the root cause from exact failed job/step logs.\n- Implement the smallest safe fix in the target repository and branch.\n- Add regression coverage where practical.\n- Run target-specific CI and, for SOLO.Chat changes, verify deployment of the exact current app code.\n- Preserve user data and never expose credentials.\n\n## Failure evidence\n- Workflow run: %s\n- Failed jobs and steps: %s\n\n## Evidence\n- Implementation: pending\n- Verification run: pending\n' "$RUN_ID" "$TARGET_REPO" "$TARGET_BRANCH" "$RUN_NAME" "$RUN_BRANCH" "$RUN_SHA" "$(jq -r .html_url <<<"$RUN")" "$FAILED")"
            URL="$(gh issue create --repo "$SOURCE_REPO" --title "[Self-Heal] $RUN_NAME failed ($RUN_ID)" --body "$BODY" --label agent-task --label agent-generated --label "$TARGET_LABEL" --label status:queued)"
            echo "Queued $TARGET_REPO@$TARGET_BRANCH repair for run $RUN_ID: $URL"
          done
  queue-user-correction:
    if: github.event_name == 'issue_comment' && github.event.action == 'created' && github.event.issue.pull_request == null && contains(github.event.issue.labels.*.name, 'agent-task') && (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    steps:
      - name: Re-queue corrected task for the serial builder
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          for name in status:queued status:in-progress status:review status:done; do gh label create "$name" --repo "$SOURCE_REPO" --color 1d76db --force >/dev/null 2>&1 || true; done
          ISSUE_BODY="$(gh api "repos/$SOURCE_REPO/issues/$ISSUE_NUMBER" --jq '.body // ""')"
          ISSUE_BODY="$(printf '%s\\n' "$ISSUE_BODY" | sed '/^Agent-Attempts:/d')"
          gh api -X PATCH "repos/$SOURCE_REPO/issues/$ISSUE_NUMBER" -f body="$ISSUE_BODY" >/dev/null
          gh issue edit "$ISSUE_NUMBER" --repo "$SOURCE_REPO" --remove-label status:in-progress --remove-label status:review --remove-label status:done --add-label status:queued
          gh issue comment "$ISSUE_NUMBER" --repo "$SOURCE_REPO" --body "Correction received. Task returned to the serial builder queue."
          gh workflow run agent-orchestrator.yml --repo "$SOURCE_REPO" --ref main

  dispatch-to-llm:
    concurrency:
      group: cssbc-agent-builder-global
      cancel-in-progress: false
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.name == 'Deploy GitHub Chat to Cloudflare' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'issues' &&
       contains(github.event.issue.labels.*.name, 'agent-task') &&
       ((github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'status:queued')) ||
        (github.event.action == 'labeled' && github.event.label.name == 'status:queued')))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Claim the oldest queued task and resolve its target workspace
        id: task
        env:
          CHAT_ENDPOINT: https://cssbc-github-chat.descapan.workers.dev
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TASK: ${{ inputs.task }}
          SOURCE_REPO: ${{ github.repository }}
          DEFAULT_REPO: desdesyo/modhaul
          DEFAULT_BRANCH: main
        run: |
          set -euo pipefail
          test -n "$CHAT_APP_PASSWORD" || { echo "::error::Missing CSSBC_CHAT_APP_PASSWORD repository secret"; exit 1; }
          # Do not let the agent team run against an old Worker deployment.
          APP_HEAD="$(gh api "repos/$SOURCE_REPO/branches/github-chat-prototype" --jq .commit.sha)"
          APP_RUNS="$(gh api "repos/$SOURCE_REPO/actions/runs?branch=github-chat-prototype&per_page=100")"
          LAST_GOOD_DEPLOY="$(jq -c '[.workflow_runs[]|select(.name=="Deploy GitHub Chat to Cloudflare" and .status=="completed" and .conclusion=="success")][0] // empty' <<<"$APP_RUNS")"
          LAST_DEPLOY_SHA="$(jq -r '.head_sha // empty' <<<"$LAST_GOOD_DEPLOY")"
          if [[ -z "$LAST_DEPLOY_SHA" ]]; then
            APP_COMPARE='{"files":[{"filename":"web-chat/deployment-not-yet-verified"}]}'
          elif [[ "$LAST_DEPLOY_SHA" == "$APP_HEAD" ]]; then
            APP_COMPARE='{"files":[]}'
          else
            APP_COMPARE="$(gh api "repos/$SOURCE_REPO/compare/$LAST_DEPLOY_SHA...$APP_HEAD" || echo '{"files":[{"filename":"web-chat/deployment-diff-unavailable"}]}')"
          fi
          # A one-line model-tool description correction does not change executable
          # code. Allow queued agents to use the already-smoke-tested runtime while
          # the cosmetic description-only deployment catches up.
          APP_DEPLOY_PENDING="$(jq -r '
            any(.files[]?;
              (
                (.filename | startswith("web-chat/agent-runtime/")) or
                (.filename | startswith("web-chat/public/")) or
                .filename=="web-chat/wrangler.toml" or
                .filename=="web-chat/package.json" or
                .filename=="web-chat/package-lock.json" or
                .filename==".github/workflows/deploy-github-chat.yml"
              )
              and
              (
                (
                  .filename!="web-chat/agent-runtime/src/index.ts" or
                  .additions!=1 or .deletions!=1 or
                  ((.patch // "") | contains("name: \"generate_image\"")) == false or
                  ((.patch // "") | contains("description: \"Create and save an image using free FLUX.1 Schnell through Cloudflare Workers AI. Never call paid image models.\"")) == false
                )
              )
            )
          ' <<<"$APP_COMPARE")"
          if [[ "$APP_DEPLOY_PENDING" == "true" ]]; then
            echo "has_task=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Agent team paused: latest SOLO.Chat Worker code has not been successfully deployed yet."
            exit 0
          fi
          STALE_CUTOFF="$(date -u -d '150 minutes ago' +%s)"
          gh api "repos/$SOURCE_REPO/issues?state=open&per_page=100" | jq -r --argjson cutoff "$STALE_CUTOFF" '[.[]|select(.pull_request==null and (.labels|any(.name=="agent-task")) and (.labels|any(.name=="status:in-progress")) and ((.updated_at|fromdateiso8601) < $cutoff))|.number][]' | while read -r STALE_ISSUE; do
            [[ -n "$STALE_ISSUE" ]] || continue
            gh issue edit "$STALE_ISSUE" --repo "$SOURCE_REPO" --remove-label status:in-progress --add-label status:queued
            gh issue comment "$STALE_ISSUE" --repo "$SOURCE_REPO" --body "Stale task recovery: no active builder completion was recorded within 150 minutes. Returned to the serial queue; the next run will re-check current code and evidence."
            echo "Re-queued stale issue #$STALE_ISSUE."
          done
          TARGET_REPO="$DEFAULT_REPO"
          TARGET_BRANCH="$DEFAULT_BRANCH"
          ISSUE_NUMBER=""
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$MANUAL_TASK" ]]; then
            TASK="$MANUAL_TASK Target repository=$TARGET_REPO branch=$TARGET_BRANCH. Inspect, implement, verify, and report evidence."
          else
            # GitHub CLI on the hosted runner does not support --sort/--order for gh issue list.
            # Fetch the queued issues once and sort deterministically with jq instead.
            QUEUED_ISSUES="$(gh api "repos/$SOURCE_REPO/issues?state=open&labels=agent-task,status%3Aqueued&per_page=100")"
            ISSUE_NUMBER="$(jq -r '[.[] | select(.pull_request==null and any(.labels[]?; .name=="agent-health-alert"))] | sort_by(.created_at) | .[0].number // ""' <<<"$QUEUED_ISSUES")"
            # Prefer user-authored tasks over generated repair backlog; health alerts remain highest priority.
            if [[ -z "$ISSUE_NUMBER" ]]; then ISSUE_NUMBER="$(jq -r '[.[] | select(.pull_request==null and all(.labels[]?; .name!="agent-generated"))] | sort_by(.created_at) | .[0].number // ""' <<<"$QUEUED_ISSUES")"; fi
            if [[ -z "$ISSUE_NUMBER" ]]; then ISSUE_NUMBER="$(jq -r '[.[] | select(.pull_request==null and any(.labels[]?; .name=="agent-generated"))] | sort_by(.created_at) | reverse | .[0].number // ""' <<<"$QUEUED_ISSUES")"; fi
            if [[ -z "$ISSUE_NUMBER" ]]; then echo "has_task=false" >> "$GITHUB_OUTPUT"; echo "No queued agent task; builder is idle."; exit 0; fi
            ISSUE="$(gh api "repos/$SOURCE_REPO/issues/$ISSUE_NUMBER")"
            ISSUE_BODY="$(jq -r .body <<<"$ISSUE")"
            ISSUE_LABELS="$(jq -r '.labels[].name' <<<"$ISSUE")"
            TARGET_LINE="$(grep -m1 '^Agent-Target:' <<<"$ISSUE_BODY" | cut -d' ' -f2- || true)"
            if [[ -n "$TARGET_LINE" && "$TARGET_LINE" == *@* ]]; then
              TARGET_REPO="${TARGET_LINE%@*}"; TARGET_BRANCH="${TARGET_LINE##*@}"
            elif grep -qx 'agent-chat-runtime' <<<"$ISSUE_LABELS"; then
              TARGET_REPO="$SOURCE_REPO"; TARGET_BRANCH="github-chat-prototype"
            elif grep -qx 'agent-core-runtime' <<<"$ISSUE_LABELS"; then
              TARGET_REPO="$SOURCE_REPO"; TARGET_BRANCH="main"
            fi
            if [[ -z "$TARGET_LINE" ]]; then
              UPDATED_BODY="$(printf '%s\n\nAgent-Target: %s@%s\n' "$ISSUE_BODY" "$TARGET_REPO" "$TARGET_BRANCH")"
              gh api -X PATCH "repos/$SOURCE_REPO/issues/$ISSUE_NUMBER" -f body="$UPDATED_BODY" >/dev/null
            fi
            for name in status:queued status:in-progress status:review status:done; do gh label create "$name" --repo "$SOURCE_REPO" --color 1d76db --force >/dev/null 2>&1 || true; done
            ISSUE_BODY="$(gh api "repos/$SOURCE_REPO/issues/$ISSUE_NUMBER" --jq '.body // ""')"
            ISSUE_BODY="$(printf '%s\\n' "$ISSUE_BODY" | sed '/^Agent-Run-ID:/d')"
            ISSUE_BODY="$(printf '%s\\n\\nAgent-Run-ID: %s\\n' "$ISSUE_BODY" "$GITHUB_RUN_ID")"
            gh api -X PATCH "repos/$SOURCE_REPO/issues/$ISSUE_NUMBER" -f body="$ISSUE_BODY" >/dev/null
            gh issue edit "$ISSUE_NUMBER" --repo "$SOURCE_REPO" --remove-label status:queued --remove-label status:review --remove-label status:done --add-label status:in-progress
            TASK="AGENT TASK issue #$ISSUE_NUMBER: $(jq -r .title <<<"$ISSUE"). Body=$ISSUE_BODY. Target repository=$TARGET_REPO branch=$TARGET_BRANCH. Inspect relevant code and skills, implement, run tests, repair failures, commit, and report exact evidence. Do not claim done without verification."
          fi
          THREAD="cssbc-team-$GITHUB_RUN_ID"
          if [[ -n "$ISSUE_NUMBER" ]]; then THREAD="cssbc-team-issue-$ISSUE_NUMBER-run-$GITHUB_RUN_ID"; fi
          echo "has_task=true" >> "$GITHUB_OUTPUT"
          echo "task<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$TASK" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "target_repo=$TARGET_REPO" >> "$GITHUB_OUTPUT"
          echo "target_branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
          echo "thread=$THREAD" >> "$GITHUB_OUTPUT"

      - name: Prepare retrying agent API client
        if: steps.task.outputs.has_task == 'true'
        env:
          CHAT_ENDPOINT: https://cssbc-github-chat.descapan.workers.dev
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > agent-request.sh <<'AGENT_REQUEST'
          agent_request() {
            local role="$1" request_file="$2" response_file="$3"
            local attempt code detail
            jq --arg operationId "gha-${GITHUB_RUN_ID}-${role}" '. + {operationId:$operationId}' "$request_file" > "${request_file}.with-id"
            for attempt in 1 2 3; do
              code="$(curl --silent --show-error --connect-timeout 20 --max-time 900 \
                -o "$response_file" -w '%{http_code}' \
                -H "Authorization: Bearer $CHAT_APP_PASSWORD" \
                -H "Content-Type: application/json" \
                --data-binary @"${request_file}.with-id" "${CHAT_ENDPOINT%/}/api/agent/chat" || true)"
              [[ "$code" =~ ^[0-9]{3}$ ]] || code="000"
              if [[ "$code" == "200" ]] && jq -e '.reply and (.reply|type=="string" and length>0)' "$response_file" >/dev/null 2>&1; then
                echo "$code" > agent-request-http-code.txt
                return 0
              fi
              detail="$(jq -r '.error // .message // .' "$response_file" 2>/dev/null | head -c 1400 || true)"
              printf '%s' "$code" > agent-request-http-code.txt
              printf '%s' "${detail:-No response body}" > agent-request-error.txt
              echo "::warning::Agent API role=$role attempt=$attempt/3 returned HTTP $code: ${detail:-No response body}"
              case "$code" in
                000|408|425|429|500|502|503|504|200)
                  if [[ "$attempt" -lt 3 ]]; then
                    sleep "$((attempt * 10))"
                    continue
                  fi
                  ;;
              esac
              echo "::error::Agent API request exhausted retries for role=$role (HTTP $code)."
              return 1
            done
            return 1
          }
          AGENT_REQUEST
          chmod +x agent-request.sh

      - name: Agent 1 — Orchestrator plans and delegates
        id: planner
        if: steps.task.outputs.has_task == 'true'
        env:
          CHAT_ENDPOINT: https://cssbc-github-chat.descapan.workers.dev
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ steps.task.outputs.task }}
          TARGET_REPO: ${{ steps.task.outputs.target_repo }}
          TARGET_BRANCH: ${{ steps.task.outputs.target_branch }}
          THREAD: ${{ steps.task.outputs.thread }}
        run: |
          set -euo pipefail
          jq -n --arg githubToken "$GH_TOKEN" --arg role "planner" --arg prompt "ROLE: ORCHESTRATOR / PLANNER. You are agent 1. Inspect instructions and the exact target repository/branch $TARGET_REPO@$TARGET_BRANCH using github_project_* tools. Do not write, commit or mutate anything. Produce a bounded implementation plan, files to inspect/change, acceptance criteria, risks, and exact verification workflow. The target is authoritative; do not silently switch workspaces. Task: $TASK" --arg thread "$THREAD-planner" '{prompt:$prompt,threadKey:$thread,agentRole:$role,githubToken:$githubToken}' > request.json
          source ./agent-request.sh
          agent_request planner request.json planner.json
          jq -e '.reply and (.reply|length>0)' planner.json >/dev/null
          echo "plan<<EOF" >> "$GITHUB_OUTPUT"
          jq -r '.reply' planner.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Agent 2 — Implementer executes the plan
        id: implementer
        if: steps.task.outputs.has_task == 'true'
        env:
          CHAT_ENDPOINT: https://cssbc-github-chat.descapan.workers.dev
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ steps.task.outputs.task }}
          PLAN: ${{ steps.planner.outputs.plan }}
          TARGET_REPO: ${{ steps.task.outputs.target_repo }}
          TARGET_BRANCH: ${{ steps.task.outputs.target_branch }}
          THREAD: ${{ steps.task.outputs.thread }}
        run: |
          set -euo pipefail
          jq -n --arg githubToken "$GH_TOKEN" --arg role "implementer" --arg prompt "ROLE: IMPLEMENTER / BUILDER. You are agent 2. Execute the task. Target repository=$TARGET_REPO branch=$TARGET_BRANCH. Use github_project_list_files, github_project_read_file and github_project_write_file with exactly this repository and branch. Read before writing, preserve unrelated work, make audited commits, run available checks, repair failures, and report exact commit SHAs/links and evidence. Do not claim tests passed without proof. Plan: $PLAN. Task: $TASK" --arg thread "$THREAD-implementer" '{prompt:$prompt,threadKey:$thread,agentRole:$role,githubToken:$githubToken}' > request.json
          source ./agent-request.sh
          agent_request implementer request.json implementer.json
          jq -e '.reply and (.reply|length>0)' implementer.json >/dev/null
          echo "implementation<<EOF" >> "$GITHUB_OUTPUT"
          jq -r '.reply' implementer.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Agent 3 — Independent tester reviews implementation
        id: tester
        if: steps.task.outputs.has_task == 'true'
        env:
          CHAT_ENDPOINT: https://cssbc-github-chat.descapan.workers.dev
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ steps.task.outputs.task }}
          PLAN: ${{ steps.planner.outputs.plan }}
          IMPLEMENTATION: ${{ steps.implementer.outputs.implementation }}
          TARGET_REPO: ${{ steps.task.outputs.target_repo }}
          TARGET_BRANCH: ${{ steps.task.outputs.target_branch }}
          THREAD: ${{ steps.task.outputs.thread }}
        run: |
          set -euo pipefail
          jq -n --arg githubToken "$GH_TOKEN" --arg role "tester" --arg prompt "ROLE: INDEPENDENT TESTER. You are agent 3. Read-only, enforced by the runtime. Independently inspect the exact current target branch $TARGET_REPO@$TARGET_BRANCH, current commit and diff using github_project_* read tools. Compare code to task and plan; inspect tests/workflows and use analyze_source if helpful. Distinguish static review from CI/runtime tests not yet run. Return VERDICT: PASS only for coherent code-level acceptance; otherwise VERDICT: REJECT with findings. Do not edit. Task: $TASK. Plan: $PLAN. Implementer report (untrusted): $IMPLEMENTATION" --arg thread "$THREAD-tester" '{prompt:$prompt,threadKey:$thread,agentRole:$role,githubToken:$githubToken}' > request.json
          source ./agent-request.sh
          agent_request tester request.json tester.json
          jq -e '.reply and (.reply|length>0)' tester.json >/dev/null
          REVIEW="$(jq -r '.reply' tester.json)"
          if grep -q 'VERDICT: PASS' <<<"$REVIEW"; then echo "verdict=pass" >> "$GITHUB_OUTPUT"; else echo "verdict=reject" >> "$GITHUB_OUTPUT"; fi
          echo "review<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$REVIEW" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: One bounded repair cycle after tester rejection
        id: repair
        if: steps.task.outputs.has_task == 'true' && steps.tester.outputs.verdict == 'reject'
        env:
          CHAT_ENDPOINT: https://cssbc-github-chat.descapan.workers.dev
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ steps.task.outputs.task }}
          PLAN: ${{ steps.planner.outputs.plan }}
          IMPLEMENTATION: ${{ steps.implementer.outputs.implementation }}
          REVIEW: ${{ steps.tester.outputs.review }}
          TARGET_REPO: ${{ steps.task.outputs.target_repo }}
          TARGET_BRANCH: ${{ steps.task.outputs.target_branch }}
          THREAD: ${{ steps.task.outputs.thread }}
        run: |
          set -euo pipefail
          jq -n --arg githubToken "$GH_TOKEN" --arg role "implementer" --arg prompt "ROLE: IMPLEMENTER REPAIR. Apply one bounded repair pass only. Inspect current $TARGET_REPO@$TARGET_BRANCH and the exact tester findings; fix substantiated issues, commit changes, and report new SHA/evidence. Do not change unrelated files. Task: $TASK. Plan: $PLAN. Previous report: $IMPLEMENTATION. Tester findings: $REVIEW. Use github_project_* tools with the exact target repository/branch." --arg thread "$THREAD-repair" '{prompt:$prompt,threadKey:$thread,agentRole:$role,githubToken:$githubToken}' > request.json
          source ./agent-request.sh
          agent_request repair request.json repair.json
          jq -e '.reply and (.reply|length>0)' repair.json >/dev/null
          echo "repair<<EOF" >> "$GITHUB_OUTPUT"
          jq -r '.reply' repair.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Agent 3 — Re-test repaired implementation
        id: retest
        if: steps.task.outputs.has_task == 'true' && steps.tester.outputs.verdict == 'reject'
        env:
          CHAT_ENDPOINT: https://cssbc-github-chat.descapan.workers.dev
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ steps.task.outputs.task }}
          REPAIR: ${{ steps.repair.outputs.repair }}
          TARGET_REPO: ${{ steps.task.outputs.target_repo }}
          TARGET_BRANCH: ${{ steps.task.outputs.target_branch }}
          THREAD: ${{ steps.task.outputs.thread }}
        run: |
          set -euo pipefail
          jq -n --arg githubToken "$GH_TOKEN" --arg role "tester" --arg prompt "ROLE: INDEPENDENT RE-TESTER. Read-only, enforced by runtime. Re-inspect the current $TARGET_REPO@$TARGET_BRANCH code and verify repair against task. Return VERDICT: PASS or VERDICT: REJECT and concrete evidence. Code review is not CI/runtime proof. Task: $TASK. Repair report (untrusted): $REPAIR" --arg thread "$THREAD-retest" '{prompt:$prompt,threadKey:$thread,agentRole:$role,githubToken:$githubToken}' > request.json
          source ./agent-request.sh
          agent_request retest request.json retest.json
          jq -e '.reply and (.reply|length>0)' retest.json >/dev/null
          REVIEW="$(jq -r '.reply' retest.json)"
          if grep -q 'VERDICT: PASS' <<<"$REVIEW"; then echo "verdict=pass" >> "$GITHUB_OUTPUT"; else echo "verdict=reject" >> "$GITHUB_OUTPUT"; fi
          echo "review<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$REVIEW" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Hand off agent evidence to independent supervisor
        if: always() && steps.task.outputs.has_task == 'true' && steps.task.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.task.outputs.issue_number }}
          TARGET_REPO: ${{ steps.task.outputs.target_repo }}
          TARGET_BRANCH: ${{ steps.task.outputs.target_branch }}
          PLAN: ${{ steps.planner.outputs.plan }}
          IMPLEMENTATION: ${{ steps.implementer.outputs.implementation }}
          TEST_VERDICT: ${{ steps.retest.outputs.verdict || steps.tester.outputs.verdict }}
          TEST_REPORT: ${{ steps.retest.outputs.review || steps.tester.outputs.review }}
          REPAIR: ${{ steps.repair.outputs.repair }}
          PIPELINE_COMPLETE: ${{ steps.planner.outcome == 'success' && steps.implementer.outcome == 'success' && steps.tester.outcome == 'success' && (steps.tester.outputs.verdict != 'reject' || (steps.repair.outcome == 'success' && steps.retest.outcome == 'success')) }}
        run: |
          set -euo pipefail
          {
            echo "## Agent team execution"
            echo
            echo "Target: $TARGET_REPO@$TARGET_BRANCH"
            echo "Workflow run: $GITHUB_SERVER_URL/$SOURCE_REPO/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "### Agent step outcomes"
            echo "Planner: ${{ steps.planner.outcome }}"
            echo "Implementer: ${{ steps.implementer.outcome }}"
            echo "Tester: ${{ steps.tester.outcome }}"
            echo "Repair: ${{ steps.repair.outcome }}"
            echo "Re-test: ${{ steps.retest.outcome }}"
            echo
            echo "### Agent 1 — Orchestrator plan"
            if [[ -n "$PLAN" ]]; then printf '%s\n' "$PLAN"; elif [[ -f planner.json ]]; then jq -r '.error // .' planner.json | head -c 2200; else echo "No planner response was produced."; fi
            echo
            echo "### Agent 2 — Implementer"
            if [[ -n "$IMPLEMENTATION" ]]; then printf '%s\n' "$IMPLEMENTATION"; elif [[ -f implementer.json ]]; then jq -r '.error // .' implementer.json | head -c 2200; else echo "Not reached."; fi
            if [[ -n "$REPAIR" ]]; then echo; echo "### Bounded repair"; printf '%s\n' "$REPAIR"; fi
            echo
            echo "### Agent 3 — Independent tester"
            echo "Code review verdict: ${TEST_VERDICT:-NOT RUN}"
            if [[ -n "$TEST_REPORT" ]]; then printf '%s\n' "$TEST_REPORT"; elif [[ -f tester.json ]]; then jq -r '.error // .' tester.json | head -c 2200; else echo "Not reached."; fi
            echo
            echo "### Supervisor handoff"
            echo "This is an execution report, not a PASS. The independent supervisor must verify exact commit SHA, target CI and deployment evidence before marking done."
          } > team-report.md
          gh issue comment "$ISSUE_NUMBER" --repo "$SOURCE_REPO" --body-file team-report.md
          if [[ "$PIPELINE_COMPLETE" == "true" ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$SOURCE_REPO" --remove-label status:queued --remove-label status:in-progress --remove-label status:done --add-label status:review
          else
            echo "Agent pipeline did not complete; leave status transition to the automatic retry/recovery step."
          fi

      - name: Requeue or block an interrupted agent pipeline
        if: always() && steps.task.outputs.has_task == 'true' && steps.task.outputs.issue_number != '' && (steps.planner.outcome == 'failure' || steps.implementer.outcome == 'failure' || steps.tester.outcome == 'failure' || steps.repair.outcome == 'failure' || steps.retest.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.task.outputs.issue_number }}
        run: |
          set -euo pipefail
          HTTP_CODE="$(cat agent-request-http-code.txt 2>/dev/null || echo 000)"
          DETAIL="$(cat agent-request-error.txt 2>/dev/null || echo 'Agent step failed before a response was recorded.')"
          ISSUE="$(gh api "repos/$SOURCE_REPO/issues/$ISSUE_NUMBER")"
          BODY="$(jq -r '.body // ""' <<<"$ISSUE")"
          CURRENT="$(grep -m1 '^Agent-Attempts:' <<<"$BODY" | awk '{print $2}' || true)"
          [[ "$CURRENT" =~ ^[0-9]+$ ]] || CURRENT=0
          NEXT=$((CURRENT + 1))
          if grep -q '^Agent-Attempts:' <<<"$BODY"; then
            UPDATED_BODY="$(printf '%s\n' "$BODY" | sed -E "s/^Agent-Attempts:.*/Agent-Attempts: $NEXT/")"
          else
            UPDATED_BODY="$(printf '%s\n\nAgent-Attempts: %s\n' "$BODY" "$NEXT")"
          fi
          gh api -X PATCH "repos/$SOURCE_REPO/issues/$ISSUE_NUMBER" -f body="$UPDATED_BODY" >/dev/null
          RUN_URL="$GITHUB_SERVER_URL/$SOURCE_REPO/actions/runs/$GITHUB_RUN_ID"
          if [[ "$HTTP_CODE" =~ ^(400|401|403|404)$ ]] || [[ "$NEXT" -ge 3 ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$SOURCE_REPO" --remove-label status:queued --remove-label status:in-progress --remove-label status:done --add-label status:review --add-label agent-review-needed
            gh issue comment "$ISSUE_NUMBER" --repo "$SOURCE_REPO" --body "Agent pipeline blocked after $NEXT attempt(s). HTTP $HTTP_CODE. No implementation completion was recorded. Manual investigation is required before retrying.\n\nRun: $RUN_URL\n\nDiagnostic: $DETAIL"
            echo "::error::Agent task #$ISSUE_NUMBER moved to review-needed after bounded retries."
          else
            gh issue edit "$ISSUE_NUMBER" --repo "$SOURCE_REPO" --remove-label status:in-progress --remove-label status:review --remove-label status:done --add-label status:queued
            gh issue comment "$ISSUE_NUMBER" --repo "$SOURCE_REPO" --body "Agent pipeline failed with a retryable error (HTTP $HTTP_CODE). The task was returned to the queue; the scheduled/issue trigger will retry it. Attempt $NEXT of 3.\n\nRun: $RUN_URL\n\nDiagnostic: $DETAIL"
            echo "Agent task #$ISSUE_NUMBER requeued (attempt $NEXT/3)."
          fi
