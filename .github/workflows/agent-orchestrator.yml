name: CSSBC Agent Orchestrator

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ["GitHub Chat checks", "CSSBC Core CI", "GitHub Chat live end-to-end test", "Deploy GitHub Chat to Cloudflare"]
    types: [completed]
  workflow_dispatch:
    inputs:
      task:
        description: Task prompt
        required: false
        type: string

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: cssbc-orchestrator-${{ github.event.workflow_run.id || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch-to-llm:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.action == 'opened' &&
       contains(github.event.issue.labels.*.name, 'agent-task')) ||
      (github.event_name == 'issues' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'status:queued') ||
      (github.event_name == 'issue_comment' &&
       github.event.action == 'created' &&
       github.event.issue.pull_request == null &&
       contains(github.event.issue.labels.*.name, 'agent-task') &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       (github.event.workflow_run.head_branch == 'github-chat-prototype' ||
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    steps:
      - name: Build feedback task and call SOLO.Chat
        env:
          CHAT_ENDPOINT: https://cssbc-github-chat.descapan.workers.dev
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          MANUAL_TASK: ${{ inputs.task }}
          SOURCE_REPO: ${{ github.repository }}
          REPO: desdesyo/modhaul
          BRANCH: main
        run: |
          set -euo pipefail
          test -n "$CHAT_ENDPOINT" || { echo "::error::Missing chat endpoint"; exit 1; }
          test -n "$CHAT_APP_PASSWORD" || { echo "::error::Missing CSSBC_CHAT_APP_PASSWORD repository secret"; exit 1; }

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            RUN="$(gh api "repos/$SOURCE_REPO/actions/runs/$RUN_ID")"
            JOBS="$(gh api "repos/$SOURCE_REPO/actions/runs/$RUN_ID/jobs?per_page=100")"
            TASK="AUTOMATED CI/DEPLOY FAILURE FEEDBACK. Repository=$SOURCE_REPO. Workflow=$(jq -r .name <<<"$RUN"). Run=$(jq -r .html_url <<<"$RUN"). Branch=$(jq -r .head_branch <<<"$RUN"). Commit=$(jq -r .head_sha <<<"$RUN"). Failed jobs and steps: $(jq -c '[.jobs[]|select(.conclusion=="failure")|{name,steps:[.steps[]|select(.conclusion=="failure")|.name]}]' <<<"$JOBS"). Inspect logs and artifacts through GitHub, diagnose root cause, implement a safe fix in $REPO branch $BRANCH, run tests, and report evidence. Do not claim success without verification."
          elif [[ "$EVENT_NAME" == "issue_comment" ]]; then
            ISSUE="$(gh api "repos/$SOURCE_REPO/issues/$ISSUE_NUMBER")"
            TASK="USER NEGATIVE FEEDBACK / CORRECTION on agent task #$ISSUE_NUMBER. Issue title: $(jq -r .title <<<"$ISSUE"). Issue body: $(jq -r .body <<<"$ISSUE"). User comment: $COMMENT_BODY. Treat this as a required correction: reproduce, inspect evidence, fix the underlying behavior, add a regression test and a reusable skill candidate only if repeat-verified. Work in $REPO branch $BRANCH. Reply with evidence, not generic reassurance."
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$MANUAL_TASK" ]]; then
            TASK="$MANUAL_TASK"
          else
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              ISSUE="$(gh issue list --repo "$SOURCE_REPO" --label agent-task --state open --json number,title,body --limit 1 | jq '.[0]')"
              test "$ISSUE" != "null" || { echo "::error::No open agent-task issue found"; exit 1; }
              ISSUE_NUMBER="$(jq -r .number <<<"$ISSUE")"
            else
              ISSUE="$(gh api "repos/$SOURCE_REPO/issues/$ISSUE_NUMBER")"
            fi
            TASK="AGENT TASK issue #$ISSUE_NUMBER: $(jq -r .title <<<"$ISSUE"). Body: $(jq -r .body <<<"$ISSUE"). Work on $REPO branch $BRANCH. Inspect, implement, test, repair failures and report evidence. Do not mark done without verification."
          fi

          jq -n --arg prompt "$TASK" --arg thread "cssbc-orchestrator" '{prompt:$prompt,threadKey:$thread}' > payload.json
          RESPONSE="$(curl --fail-with-body --silent --show-error --max-time 900 \
            -H "Authorization: Bearer $CHAT_APP_PASSWORD" \
            -H "Content-Type: application/json" \
            --data @payload.json "${CHAT_ENDPOINT%/}/api/agent/chat")"
          printf '%s' "$RESPONSE" | jq -e '.reply and (.reply|length>0)' >/dev/null
          REPLY="$(printf '%s' "$RESPONSE" | jq -r '.reply')"
          {
            echo "## SOLO.Chat agent response"
            echo "$REPLY"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$EVENT_NAME" == "issues" || "$EVENT_NAME" == "issue_comment" ]]; then
            gh api "repos/$SOURCE_REPO/issues/$ISSUE_NUMBER/comments" -f body="### SOLO.Chat automated response\n\n$REPLY"
          fi
