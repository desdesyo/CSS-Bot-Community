name: CSSBC Agent Orchestrator

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      task:
        description: Task prompt (optional; otherwise latest queued agent-task issue)
        required: false
        type: string

permissions:
  actions: read
  contents: read
  issues: read

concurrency:
  group: cssbc-orchestrator-${{ github.event.workflow_run.id || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch-to-llm:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.action == 'opened' &&
       contains(github.event.issue.labels.*.name, 'agent-task')) ||
      (github.event_name == 'issues' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'status:queued')
    runs-on: ubuntu-latest
    steps:
      - name: Build task and send to durable LLM agent
        env:
          CHAT_ENDPOINT: https://cssbc-github-chat.descapan.workers.dev
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          MANUAL_TASK: ${{ inputs.task }}
          SOURCE_REPO: ${{ github.repository }}
          REPO: desdesyo/modhaul
          BRANCH: main
        run: |
          set -euo pipefail
          test -n "$CHAT_ENDPOINT" || { echo "::error::Missing chat endpoint"; exit 1; }
          test -n "$CHAT_APP_PASSWORD" || { echo "::error::Missing CSSBC_CHAT_APP_PASSWORD repository secret"; exit 1; }
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$MANUAL_TASK" ]]; then
            TASK="$MANUAL_TASK"
          else
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              ISSUE="$(gh issue list --repo "$SOURCE_REPO" --label agent-task --state open --json number,title,body --limit 1 | jq '.[0]')"
              test "$ISSUE" != "null" || { echo "::error::No open agent-task issue found"; exit 1; }
              ISSUE_NUMBER="$(jq -r .number <<<"$ISSUE")"
            else
              ISSUE="$(gh api "repos/$SOURCE_REPO/issues/$ISSUE_NUMBER")"
            fi
            TASK="AGENT TASK issue #$ISSUE_NUMBER: $(jq -r .title <<<"$ISSUE"). Body: $(jq -r .body <<<"$ISSUE"). Work in workspace $REPO branch $BRANCH. Inspect, implement, test, commit, and report evidence. Follow acceptance criteria and do not mark done without verified evidence."
          fi
          jq -n --arg prompt "$TASK" --arg thread "cssbc-orchestrator" '{prompt:$prompt,threadKey:$thread}' > payload.json
          ENDPOINT="${CHAT_ENDPOINT%/}"
          curl --fail-with-body --silent --show-error --max-time 900 \
            -H "Authorization: Bearer $CHAT_APP_PASSWORD" \
            -H "Content-Type: application/json" \
            --data @payload.json "$ENDPOINT/api/agent/chat" | tee response.json
          jq -e '.reply and (.reply|length>0)' response.json >/dev/null
          echo "LLM agent returned a non-empty result."
