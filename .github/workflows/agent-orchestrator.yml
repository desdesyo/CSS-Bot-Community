name: CSSBC Agent Orchestrator

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ["GitHub Chat checks", "CSSBC Core CI", "GitHub Chat live end-to-end test", "Deploy GitHub Chat to Cloudflare"]
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      task:
        description: Task prompt (optional; empty means process next queued task)
        required: false
        type: string

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  process-chat-feedback:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Drain SOLO.Chat feedback inbox into queued agent tasks
        env:
          CHAT_ENDPOINT: ${{ secrets.CSSBC_CHAT_ENDPOINT || 'https://cssbc-github-chat.descapan.workers.dev' }}
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$CHAT_APP_PASSWORD" || { echo "::error::Missing CSSBC_CHAT_APP_PASSWORD repository secret"; exit 1; }
          for name in agent-task agent-generated agent-chat-runtime agent-feedback status:queued status:in-progress status:review status:done; do gh label create "$name" --repo "$SOURCE_REPO" --color 1d76db --force >/dev/null 2>&1 || true; done
          curl --fail-with-body --silent --show-error --max-time 30 -H "Authorization: Bearer $CHAT_APP_PASSWORD" "$CHAT_ENDPOINT/api/agent/feedback" > feedback.json
          jq -c '.items[]' feedback.json | while read -r RECORD; do
            ID="$(jq -r '.id' <<<"$RECORD")"
            RATING="$(jq -r '.rating' <<<"$RECORD")"
            THREAD="$(jq -r '.threadId' <<<"$RECORD")"
            TASK_KEY="FEEDBACK-$THREAD-$(printf '%s' "$ID" | tr '[:lower:]' '[:upper:]' | tr -cd 'A-Z0-9-' | cut -c1-16)"
            OP="$(jq -r '.operationId' <<<"$RECORD")"
            USER_TEXT="$(jq -r '.userMessage' <<<"$RECORD")"
            ASSISTANT_TEXT="$(jq -r '.assistantReply' <<<"$RECORD")"
            NOTE="$(jq -r '.note' <<<"$RECORD")"
            TITLE="[SOLO.Chat feedback] $RATING · thread $THREAD"
            BODY="$(jq -n --arg task "$TASK_KEY" --arg target "$SOURCE_REPO@github-chat-prototype" --arg id "$ID" --arg rating "$RATING" --arg thread "$THREAD" --arg op "$OP" --arg user "$USER_TEXT" --arg answer "$ASSISTANT_TEXT" --arg note "$NOTE" '{body:("Task-Key: "+$task+"\nAgent-Target: "+$target+"\nFeedback ID: "+$id+"\nRating: "+$rating+"\nThread: "+$thread+"\nOperation: "+$op+"\n\n## Objective\nReproduce and fix this SOLO.Chat user feedback.\n\n## Acceptance criteria\n- Inspect source and runtime evidence.\n- Implement a safe fix and add regression tests.\n- Verify the fix and report commit/test evidence.\n- Promote reusable skills only after independent verification on at least two cases.\n- Never expose secrets.\n\nUSER REQUEST\n"+$user+"\n\nASSISTANT RESPONSE\n"+$answer+"\n\nFEEDBACK / ERROR\n"+$note+"\n\n## Evidence\n- Implementation: pending\n- Verification run: pending")}' | jq -r '.body')"
            ISSUE_URL="$(gh issue create --repo "$SOURCE_REPO" --title "$TITLE" --body "$BODY" --label agent-task --label agent-generated --label agent-feedback --label agent-chat-runtime --label status:queued)"
            curl --fail-with-body --silent --show-error --max-time 30 -H "Authorization: Bearer $CHAT_APP_PASSWORD" -H "Content-Type: application/json" --data "$(jq -n --arg id "$ID" --arg url "$ISSUE_URL" '{id:$id,issueUrl:$url}')" "$CHAT_ENDPOINT/api/agent/feedback/ack" >/dev/null
            echo "- $ID → $ISSUE_URL" >> "$GITHUB_STEP_SUMMARY"
          done

  queue-ci-failure:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && (github.event.workflow_run.head_branch == 'github-chat-prototype' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Convert failed CI/deploy runs into queued repair issues
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          RUN="$(gh api "repos/$SOURCE_REPO/actions/runs/$RUN_ID")"
          RUN_NAME="$(jq -r .name <<<"$RUN")"
          RUN_BRANCH="$(jq -r .head_branch <<<"$RUN")"
          if [[ "$RUN_BRANCH" == "github-chat-prototype" || "$RUN_NAME" == "GitHub Chat checks" || "$RUN_NAME" == "Deploy GitHub Chat to Cloudflare" || "$RUN_NAME" == "GitHub Chat live end-to-end test" ]]; then
            TARGET_REPO="$SOURCE_REPO"; TARGET_BRANCH="github-chat-prototype"; TARGET_LABEL="agent-chat-runtime"
          elif [[ "$RUN_NAME" == "CSSBC Core CI" && "$RUN_BRANCH" == "main" ]]; then
            TARGET_REPO="$SOURCE_REPO"; TARGET_BRANCH="main"; TARGET_LABEL="agent-core-runtime"
          else
            TARGET_REPO="desdesyo/modhaul"; TARGET_BRANCH="main"; TARGET_LABEL="agent-overhaul"
          fi
          EXISTING="$(gh api "repos/$SOURCE_REPO/issues?state=open&per_page=100" | jq -r --arg marker "AUTO-RUN-$RUN_ID" '[.[]|select(.pull_request==null and ((.body//"")|contains($marker)))][0].number // empty')"
          if [[ -n "$EXISTING" ]]; then
            echo "Repair issue #$EXISTING already exists for failed run $RUN_ID."
            exit 0
          fi
          for name in agent-task agent-generated agent-chat-runtime agent-core-runtime agent-overhaul status:queued status:in-progress status:review status:done; do gh label create "$name" --repo "$SOURCE_REPO" --color 1d76db --force >/dev/null 2>&1 || true; done
          BODY="$(printf 'Task-Key: AUTO-RUN-%s\nAgent-Target: %s@%s\n\n## Objective\nRepair failed workflow %s on branch %s.\n\n## Acceptance criteria\n- Identify the root cause from the exact workflow logs.\n- Implement the smallest safe fix in the target repository.\n- Run relevant checks and deployment verification.\n- Preserve user data and never expose secrets.\n\n## Evidence\n- Failed run: %s\n- Implementation: pending\n- Verification run: pending\n' "$RUN_ID" "$TARGET_REPO" "$TARGET_BRANCH" "$RUN_NAME" "$RUN_BRANCH" "$(jq -r .html_url <<<"$RUN")")"
          gh issue create --repo "$SOURCE_REPO" --title "[Self-Heal] $RUN_NAME failed ($RUN_ID)" --body "$BODY" --label agent-task --label agent-generated --label "$TARGET_LABEL" --label status:queued
          echo "Queued repair issue for $TARGET_REPO@$TARGET_BRANCH."

  queue-user-correction:
    if: github.event_name == 'issue_comment' && github.event.action == 'created' && github.event.issue.pull_request == null && contains(github.event.issue.labels.*.name, 'agent-task') && (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    steps:
      - name: Re-queue corrected task for the serial builder
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          for name in status:queued status:in-progress status:review status:done; do gh label create "$name" --repo "$SOURCE_REPO" --color 1d76db --force >/dev/null 2>&1 || true; done
          gh issue edit "$ISSUE_NUMBER" --repo "$SOURCE_REPO" --remove-label status:in-progress --remove-label status:review --remove-label status:done --add-label status:queued
          gh issue comment "$ISSUE_NUMBER" --repo "$SOURCE_REPO" --body "Correction received. Task returned to the serial builder queue."

  dispatch-to-llm:
    concurrency:
      group: cssbc-agent-builder-global
      cancel-in-progress: false
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       contains(github.event.issue.labels.*.name, 'agent-task') &&
       ((github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'status:queued')) ||
        (github.event.action == 'labeled' && github.event.label.name == 'status:queued')))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Claim the oldest queued task and resolve its target workspace
        id: task
        env:
          CHAT_ENDPOINT: ${{ secrets.CSSBC_CHAT_ENDPOINT || 'https://cssbc-github-chat.descapan.workers.dev' }}
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TASK: ${{ inputs.task }}
          SOURCE_REPO: ${{ github.repository }}
          DEFAULT_REPO: desdesyo/modhaul
          DEFAULT_BRANCH: main
        run: |
          set -euo pipefail
          test -n "$CHAT_APP_PASSWORD" || { echo "::error::Missing CSSBC_CHAT_APP_PASSWORD repository secret"; exit 1; }
          # Do not let the agent team run against an old Worker deployment.
          APP_HEAD="$(gh api "repos/$SOURCE_REPO/branches/github-chat-prototype" --jq .commit.sha)"
          APP_RUNS="$(gh api "repos/$SOURCE_REPO/actions/runs?branch=github-chat-prototype&per_page=100")"
          LAST_GOOD_DEPLOY="$(jq -c '[.workflow_runs[]|select(.name=="Deploy GitHub Chat to Cloudflare" and .status=="completed" and .conclusion=="success")][0] // empty' <<<"$APP_RUNS")"
          LAST_DEPLOY_SHA="$(jq -r '.head_sha // empty' <<<"$LAST_GOOD_DEPLOY")"
          if [[ -z "$LAST_DEPLOY_SHA" ]]; then
            APP_CHANGES='["web-chat/deployment-not-yet-verified"]'
          elif [[ "$LAST_DEPLOY_SHA" == "$APP_HEAD" ]]; then
            APP_CHANGES='[]'
          else
            APP_CHANGES="$(gh api "repos/$SOURCE_REPO/compare/$LAST_DEPLOY_SHA...$APP_HEAD" --jq '[.files[]?.filename]' || echo '["web-chat/deployment-diff-unavailable"]')"
          fi
          APP_DEPLOY_PENDING="$(jq -r 'any(.[]; startswith("web-chat/") or .==".github/workflows/deploy-github-chat.yml")' <<<"$APP_CHANGES")"
          if [[ "$APP_DEPLOY_PENDING" == "true" ]]; then
            echo "has_task=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Agent team paused: latest SOLO.Chat Worker code has not been successfully deployed yet."
            exit 0
          fi
          TARGET_REPO="$DEFAULT_REPO"
          TARGET_BRANCH="$DEFAULT_BRANCH"
          ISSUE_NUMBER=""
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$MANUAL_TASK" ]]; then
            TASK="$MANUAL_TASK Target repository=$TARGET_REPO branch=$TARGET_BRANCH. Inspect, implement, verify, and report evidence."
          else
            ISSUE_NUMBER="$(gh issue list --repo "$SOURCE_REPO" --state open --label agent-task --label status:queued --sort created --order asc --limit 100 --json number --jq '.[0].number // ""')"
            if [[ -z "$ISSUE_NUMBER" ]]; then echo "has_task=false" >> "$GITHUB_OUTPUT"; echo "No queued agent task; builder is idle."; exit 0; fi
            ISSUE="$(gh api "repos/$SOURCE_REPO/issues/$ISSUE_NUMBER")"
            ISSUE_BODY="$(jq -r .body <<<"$ISSUE")"
            ISSUE_LABELS="$(jq -r '.labels[].name' <<<"$ISSUE")"
            TARGET_LINE="$(grep -m1 '^Agent-Target:' <<<"$ISSUE_BODY" | cut -d' ' -f2- || true)"
            if [[ -n "$TARGET_LINE" && "$TARGET_LINE" == *@* ]]; then
              TARGET_REPO="${TARGET_LINE%@*}"; TARGET_BRANCH="${TARGET_LINE##*@}"
            elif grep -qx 'agent-chat-runtime' <<<"$ISSUE_LABELS"; then
              TARGET_REPO="$SOURCE_REPO"; TARGET_BRANCH="github-chat-prototype"
            elif grep -qx 'agent-core-runtime' <<<"$ISSUE_LABELS"; then
              TARGET_REPO="$SOURCE_REPO"; TARGET_BRANCH="main"
            fi
            if [[ -z "$TARGET_LINE" ]]; then
              UPDATED_BODY="$(printf '%s\n\nAgent-Target: %s@%s\n' "$ISSUE_BODY" "$TARGET_REPO" "$TARGET_BRANCH")"
              gh api -X PATCH "repos/$SOURCE_REPO/issues/$ISSUE_NUMBER" -f body="$UPDATED_BODY" >/dev/null
            fi
            for name in status:queued status:in-progress status:review status:done; do gh label create "$name" --repo "$SOURCE_REPO" --color 1d76db --force >/dev/null 2>&1 || true; done
            gh issue edit "$ISSUE_NUMBER" --repo "$SOURCE_REPO" --remove-label status:queued --remove-label status:review --remove-label status:done --add-label status:in-progress
            TASK="AGENT TASK issue #$ISSUE_NUMBER: $(jq -r .title <<<"$ISSUE"). Body=$ISSUE_BODY. Target repository=$TARGET_REPO branch=$TARGET_BRANCH. Inspect relevant code and skills, implement, run tests, repair failures, commit, and report exact evidence. Do not claim done without verification."
          fi
          THREAD="cssbc-team-$GITHUB_RUN_ID"
          if [[ -n "$ISSUE_NUMBER" ]]; then THREAD="cssbc-team-issue-$ISSUE_NUMBER-run-$GITHUB_RUN_ID"; fi
          echo "has_task=true" >> "$GITHUB_OUTPUT"
          echo "task<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$TASK" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "target_repo=$TARGET_REPO" >> "$GITHUB_OUTPUT"
          echo "target_branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
          echo "thread=$THREAD" >> "$GITHUB_OUTPUT"

      - name: Agent 1 — Orchestrator plans and delegates
        id: planner
        if: steps.task.outputs.has_task == 'true'
        env:
          CHAT_ENDPOINT: ${{ secrets.CSSBC_CHAT_ENDPOINT || 'https://cssbc-github-chat.descapan.workers.dev' }}
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ steps.task.outputs.task }}
          TARGET_REPO: ${{ steps.task.outputs.target_repo }}
          TARGET_BRANCH: ${{ steps.task.outputs.target_branch }}
          THREAD: ${{ steps.task.outputs.thread }}
        run: |
          set -euo pipefail
          jq -n --arg githubToken "$GH_TOKEN" --arg role "planner" --arg prompt "ROLE: ORCHESTRATOR / PLANNER. You are agent 1. Inspect instructions and the exact target repository/branch $TARGET_REPO@$TARGET_BRANCH using github_project_* tools. Do not write, commit or mutate anything. Produce a bounded implementation plan, files to inspect/change, acceptance criteria, risks, and exact verification workflow. The target is authoritative; do not silently switch workspaces. Task: $TASK" --arg thread "$THREAD-planner" '{prompt:$prompt,threadKey:$thread,agentRole:$role,githubToken:$githubToken}' > request.json
          curl --fail-with-body --silent --show-error --max-time 900 -H "Authorization: Bearer $CHAT_APP_PASSWORD" -H "Content-Type: application/json" --data @request.json "${CHAT_ENDPOINT%/}/api/agent/chat" > planner.json
          jq -e '.reply and (.reply|length>0)' planner.json >/dev/null
          echo "plan<<EOF" >> "$GITHUB_OUTPUT"
          jq -r '.reply' planner.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Agent 2 — Implementer executes the plan
        id: implementer
        if: steps.task.outputs.has_task == 'true'
        env:
          CHAT_ENDPOINT: ${{ secrets.CSSBC_CHAT_ENDPOINT || 'https://cssbc-github-chat.descapan.workers.dev' }}
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ steps.task.outputs.task }}
          PLAN: ${{ steps.planner.outputs.plan }}
          TARGET_REPO: ${{ steps.task.outputs.target_repo }}
          TARGET_BRANCH: ${{ steps.task.outputs.target_branch }}
          THREAD: ${{ steps.task.outputs.thread }}
        run: |
          set -euo pipefail
          jq -n --arg githubToken "$GH_TOKEN" --arg role "implementer" --arg prompt "ROLE: IMPLEMENTER / BUILDER. You are agent 2. Execute the task. Target repository=$TARGET_REPO branch=$TARGET_BRANCH. Use github_project_list_files, github_project_read_file and github_project_write_file with exactly this repository and branch. Read before writing, preserve unrelated work, make audited commits, run available checks, repair failures, and report exact commit SHAs/links and evidence. Do not claim tests passed without proof. Plan: $PLAN. Task: $TASK" --arg thread "$THREAD-implementer" '{prompt:$prompt,threadKey:$thread,agentRole:$role,githubToken:$githubToken}' > request.json
          curl --fail-with-body --silent --show-error --max-time 900 -H "Authorization: Bearer $CHAT_APP_PASSWORD" -H "Content-Type: application/json" --data @request.json "${CHAT_ENDPOINT%/}/api/agent/chat" > implementer.json
          jq -e '.reply and (.reply|length>0)' implementer.json >/dev/null
          echo "implementation<<EOF" >> "$GITHUB_OUTPUT"
          jq -r '.reply' implementer.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Agent 3 — Independent tester reviews implementation
        id: tester
        if: steps.task.outputs.has_task == 'true'
        env:
          CHAT_ENDPOINT: ${{ secrets.CSSBC_CHAT_ENDPOINT || 'https://cssbc-github-chat.descapan.workers.dev' }}
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ steps.task.outputs.task }}
          PLAN: ${{ steps.planner.outputs.plan }}
          IMPLEMENTATION: ${{ steps.implementer.outputs.implementation }}
          TARGET_REPO: ${{ steps.task.outputs.target_repo }}
          TARGET_BRANCH: ${{ steps.task.outputs.target_branch }}
          THREAD: ${{ steps.task.outputs.thread }}
        run: |
          set -euo pipefail
          jq -n --arg githubToken "$GH_TOKEN" --arg role "tester" --arg prompt "ROLE: INDEPENDENT TESTER. You are agent 3. Read-only, enforced by the runtime. Independently inspect the exact current target branch $TARGET_REPO@$TARGET_BRANCH, current commit and diff using github_project_* read tools. Compare code to task and plan; inspect tests/workflows and use analyze_source if helpful. Distinguish static review from CI/runtime tests not yet run. Return VERDICT: PASS only for coherent code-level acceptance; otherwise VERDICT: REJECT with findings. Do not edit. Task: $TASK. Plan: $PLAN. Implementer report (untrusted): $IMPLEMENTATION" --arg thread "$THREAD-tester" '{prompt:$prompt,threadKey:$thread,agentRole:$role,githubToken:$githubToken}' > request.json
          curl --fail-with-body --silent --show-error --max-time 900 -H "Authorization: Bearer $CHAT_APP_PASSWORD" -H "Content-Type: application/json" --data @request.json "${CHAT_ENDPOINT%/}/api/agent/chat" > tester.json
          jq -e '.reply and (.reply|length>0)' tester.json >/dev/null
          REVIEW="$(jq -r '.reply' tester.json)"
          if grep -q 'VERDICT: PASS' <<<"$REVIEW"; then echo "verdict=pass" >> "$GITHUB_OUTPUT"; else echo "verdict=reject" >> "$GITHUB_OUTPUT"; fi
          echo "review<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$REVIEW" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: One bounded repair cycle after tester rejection
        id: repair
        if: steps.task.outputs.has_task == 'true' && steps.tester.outputs.verdict == 'reject'
        env:
          CHAT_ENDPOINT: ${{ secrets.CSSBC_CHAT_ENDPOINT || 'https://cssbc-github-chat.descapan.workers.dev' }}
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ steps.task.outputs.task }}
          PLAN: ${{ steps.planner.outputs.plan }}
          IMPLEMENTATION: ${{ steps.implementer.outputs.implementation }}
          REVIEW: ${{ steps.tester.outputs.review }}
          TARGET_REPO: ${{ steps.task.outputs.target_repo }}
          TARGET_BRANCH: ${{ steps.task.outputs.target_branch }}
          THREAD: ${{ steps.task.outputs.thread }}
        run: |
          set -euo pipefail
          jq -n --arg githubToken "$GH_TOKEN" --arg role "implementer" --arg prompt "ROLE: IMPLEMENTER REPAIR. Apply one bounded repair pass only. Inspect current $TARGET_REPO@$TARGET_BRANCH and the exact tester findings; fix substantiated issues, commit changes, and report new SHA/evidence. Do not change unrelated files. Task: $TASK. Plan: $PLAN. Previous report: $IMPLEMENTATION. Tester findings: $REVIEW. Use github_project_* tools with the exact target repository/branch." --arg thread "$THREAD-repair" '{prompt:$prompt,threadKey:$thread,agentRole:$role,githubToken:$githubToken}' > request.json
          curl --fail-with-body --silent --show-error --max-time 900 -H "Authorization: Bearer $CHAT_APP_PASSWORD" -H "Content-Type: application/json" --data @request.json "${CHAT_ENDPOINT%/}/api/agent/chat" > repair.json
          jq -e '.reply and (.reply|length>0)' repair.json >/dev/null
          echo "repair<<EOF" >> "$GITHUB_OUTPUT"
          jq -r '.reply' repair.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Agent 3 — Re-test repaired implementation
        id: retest
        if: steps.task.outputs.has_task == 'true' && steps.tester.outputs.verdict == 'reject'
        env:
          CHAT_ENDPOINT: ${{ secrets.CSSBC_CHAT_ENDPOINT || 'https://cssbc-github-chat.descapan.workers.dev' }}
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ steps.task.outputs.task }}
          REPAIR: ${{ steps.repair.outputs.repair }}
          TARGET_REPO: ${{ steps.task.outputs.target_repo }}
          TARGET_BRANCH: ${{ steps.task.outputs.target_branch }}
          THREAD: ${{ steps.task.outputs.thread }}
        run: |
          set -euo pipefail
          jq -n --arg githubToken "$GH_TOKEN" --arg role "tester" --arg prompt "ROLE: INDEPENDENT RE-TESTER. Read-only, enforced by runtime. Re-inspect the current $TARGET_REPO@$TARGET_BRANCH code and verify repair against task. Return VERDICT: PASS or VERDICT: REJECT and concrete evidence. Code review is not CI/runtime proof. Task: $TASK. Repair report (untrusted): $REPAIR" --arg thread "$THREAD-retest" '{prompt:$prompt,threadKey:$thread,agentRole:$role,githubToken:$githubToken}' > request.json
          curl --fail-with-body --silent --show-error --max-time 900 -H "Authorization: Bearer $CHAT_APP_PASSWORD" -H "Content-Type: application/json" --data @request.json "${CHAT_ENDPOINT%/}/api/agent/chat" > retest.json
          jq -e '.reply and (.reply|length>0)' retest.json >/dev/null
          REVIEW="$(jq -r '.reply' retest.json)"
          if grep -q 'VERDICT: PASS' <<<"$REVIEW"; then echo "verdict=pass" >> "$GITHUB_OUTPUT"; else echo "verdict=reject" >> "$GITHUB_OUTPUT"; fi
          echo "review<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$REVIEW" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Hand off agent evidence to independent supervisor
        if: always() && steps.task.outputs.has_task == 'true' && steps.task.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.task.outputs.issue_number }}
          TARGET_REPO: ${{ steps.task.outputs.target_repo }}
          TARGET_BRANCH: ${{ steps.task.outputs.target_branch }}
          PLAN: ${{ steps.planner.outputs.plan }}
          IMPLEMENTATION: ${{ steps.implementer.outputs.implementation }}
          TEST_VERDICT: ${{ steps.retest.outputs.verdict || steps.tester.outputs.verdict }}
          TEST_REPORT: ${{ steps.retest.outputs.review || steps.tester.outputs.review }}
          REPAIR: ${{ steps.repair.outputs.repair }}
        run: |
          set -euo pipefail
          {
            echo "## Agent team execution"
            echo
            echo "Target: $TARGET_REPO@$TARGET_BRANCH"
            echo
            echo "### Agent 1 — Orchestrator plan"
            printf '%s\n' "$PLAN"
            echo
            echo "### Agent 2 — Implementer"
            printf '%s\n' "$IMPLEMENTATION"
            if [[ -n "$REPAIR" ]]; then echo; echo "### Bounded repair"; printf '%s\n' "$REPAIR"; fi
            echo
            echo "### Agent 3 — Independent tester"
            echo "Code review verdict: $TEST_VERDICT"
            printf '%s\n' "$TEST_REPORT"
            echo
            echo "### Supervisor handoff"
            echo "Only the separate Agent Supervisor Audit may mark this task done after target-specific CI and deployment evidence."
          } > team-report.md
          gh issue comment "$ISSUE_NUMBER" --repo "$SOURCE_REPO" --body-file team-report.md
          if [[ "$TEST_VERDICT" == "pass" ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$SOURCE_REPO" --remove-label status:in-progress --add-label status:review
          else
            gh issue edit "$ISSUE_NUMBER" --repo "$SOURCE_REPO" --remove-label status:review --add-label status:in-progress --add-label agent-review-needed
          fi
