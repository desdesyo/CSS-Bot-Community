name: Agent Supervisor Audit

on:
  schedule:
    - cron: "43 */4 * * *"
  workflow_dispatch:
  issues:
    types: [opened, edited, labeled, unlabeled, closed]
  workflow_run:
    workflows: ["CSSBC Agent Orchestrator", "GitHub Chat checks", "Deploy GitHub Chat to Cloudflare"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: cssbc-agent-supervisor-${{ github.event.issue.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  audit-and-review:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'agent-task')
    runs-on: ubuntu-latest
    steps:
      - name: Audit task lifecycle and perform independent reviewer pass
        env:
          GH_TOKEN: ${{ github.token }}
          CHAT_ENDPOINT: ${{ secrets.CSSBC_CHAT_ENDPOINT || 'https://cssbc-github-chat.descapan.workers.dev' }}
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          NAMES=('agent-task' 'agent-generated' 'agent-review-needed' 'status:queued' 'status:in-progress' 'status:review' 'status:done')
          for name in "${NAMES[@]}"; do
            gh label create "$name" --repo "$REPO" --color 1d76db --force >/dev/null 2>&1 || true
          done
          ISSUES="$(gh api "repos/$REPO/issues?state=open&labels=agent-task&per_page=100")"
          has_section_content() {
            awk -v heading="$1" '
              $0 == heading { found=1; next }
              found && /^## / { exit }
              found && /[^[:space:]]/ { ok=1 }
              END { exit !ok }
            ' <<< "$BODY"
          }
          echo "$ISSUES" | jq -c '.[] | select(.pull_request==null) | {number,title,body,labels:[.labels[].name]}' | while IFS= read -r row; do
            NUMBER="$(jq -r .number <<<"$row")"
            BODY="$(jq -r .body <<<"$row")"
            LABELS="$(jq -r '.labels[]' <<<"$row")"
            VIOLATIONS=()
            grep -Eq 'Task-Key: [A-Z0-9-]+' <<<"$BODY" || VIOLATIONS+=("missing Task-Key")
            has_section_content "## Objective" || VIOLATIONS+=("missing/empty Objective")
            has_section_content "## Acceptance criteria" || VIOLATIONS+=("missing Acceptance criteria")
            grep -q '## Evidence' <<<"$BODY" || VIOLATIONS+=("missing Evidence section")
            STATUS_COUNT="$(grep -Ec '^status:' <<<"$LABELS" || true)"
            [[ "$STATUS_COUNT" == "1" ]] || VIOLATIONS+=("exactly one status:* label required")
            if grep -qx 'status:done' <<<"$LABELS"; then
              grep -Eq 'Implementation: https?://' <<<"$BODY" || VIOLATIONS+=("done without implementation link")
              grep -Eq 'Verification run: https?://' <<<"$BODY" || VIOLATIONS+=("done without verification run link")
            fi
            if [[ "${#VIOLATIONS[@]}" -gt 0 ]]; then
              REPORT="### Supervisor audit — review required"$'\n'"- $(printf '%s\n' "${VIOLATIONS[@]}" | paste -sd '; ' -)"
              gh issue edit "$NUMBER" --repo "$REPO" --add-label agent-review-needed >/dev/null
              gh issue comment "$NUMBER" --repo "$REPO" --body "$REPORT" >/dev/null
              continue
            fi
            gh issue edit "$NUMBER" --repo "$REPO" --remove-label agent-review-needed >/dev/null 2>&1 || true
            if grep -qx 'status:review' <<<"$LABELS"; then
              if [[ -z "$CHAT_ENDPOINT" || -z "$CHAT_APP_PASSWORD" ]]; then
                gh issue comment "$NUMBER" --repo "$REPO" --body "Supervisor AI review skipped: CSSBC_CHAT_APP_PASSWORD is missing. Structural audit only; this is not an approval." >/dev/null
                gh issue edit "$NUMBER" --repo "$REPO" --add-label agent-review-needed >/dev/null
                continue
              fi
              HEAD_SHA="$(gh api "repos/$REPO/commits/github-chat-prototype" --jq .sha)"
              RUNS="$(gh api "repos/$REPO/actions/runs?branch=github-chat-prototype&per_page=40")"
              CI_STATE="$(jq -r '[.workflow_runs[]|select(.name=="GitHub Chat checks")][0] | if . == null then "none" else ((.id|tostring)+":"+.status+":" + (.conclusion//"pending")+":"+.head_sha) end' <<<"$RUNS")"
              CI_MATCH="$(jq -r --arg sha "$HEAD_SHA" '[.workflow_runs[]|select(.name=="GitHub Chat checks")][0] | (. != null and .status=="completed" and .conclusion=="success" and .head_sha==$sha)' <<<"$RUNS")"
              CI_URL="$(jq -r '[.workflow_runs[]|select(.name=="GitHub Chat checks")][0].html_url // empty' <<<"$RUNS")"
              DEPLOY_RUN="$(jq -c '[.workflow_runs[]|select(.name=="Deploy GitHub Chat to Cloudflare" and .status=="completed" and .conclusion=="success")][0] // empty' <<<"$RUNS")"
              DEPLOY_SHA="$(jq -r '.head_sha // empty' <<<"$DEPLOY_RUN")"
              DEPLOY_STATE="$(jq -r '[.workflow_runs[]|select(.name=="Deploy GitHub Chat to Cloudflare")][0] | if . == null then "none" else ((.id|tostring)+":"+.status+":" + (.conclusion//"pending")+":"+.head_sha) end' <<<"$RUNS")"
              if [[ -z "$DEPLOY_SHA" ]]; then CHANGED_SINCE_DEPLOY='["web-chat/deployment-not-yet-verified"]'
              elif [[ "$DEPLOY_SHA" == "$HEAD_SHA" ]]; then CHANGED_SINCE_DEPLOY='[]'
              else CHANGED_SINCE_DEPLOY="$(gh api "repos/$REPO/compare/$DEPLOY_SHA...$HEAD_SHA" --jq '[.files[].filename]' || echo '["web-chat/deployment-diff-unavailable"]')"; fi
              DEPLOY_REQUIRED="$(jq -r 'any(.[]; startswith("web-chat/") or .==".github/workflows/deploy-github-chat.yml")' <<<"$CHANGED_SINCE_DEPLOY")"
              DEPLOY_MATCH="$(jq -r --arg sha "$HEAD_SHA" '[.workflow_runs[]|select(.name=="Deploy GitHub Chat to Cloudflare")][0] | (. != null and .status=="completed" and .conclusion=="success" and .head_sha==$sha)' <<<"$RUNS")"
              DEPLOY_OK="$([[ "$DEPLOY_REQUIRED" == "false" || "$DEPLOY_MATCH" == "true" ]] && echo true || echo false)"
              REVIEW_MARKER="<!-- supervisor-review:$HEAD_SHA:$CI_STATE:$DEPLOY_STATE:required=$DEPLOY_REQUIRED -->"
              COMMENTS="$(gh api "repos/$REPO/issues/$NUMBER/comments?per_page=100")"
              if jq -e --arg marker "$REVIEW_MARKER" 'any(.[]; (.body//"")|contains($marker))' <<<"$COMMENTS" >/dev/null; then
                echo "Supervisor already reviewed this exact code/CI state for issue #$NUMBER."
                continue
              fi
              PROMPT="INDEPENDENT SUPERVISOR REVIEW — READ ONLY. FIRST read web-chat/AGENT_TEAM_EXECUTION_PLAYBOOK.md and enforce its acceptance contract. Review issue #$NUMBER in $REPO. Current branch head is $HEAD_SHA. Latest GitHub Chat checks state is $CI_STATE. Latest deployment state is $DEPLOY_STATE. Deployment required for this commit=$DEPLOY_REQUIRED and exact deployment match=$DEPLOY_MATCH. Do not edit files, create commits, open PRs, or change issue labels. Fetch the issue, acceptance criteria, exact current commit diff, and relevant successful GitHub Actions logs. Check that implementation really meets each criterion, that the exact current commit passed GitHub Chat checks, that deployment passed for this exact commit whenever web-chat/** changed, and that no required workflow is queued/failed/skipped. Return exactly: VERDICT: PASS or VERDICT: REJECT; then criterion-by-criterion evidence with links; then missing evidence/blockers. If evidence is insufficient, REJECT. Do not treat your own reasoning as a test."
              jq -n --arg prompt "$PROMPT" --arg thread "cssbc-supervisor-review-$NUMBER" --arg role "supervisor" --arg githubToken "$GH_TOKEN" '{prompt:$prompt,threadKey:$thread,agentRole:$role,githubToken:$githubToken}' > reviewer.json
              CODE="$(curl --silent --show-error --max-time 600 -o review.json -w '%{http_code}' -H "Authorization: Bearer $CHAT_APP_PASSWORD" -H "Content-Type: application/json" --data @reviewer.json "${CHAT_ENDPOINT%/}/api/agent/chat" || true)"
              if [[ "$CODE" != "200" ]] || ! jq -e '.reply and (.reply|length>0)' review.json >/dev/null 2>&1; then
                gh issue comment "$NUMBER" --repo "$REPO" --body "Supervisor AI review could not run (HTTP $CODE). Task remains in review; no approval granted." >/dev/null
                gh issue edit "$NUMBER" --repo "$REPO" --add-label agent-review-needed >/dev/null
                continue
              fi
              { printf '%s\n\n' "$REVIEW_MARKER"; jq -r '.reply' review.json; } > review-report.md
              gh issue comment "$NUMBER" --repo "$REPO" --body-file review-report.md >/dev/null
              if grep -q 'VERDICT: PASS' review-report.md && [[ "$CI_MATCH" == "true" ]] && [[ "$DEPLOY_OK" == "true" ]] && [[ -n "$CI_URL" ]]; then
                UPDATED_BODY="$(printf '%s\n' "$BODY" | sed -E "s#- Implementation: _?pending_?#- Implementation: https://github.com/$REPO/commit/$HEAD_SHA#" | sed -E "s#- Verification run: _?pending_?#- Verification run: $CI_URL#")"
                gh api -X PATCH "repos/$REPO/issues/$NUMBER" -f body="$UPDATED_BODY" >/dev/null
                gh issue edit "$NUMBER" --repo "$REPO" --remove-label status:review --remove-label agent-review-needed --add-label status:done >/dev/null
                gh issue comment "$NUMBER" --repo "$REPO" --body "Supervisor PASS: current branch commit passed GitHub Chat checks and the latest deployment smoke test succeeded. Task moved to status:done." >/dev/null
              else
                gh issue edit "$NUMBER" --repo "$REPO" --add-label agent-review-needed >/dev/null
                if [[ "$CI_MATCH" != "true" || "$DEPLOY_OK" != "true" ]]; then
                  gh issue comment "$NUMBER" --repo "$REPO" --body "Supervisor gate: current commit CI match=$CI_MATCH; deployment required=$DEPLOY_REQUIRED; exact deployment match=$DEPLOY_MATCH. A reviewer PASS cannot override missing, queued, failed or mismatched verification." >/dev/null
                fi
              fi
            fi
          done
          echo "Supervisor audit finished. AI review is a separate read-only instruction pass; only evidence-backed PASS removes the review-needed label."
