name: Agent Supervisor Audit

on:
  schedule:
    - cron: "43 */4 * * *"
  workflow_dispatch:
  issues:
    types: [opened, edited, labeled, unlabeled, closed]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'agent-task')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const names=['agent-task','agent-generated','agent-review-needed','status:queued','status:in-progress','status:review','status:done'];
            for(const name of names){
              try{await github.rest.issues.getLabel({owner,repo,name});}
              catch(e){if(e.status===404) await github.rest.issues.createLabel({owner,repo,name,color:name==='agent-review-needed'?'d73a4a':'1d76db'});else throw e;}
            }
            const issues=await github.paginate(github.rest.issues.listForRepo,{owner,repo,state:'open',labels:'agent-task',per_page:100});
            for(const issue of issues){
              if(issue.pull_request) continue;
              const body=issue.body||'';
              const violations=[];
              if(!/Task-Key: [A-Z0-9-]+/.test(body)) violations.push('missing Task-Key');
              if(!/## Objective[\s\S]{10,}/.test(body)) violations.push('missing/empty Objective');
              if(!/## Acceptance criteria[\s\S]{10,}/.test(body)) violations.push('missing Acceptance criteria');
              if(!/## Evidence/.test(body)) violations.push('missing Evidence section');
              const status=issue.labels.map(l=>l.name).filter(n=>n.startsWith('status:'));
              if(status.length!==1) violations.push('exactly one status:* label required');
              if(status[0]==='status:done' && (!/Implementation: https?:\/\//.test(body)||!/Verification run: https?:\/\//.test(body))) violations.push('done without implementation + verification links');
              const marker='<!-- supervisor-audit -->';
              const report=violations.length ? `${marker}\n### ⚠️ Supervisor audit\n- ${violations.join('\n- ')}\n\nCorrect these items before moving the task forward.` : `${marker}\n### ✅ Supervisor audit\nRequired structure and evidence fields are present. This is a policy check, **not** proof that the implementation is correct.`;
              const comments=await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number:issue.number,per_page:100});
              const prior=comments.find(c=>c.body.startsWith(marker));
              if(!prior || prior.body!==report){
                if(prior) await github.rest.issues.updateComment({owner,repo,comment_id:prior.id,body:report});
                else await github.rest.issues.createComment({owner,repo,issue_number:issue.number,body:report});
              }
              const has=issue.labels.some(l=>l.name==='agent-review-needed');
              if(violations.length&&!has) await github.rest.issues.addLabels({owner,repo,issue_number:issue.number,labels:['agent-review-needed']});
              if(!violations.length&&has) await github.rest.issues.removeLabel({owner,repo,issue_number:issue.number,name:'agent-review-needed'});
              core.info(`Issue #${issue.number}: ${violations.length?'review needed':'structure OK'}`);
            }
            core.notice(`Audited ${issues.length} agent tasks`);
