name: Agent Supervisor Audit

on:
  schedule:
    - cron: "43 */4 * * *"
  workflow_dispatch:
  issues:
    types: [opened, edited, labeled, unlabeled, closed]
  workflow_run:
    workflows: ["CSSBC Agent Orchestrator", "GitHub Chat checks", "Deploy GitHub Chat to Cloudflare"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: cssbc-agent-supervisor-${{ github.event.issue.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  audit-and-review:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'agent-task')
    runs-on: ubuntu-latest
    steps:
      - name: Audit task lifecycle and perform independent reviewer pass
        env:
          GH_TOKEN: ${{ github.token }}
          CHAT_ENDPOINT: ${{ secrets.CSSBC_CHAT_ENDPOINT }}
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          NAMES=('agent-task' 'agent-generated' 'agent-review-needed' 'status:queued' 'status:in-progress' 'status:review' 'status:done')
          for name in "${NAMES[@]}"; do
            gh label create "$name" --repo "$REPO" --color 1d76db --force >/dev/null 2>&1 || true
          done
          ISSUES="$(gh api "repos/$REPO/issues?state=open&labels=agent-task&per_page=100")"
          echo "$ISSUES" | jq -c '.[] | select(.pull_request==null) | {number,title,body,labels:[.labels[].name]}' | while IFS= read -r row; do
            NUMBER="$(jq -r .number <<<"$row")"
            BODY="$(jq -r .body <<<"$row")"
            LABELS="$(jq -r '.labels[]' <<<"$row")"
            VIOLATIONS=()
            grep -Eq 'Task-Key: [A-Z0-9-]+' <<<"$BODY" || VIOLATIONS+=("missing Task-Key")
            grep -Eq '## Objective[[:space:][:print:]]{10,}' <<<"$BODY" || VIOLATIONS+=("missing/empty Objective")
            grep -Eq '## Acceptance criteria[[:space:][:print:]]{10,}' <<<"$BODY" || VIOLATIONS+=("missing Acceptance criteria")
            grep -q '## Evidence' <<<"$BODY" || VIOLATIONS+=("missing Evidence section")
            STATUS_COUNT="$(grep -Ec '^status:' <<<"$LABELS" || true)"
            [[ "$STATUS_COUNT" == "1" ]] || VIOLATIONS+=("exactly one status:* label required")
            if [[ "${#VIOLATIONS[@]}" -gt 0 ]]; then
              REPORT="### Supervisor audit — review required"$'\n'"- $(printf '%s\n' "${VIOLATIONS[@]}" | paste -sd '; ' -)"
              gh issue edit "$NUMBER" --repo "$REPO" --add-label agent-review-needed >/dev/null
              gh issue comment "$NUMBER" --repo "$REPO" --body "$REPORT" >/dev/null
              continue
            fi
            gh issue edit "$NUMBER" --repo "$REPO" --remove-label agent-review-needed >/dev/null 2>&1 || true
            if grep -qx 'status:review' <<<"$LABELS"; then
              if [[ -z "$CHAT_ENDPOINT" || -z "$CHAT_APP_PASSWORD" ]]; then
                gh issue comment "$NUMBER" --repo "$REPO" --body "Supervisor AI review skipped: CSSBC_CHAT_ENDPOINT or CSSBC_CHAT_APP_PASSWORD is missing. Structural audit only; this is not an approval." >/dev/null
                continue
              fi
              HEAD_SHA="$(gh api "repos/$REPO/commits/github-chat-prototype" --jq .sha)"
              RUNS="$(gh api "repos/$REPO/actions/runs?branch=github-chat-prototype&per_page=40")"
              CI_STATE="$(jq -r '[.workflow_runs[]|select(.name=="GitHub Chat checks")][0] | if . == null then "none" else ((.id|tostring)+":"+.status+":" + (.conclusion//"pending")) end' <<<"$RUNS")"
              REVIEW_MARKER="<!-- supervisor-review:$HEAD_SHA:$CI_STATE -->"
              COMMENTS="$(gh api "repos/$REPO/issues/$NUMBER/comments?per_page=100")"
              if jq -e --arg marker "$REVIEW_MARKER" 'any(.[]; (.body//"")|contains($marker))' <<<"$COMMENTS" >/dev/null; then
                echo "Supervisor already reviewed this exact code/CI state for issue #$NUMBER."
                continue
              fi
              PROMPT="INDEPENDENT SUPERVISOR REVIEW — READ ONLY. Review issue #$NUMBER in $REPO. Current branch head is $HEAD_SHA. Latest GitHub Chat checks state is $CI_STATE. Do not edit files, create commits, open PRs, or change issue labels. Fetch the issue, acceptance criteria, exact current commit diff, and relevant successful GitHub Actions logs. Check that implementation really meets each criterion, that the exact commit was tested, that no required workflow is queued/failed/skipped, and that the report does not overclaim. Return exactly: VERDICT: PASS or VERDICT: REJECT; then criterion-by-criterion evidence with links; then missing evidence/blockers. If the evidence is insufficient, REJECT. Do not treat your own reasoning as a test."
              jq -n --arg prompt "$PROMPT" --arg thread "cssbc-supervisor-review-$NUMBER" '{prompt:$prompt,threadKey:$thread}' > reviewer.json
              CODE="$(curl --silent --show-error --max-time 600 -o review.json -w '%{http_code}' -H "Authorization: Bearer $CHAT_APP_PASSWORD" -H "Content-Type: application/json" --data @reviewer.json "${CHAT_ENDPOINT%/}/api/agent/chat" || true)"
              if [[ "$CODE" != "200" ]] || ! jq -e '.reply and (.reply|length>0)' review.json >/dev/null 2>&1; then
                gh issue comment "$NUMBER" --repo "$REPO" --body "Supervisor AI review could not run (HTTP $CODE). Task remains in review; no approval granted." >/dev/null
                gh issue edit "$NUMBER" --repo "$REPO" --add-label agent-review-needed >/dev/null
                continue
              fi
              { printf '%s\n\n' "$REVIEW_MARKER"; jq -r '.reply' review.json; } > review-report.md
              gh issue comment "$NUMBER" --repo "$REPO" --body-file review-report.md >/dev/null
              if grep -q 'VERDICT: PASS' review-report.md; then
                gh issue edit "$NUMBER" --repo "$REPO" --remove-label agent-review-needed >/dev/null 2>&1 || true
              else
                gh issue edit "$NUMBER" --repo "$REPO" --add-label agent-review-needed >/dev/null
              fi
            fi
          done
          echo "Supervisor audit finished. AI review is a separate read-only instruction pass; only evidence-backed PASS removes the review-needed label."
