name: Deploy GitHub Chat to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - github-chat-prototype
    paths:
      - "web-chat/**"
      - ".github/workflows/deploy-github-chat.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install chat dependencies
        working-directory: web-chat
        run: npm install

      - name: Type-check runtime
        working-directory: web-chat
        run: npm run check

      - name: Run chat regression tests
        working-directory: web-chat
        run: npm test

      - name: Ensure private attachment KV namespace exists
        working-directory: web-chat
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          headers=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          listing="$(curl -fsS "${headers[@]}" "$api")"
          namespace_id="$(jq -r '.result[] | select(.title == "SOLO_CHAT_FILES") | .id' <<< "$listing" | head -n1)"
          if [ -z "$namespace_id" ] || [ "$namespace_id" = "null" ]; then
            created="$(curl -fsS -X POST "${headers[@]}" "$api" --data '{"title":"SOLO_CHAT_FILES"}')"
            namespace_id="$(jq -r '.result.id // empty' <<< "$created")"
          fi
          if [ -z "$namespace_id" ] || [ "$namespace_id" = "null" ]; then
            echo "::error::Could not create or locate the SOLO_CHAT_FILES KV namespace."
            exit 1
          fi
          sed -i "s/KV_NAMESPACE_ID/$namespace_id/" wrangler.toml

      - name: Sync chat password and deploy Worker
        working-directory: web-chat
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          CHAT_GITHUB_TOKEN: ${{ secrets.CSSBC_GITHUB_TOKEN }}
          CHAT_OPENAI_API_KEY: ${{ secrets.CSSBC_OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$CHAT_APP_PASSWORD" ]; then
            echo "::error::Missing CSSBC_CHAT_APP_PASSWORD in CSS-Bot-Community repository secrets."
            exit 1
          fi
          printf '%s' "$CHAT_APP_PASSWORD" | npx wrangler versions secret put APP_PASSWORD
          if [ -n "$CHAT_GITHUB_TOKEN" ]; then
            printf '%s' "$CHAT_GITHUB_TOKEN" | npx wrangler versions secret put GITHUB_TOKEN
          else
            echo "CSSBC_GITHUB_TOKEN is not set; deploying chat without GitHub workspace write tools."
          fi
          if [ -n "$CHAT_OPENAI_API_KEY" ]; then
            printf '%s' "$CHAT_OPENAI_API_KEY" | npx wrangler versions secret put OPENAI_API_KEY
          else
            echo "CSSBC_OPENAI_API_KEY is not set; automatic external-expert escalation will report unavailable."
          fi
          npx wrangler deploy --config wrangler.toml
