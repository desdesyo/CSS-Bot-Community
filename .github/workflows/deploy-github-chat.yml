name: Deploy GitHub Chat to Cloudflare

on:
  push:
    branches:
      - github-chat-prototype
    paths:
      - "web-chat/**"
      - ".github/workflows/deploy-github-chat.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch to deploy
        required: true
        default: github-chat-prototype
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout chat source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install chat dependencies
        working-directory: web-chat
        run: npm install

      - name: Type-check runtime
        working-directory: web-chat
        run: npm run check

      - name: Sync chat credentials and deploy Worker
        working-directory: web-chat
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          CHAT_GITHUB_TOKEN: ${{ secrets.CSSBC_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CHAT_APP_PASSWORD" ]; then
            echo "::error::Missing CSSBC_CHAT_APP_PASSWORD in repository secrets."
            exit 1
          fi
          if [ -z "$CHAT_GITHUB_TOKEN" ]; then
            echo "::error::Missing CSSBC_GITHUB_TOKEN. Add a fine-grained PAT with Contents read/write access to desdesyo/modhaul."
            exit 1
          fi
          printf '%s' "$CHAT_APP_PASSWORD" | npx wrangler versions secret put APP_PASSWORD
          printf '%s' "$CHAT_GITHUB_TOKEN" | npx wrangler versions secret put GITHUB_TOKEN
          npx wrangler deploy --config wrangler.toml
