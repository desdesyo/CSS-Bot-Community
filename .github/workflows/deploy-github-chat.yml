name: Deploy GitHub Chat to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - github-chat-prototype
    paths:
      - "web-chat/agent-runtime/**"
      - "web-chat/public/**"
      - "web-chat/worker.js"
      - "web-chat/wrangler.toml"
      - "web-chat/package.json"
      - "web-chat/package-lock.json"
      - "web-chat/tester.mjs"
      - ".github/workflows/deploy-github-chat.yml"

permissions:
  contents: read

concurrency:
  group: solo-chat-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install chat dependencies
        working-directory: web-chat
        run: npm install

      - name: Type-check runtime
        working-directory: web-chat
        run: npm run check

      - name: Run chat regression tests
        working-directory: web-chat
        run: npm test

      # Attachments are stored in chunked Durable Object storage; no R2/KV account setup is required.
      - name: Sync chat password and deploy Worker
        working-directory: web-chat
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          CHAT_GITHUB_TOKEN: ${{ secrets.CSSBC_GITHUB_TOKEN }}
          CHAT_OPENAI_API_KEY: ${{ secrets.CSSBC_OPENAI_API_KEY }}
          CHAT_OPENROUTER_API_KEY: ${{ secrets.CSSBC_OPENROUTER_API_KEY }}
          CHAT_GEMINI_API_KEY: ${{ secrets.CSSBC_GEMINI_API_KEY }}
          CHAT_GROQ_API_KEY: ${{ secrets.CSSBC_GROQ_API_KEY }}
          CHAT_SOLO_AI_API_KEY: ${{ secrets.SOLO_AI_API_KEY }}
          CHAT_SOLO_AI_BASE_URL: ${{ vars.SOLO_AI_BASE_URL }}
          CHAT_SOLO_AI_MODEL: ${{ vars.SOLO_AI_MODEL }}
          CHAT_MESHY_API_KEY: ${{ secrets.CSSBC_MESHY_API_KEY }}
          CHAT_IMAGE_PROVIDER_ORDER: ${{ secrets.CSSBC_IMAGE_PROVIDER_ORDER }}
          CHAT_COMPUTE_WORKER_TOKEN: ${{ secrets.CSSBC_SOLO_COMPUTE_WORKER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CHAT_APP_PASSWORD" ]; then
            echo "::error::Missing CSSBC_CHAT_APP_PASSWORD in CSS-Bot-Community repository secrets."
            exit 1
          fi
          printf '%s' "$CHAT_APP_PASSWORD" | npx wrangler secret put APP_PASSWORD
          if [ -n "$CHAT_COMPUTE_WORKER_TOKEN" ]; then
            printf '%s' "$CHAT_COMPUTE_WORKER_TOKEN" | npx wrangler secret put SOLO_COMPUTE_WORKER_TOKEN
          else
            echo "CSSBC_SOLO_COMPUTE_WORKER_TOKEN is unset; SOLO Compute workers must authenticate with the SOLO.Chat app password."
          fi
          if [ -n "$CHAT_GITHUB_TOKEN" ]; then
            printf '%s' "$CHAT_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN
          else
            echo "CSSBC_GITHUB_TOKEN is not set; deploying chat without GitHub workspace write tools."
          fi
          if [ -n "$CHAT_OPENAI_API_KEY" ]; then
            printf '%s' "$CHAT_OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY
          else
            echo "CSSBC_OPENAI_API_KEY is not set; automatic external-expert escalation will report unavailable."
          fi
          if [ -n "$CHAT_OPENROUTER_API_KEY" ]; then
            printf "%s" "$CHAT_OPENROUTER_API_KEY" | npx wrangler secret put OPENROUTER_API_KEY
          else
            echo "CSSBC_OPENROUTER_API_KEY is not set; OpenRouter multi-provider failover is disabled."
          fi
          if [ -n "$CHAT_GEMINI_API_KEY" ]; then
            printf "%s" "$CHAT_GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
          else
            echo "CSSBC_GEMINI_API_KEY is not set; direct Gemini fallback is disabled."
          fi
          if [ -n "$CHAT_GROQ_API_KEY" ]; then
            printf "%s" "$CHAT_GROQ_API_KEY" | npx wrangler secret put GROQ_API_KEY
          else
            echo "CSSBC_GROQ_API_KEY is not set; direct Groq fallback is disabled."
          fi
          if [ -n "$CHAT_SOLO_AI_API_KEY" ] && [ -n "$CHAT_SOLO_AI_BASE_URL" ]; then
            printf '%s' "$CHAT_SOLO_AI_API_KEY" | npx wrangler secret put SOLO_AI_API_KEY
            printf '%s' "$CHAT_SOLO_AI_BASE_URL" | npx wrangler secret put SOLO_AI_BASE_URL
            if [ -n "$CHAT_SOLO_AI_MODEL" ]; then
              printf '%s' "$CHAT_SOLO_AI_MODEL" | npx wrangler secret put SOLO_AI_MODEL
            fi
            echo "Self-hosted SOLO.AI is configured as the first tool-capable model candidate."
          else
            echo "SOLO_AI_API_KEY or SOLO_AI_BASE_URL is missing; self-hosted SOLO.AI remains disabled."
          fi
          if [ -n "$CHAT_MESHY_API_KEY" ]; then
            printf '%s' "$CHAT_MESHY_API_KEY" | npx wrangler secret put MESHY_API_KEY
          else
            echo "CSSBC_MESHY_API_KEY is not set; 3D generation will report unavailable."
          fi
          if [ -n "$CHAT_IMAGE_PROVIDER_ORDER" ]; then
            printf '%s' "$CHAT_IMAGE_PROVIDER_ORDER" | npx wrangler secret put IMAGE_PROVIDER_ORDER
          else
            echo "IMAGE_PROVIDER_ORDER is unset; image generation remains Cloudflare FLUX.1 Schnell only (no paid fallback)."
          fi
          npx wrangler deploy --config wrangler.toml

      - name: Verify the deployed Worker health and version
        id: smoke
        env:
          CHAT_ENDPOINT: https://cssbc-github-chat.descapan.workers.dev
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CHAT_ENDPOINT" || { echo "::error::Missing CSSBC_CHAT_ENDPOINT for post-deploy smoke test"; exit 1; }
          test -n "$CHAT_APP_PASSWORD" || { echo "::error::Missing CSSBC_CHAT_APP_PASSWORD for post-deploy smoke test"; exit 1; }
          ENDPOINT="${CHAT_ENDPOINT%/}"
          echo "Checking authenticated Worker health immediately; retrying briefly only if Cloudflare propagation is still in progress."
          for attempt in $(seq 1 12); do
            CODE="$(curl --silent --show-error --max-time 20 -o health.json -w '%{http_code}' -H "Authorization: Bearer $CHAT_APP_PASSWORD" "$ENDPOINT/api/health" || true)"
            if [[ "$CODE" == "200" ]] && jq -e '.ok == true' health.json >/dev/null; then
              curl --fail-with-body --silent --show-error --max-time 20 -H "Authorization: Bearer $CHAT_APP_PASSWORD" "$ENDPOINT/api/version" | jq '{version,tag,timestamp}'
              echo "Post-deploy authenticated health and version check passed."
              exit 0
            fi
            echo "Health attempt $attempt/12 returned HTTP $CODE; waiting 5 seconds for deployment propagation."
            sleep 5
          done
          echo "::error::Deployed SOLO.Chat did not pass authenticated health check."
          exit 1

      - name: Verify live agent dashboard and model inference
        id: model_smoke
        env:
          CHAT_ENDPOINT: https://cssbc-github-chat.descapan.workers.dev
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          RUN_AGENT_SMOKE: ${{ vars.SOLO_EXTENDED_AGENT_SMOKE == 'true' }}
        run: |
          set -euo pipefail
          ENDPOINT="${CHAT_ENDPOINT%/}"
          echo "Checking the exact browser chat queue used by the UI..."
          BROWSER_OPERATION="deploy-browser-queue-$GITHUB_RUN_ID"
          jq -n --arg message "Reply exactly with SOLO_CHAT_BROWSER_QUEUE_OK and nothing else. Do not call tools." --arg operationId "$BROWSER_OPERATION" '{message:$message,files:[],webSearch:false,operationId:$operationId}' > browser-chat-request.json
          BROWSER_ACCEPT_CODE="$(curl --silent --show-error --max-time 30 -o browser-chat-accepted.json -w '%{http_code}' -H "Authorization: Bearer $CHAT_APP_PASSWORD" -H "Content-Type: application/json" --data @browser-chat-request.json "$ENDPOINT/api/chat" || true)"
          if [[ "$BROWSER_ACCEPT_CODE" != "202" ]] || ! jq -e '.operationId == "'"$BROWSER_OPERATION"'" and (.status == "queued" or .status == "done")' browser-chat-accepted.json >/dev/null; then
            echo "::error::Browser chat request was not accepted with HTTP $BROWSER_ACCEPT_CODE"
            cat browser-chat-accepted.json
            exit 1
          fi
          BROWSER_DONE=false
          BROWSER_CAPACITY_DEGRADED=false
          BROWSER_THREAD="$(jq -r '.thread' browser-chat-accepted.json)"
          for attempt in $(seq 1 240); do
            BROWSER_STATUS_CODE="$(curl --silent --show-error --max-time 20 -o browser-chat-status.json -w '%{http_code}' -H "Authorization: Bearer $CHAT_APP_PASSWORD" "$ENDPOINT/api/chat/status?operationId=$BROWSER_OPERATION" || true)"
            if [[ "$BROWSER_STATUS_CODE" != "200" ]]; then
              echo "Browser chat status attempt $attempt/240 returned HTTP $BROWSER_STATUS_CODE."
              sleep 2
              continue
            fi
            BROWSER_STATUS="$(jq -r '.status // "unknown"' browser-chat-status.json)"
            if [[ "$BROWSER_STATUS" == "failed" ]]; then
              BROWSER_ERROR="$(jq -r '.error // "unknown chat error"' browser-chat-status.json)"
              # Provider exhaustion/configuration is an inference-capacity state, not a code/deploy failure.
              # Match the structured sentinel plus known provider-router diagnostics (quota breaker,
              # missing credentials, and daily Workers AI limits). Never mask queue/API failures.
              if [[ "$BROWSER_ERROR" == *"SOLO_NO_PROVIDER_CAPACITY"* ]] ||
                 [[ "$BROWSER_ERROR" == *"circuit breaker"* ]] ||
                 [[ "$BROWSER_ERROR" == *"not configured"* ]] ||
                 [[ "$BROWSER_ERROR" == *"пропущен до"* ]] ||
                 [[ "$BROWSER_ERROR" == *"quota reset"* ]]; then
                echo "::warning::Worker is deployed and healthy, but live inference is unavailable because configured providers are exhausted or unavailable. This is provider-capacity degradation, not a deployment failure."
                BROWSER_CAPACITY_DEGRADED=true
                break
              fi
              echo "::error::Browser chat queue failed for a reason other than provider capacity."
              cat browser-chat-status.json
              exit 1
            fi
            if [[ "$BROWSER_STATUS" == "done" ]]; then
              if jq -e '.reply and (.reply|contains("SOLO_CHAT_BROWSER_QUEUE_OK"))' browser-chat-status.json >/dev/null; then
                BROWSER_DONE=true
                break
              fi
              echo "::error::Browser chat queue completed without the expected reply marker."
              cat browser-chat-status.json
              exit 1
            fi
            sleep 2
          done
          if [[ "$BROWSER_CAPACITY_DEGRADED" == "true" ]]; then
            # Exercise the same persistence endpoint used after WebGPU generation in the browser.
            # This synthetic probe verifies server completion/history only; it does not pretend
            # that GitHub Actions executed the browser's WebGPU model.
            LOCAL_FALLBACK_REPLY="SOLO_CHAT_LOCAL_FALLBACK_PERSISTENCE_OK (synthetic CI probe; browser WebGPU inference is separate)"
            jq -n --arg operationId "$BROWSER_OPERATION" --arg reply "$LOCAL_FALLBACK_REPLY" --arg model "Qwen2.5-0.5B-Instruct-q4f16_1-MLC" '{operationId:$operationId,reply:$reply,model:$model}' > local-fallback-complete.json
            LOCAL_COMPLETE_CODE="$(curl --silent --show-error --max-time 30 -o local-fallback-result.json -w '%{http_code}' -H "Authorization: Bearer $CHAT_APP_PASSWORD" -H "Content-Type: application/json" --data @local-fallback-complete.json "$ENDPOINT/api/chat/local-complete" || true)"
            if [[ "$LOCAL_COMPLETE_CODE" != "200" ]] || ! jq -e '.ok == true and .provider == "browser-local"' local-fallback-result.json >/dev/null; then
              echo "::error::Browser-local fallback completion could not finalize the failed chat operation (HTTP $LOCAL_COMPLETE_CODE)."
              cat local-fallback-result.json
              exit 1
            fi
            LOCAL_STATUS_CODE="$(curl --silent --show-error --max-time 30 -o local-fallback-status.json -w '%{http_code}' -H "Authorization: Bearer $CHAT_APP_PASSWORD" "$ENDPOINT/api/chat/status?operationId=$BROWSER_OPERATION" || true)"
            if [[ "$LOCAL_STATUS_CODE" != "200" ]] || ! jq -e '.status == "done" and .provider == "browser-local" and (.reply|contains("SOLO_CHAT_LOCAL_FALLBACK_PERSISTENCE_OK"))' local-fallback-status.json >/dev/null; then
              echo "::error::Browser-local fallback did not resolve the chat operation."
              cat local-fallback-status.json
              exit 1
            fi
            HISTORY_CODE="$(curl --silent --show-error --max-time 30 -o browser-chat-history.json -w '%{http_code}' -H "Authorization: Bearer $CHAT_APP_PASSWORD" "$ENDPOINT/api/messages?thread=$BROWSER_THREAD" || true)"
            if [[ "$HISTORY_CODE" != "200" ]] || ! jq -e --arg operation "$BROWSER_OPERATION" 'any(.messages[]; .role == "assistant" and .operationId == $operation and (.content|contains("SOLO_CHAT_LOCAL_FALLBACK_PERSISTENCE_OK")))' browser-chat-history.json >/dev/null; then
              echo "::error::Browser-local fallback reply was not persisted in the conversation history."
              cat browser-chat-history.json
              exit 1
            fi
            {
              echo "### Live browser chat acceptance"
              echo "- Queue → Durable Object alarm → provider failure: **REPRODUCED**"
              echo "- Runtime health/version: **PASS**"
              echo "- Cloud inference capacity: **UNAVAILABLE**"
              echo "- Browser-local completion endpoint and job finalization: **PASS**"
              echo "- Assistant fallback reply persisted in conversation history: **PASS**"
              echo "- Note: CI used a synthetic completion payload; actual WebGPU model execution must be verified in a supported browser/device."
              echo "- Cause: configured providers exhausted their quotas or are not configured."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            if [[ "$BROWSER_DONE" != "true" ]]; then
              echo "::error::Browser chat queue did not complete within 8 minutes."
              cat browser-chat-status.json || true
              exit 1
            fi
            echo "Browser-facing /api/chat -> Durable Object alarm -> /api/chat/status round-trip passed."
            if ! jq -e '.provider and .model' browser-chat-status.json >/dev/null; then
              echo "::error::Browser chat did not report the actual provider/model used."
              cat browser-chat-status.json
              exit 1
            fi
            BROWSER_THREAD="$(jq -r '.thread' browser-chat-accepted.json)"
            HISTORY_CODE="$(curl --silent --show-error --max-time 30 -o browser-chat-history.json -w '%{http_code}' -H "Authorization: Bearer $CHAT_APP_PASSWORD" "$ENDPOINT/api/messages?thread=$BROWSER_THREAD" || true)"
            if [[ "$HISTORY_CODE" != "200" ]] || ! jq -e --arg operation "$BROWSER_OPERATION" 'all(.messages[]; .role == "user" or .role == "assistant") and any(.messages[]; .role == "assistant" and .operationId == $operation and (.content|contains("SOLO_CHAT_BROWSER_QUEUE_OK")))' browser-chat-history.json >/dev/null; then
              echo "::error::Browser chat reply was not persisted in the visible conversation history."
              cat browser-chat-history.json
              exit 1
            fi
            jq '{provider,model,degraded,fallbackReason}' browser-chat-status.json
            echo "Browser chat provider metadata and persisted assistant history passed."
            {
              echo "### Live browser chat acceptance"
              echo "- Queue → Durable Object alarm → status: **PASS**"
              echo "- Assistant reply persisted in user-visible history: **PASS**"
              echo "- Provider: $(jq -r '.provider' browser-chat-status.json)"
              echo "- Model: $(jq -r '.model' browser-chat-status.json)"
              echo "- Degraded fallback: $(jq -r '.degraded // false' browser-chat-status.json)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$RUN_AGENT_SMOKE" == "true" ]]; then
            echo "Checking direct Pi AI inference and configured model fallback..."
            curl --silent --show-error --max-time 240 -o model-check.json -w '%{http_code}' -H "Authorization: Bearer $CHAT_APP_PASSWORD" "$ENDPOINT/api/agent/model-check" > model-check-code.txt || true
            MODEL_CHECK_CODE="$(cat model-check-code.txt)"
            if [[ "$MODEL_CHECK_CODE" != "200" ]] || ! jq -e '.ok == true and (.reply|contains("SOLO_CHAT_MODEL_OK"))' model-check.json >/dev/null; then
              echo "::warning::Direct model diagnostic failed after the browser chat round-trip passed (HTTP $MODEL_CHECK_CODE)."
              cat model-check.json
            else
              echo "Direct model inference passed."
              jq '{provider,model,preferredToolModelSaved}' model-check.json
            fi
            jq -n --arg prompt "Reply exactly with SOLO_CHAT_SMOKE_OK and nothing else. Do not call tools." --arg thread "solo-deploy-smoke-$GITHUB_RUN_ID" '{prompt:$prompt,threadKey:$thread}' > model-smoke-request.json
            MODEL_CODE="$(curl --silent --show-error --max-time 240 -o model-smoke-response.json -w '%{http_code}' -H "Authorization: Bearer $CHAT_APP_PASSWORD" -H "Content-Type: application/json" --data @model-smoke-request.json "$ENDPOINT/api/agent/chat" || true)"
            if [[ "$MODEL_CODE" != "200" ]] || ! jq -e '.reply and (.reply|contains("SOLO_CHAT_SMOKE_OK"))' model-smoke-response.json >/dev/null; then
              echo "::warning::Direct /api/agent/chat diagnostic failed after the browser chat round-trip passed (HTTP $MODEL_CODE)."
              cat model-smoke-response.json
            fi
            echo "Checking actual Pi harness tool execution..."
            HARNESS_CODE="$(curl --silent --show-error --max-time 240 -o harness-check.json -w '%{http_code}' -H "Authorization: Bearer $CHAT_APP_PASSWORD" "$ENDPOINT/api/agent/harness-check" || true)"
            if [[ "$HARNESS_CODE" != "200" ]] || ! jq -e '.ok == true and .toolExecution == true and .minimalToolExecution == true and .fullToolExecution == true and .deferredToolSearch == true and .offeredToolCount == 1 and (.reply|contains("SOLO_CHAT_HARNESS_OK"))' harness-check.json >/dev/null; then
              echo "::warning::Pi tool execution diagnostic failed after the browser chat round-trip passed. Tool use is degraded; see the diagnostic payload."
              cat harness-check.json
            else
              echo "Real Pi harness deferred tool discovery and execution passed."
            fi
  
          else
            echo "::notice::Skipped extra model and tool inference calls on push to preserve the limited free provider quotas. Run this workflow manually to execute the extended agent smoke."
          fi
          echo "Checking live agent dashboard..."
          STATUS_CODE="$(curl --silent --show-error --max-time 30 -o agent-status.json -w '%{http_code}' -H "Authorization: Bearer $CHAT_APP_PASSWORD" "$ENDPOINT/api/agents/status" || true)"
          if [[ "$STATUS_CODE" != "200" ]] || ! jq -e '.roles | length >= 8' agent-status.json >/dev/null; then
            echo "::error::Agent dashboard failed with HTTP $STATUS_CODE"
            cat agent-status.json
            exit 1
          fi
          if jq -e '.statusUnavailable == true' agent-status.json >/dev/null; then
            echo "::warning::Dashboard endpoint is healthy, but GitHub Actions status data is unavailable (HTTP $(jq -r '.upstreamStatus // "unknown"' agent-status.json)). The UI will show this as degraded, not as healthy."
          else
            echo "Live agent dashboard data is available."
          fi
          echo "Browser chat queue and persisted history passed; model and tool diagnostics are reported above."
          
      - name: Automatic rollback only if deployed Worker health/version verification fails
        id: rollback
        # A chat inference failure caused by exhausted/missing provider quota is not
        # a code-version regression; rolling back cannot restore external capacity.
        if: failure() && steps.smoke.outcome == 'failure'
        working-directory: web-chat
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CHAT_ENDPOINT: https://cssbc-github-chat.descapan.workers.dev
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
        run: |
          set -euo pipefail
          echo "::warning::New version failed the health check. Rolling back to the previous Cloudflare Worker version."
          npx wrangler rollback --message "Automatic rollback after SOLO.Chat post-deploy smoke test failure" --config wrangler.toml
          ENDPOINT="${CHAT_ENDPOINT%/}"
          for attempt in $(seq 1 12); do
            CODE="$(curl --silent --show-error --max-time 20 -o rollback-health.json -w '%{http_code}' -H "Authorization: Bearer $CHAT_APP_PASSWORD" "$ENDPOINT/api/health" || true)"
            if [[ "$CODE" == "200" ]] && jq -e '.ok == true' rollback-health.json >/dev/null; then
              echo "Previous version restored and health check passed."
              exit 0
            fi
            echo "Rollback health attempt $attempt/12 returned HTTP $CODE."
            sleep 5
          done
          echo "::error::Automatic rollback did not restore a healthy endpoint."
          exit 1
