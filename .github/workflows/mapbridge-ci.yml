name: MapBridge validation
on:
  push:
    branches: [sdk-foundation]
    paths:
      - "tools/mapbridge/**"
      - ".github/workflows/mapbridge-ci.yml"
  pull_request:
    paths:
      - "tools/mapbridge/**"
      - ".github/workflows/mapbridge-ci.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
        working-directory: tools/mapbridge
      - name: Syntax checks
        run: |
          node --check src/server.mjs
          node --check test/smoke.mjs
          node --check generate.mjs
          node --check test/smoke.mjs
        working-directory: tools/mapbridge
      - name: MCP end-to-end smoke test
        run: npm test
        working-directory: tools/mapbridge
