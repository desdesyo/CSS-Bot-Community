name: Build CSS v34 Repair Utility

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/css-v34-repair/**"
      - ".github/workflows/build-css-v34-repair.yml"

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/tools/css-v34-repair/Repair-CSS-v34.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
          }
      - name: Package utility
        shell: pwsh
        run: |
          Compress-Archive -Path "tools/css-v34-repair/*" -DestinationPath "CSS-v34-Repair-Utility.zip" -Force
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CSS-v34-Repair-Utility
          path: CSS-v34-Repair-Utility.zip
          if-no-files-found: error
