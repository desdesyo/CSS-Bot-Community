name: Runtime safety tests

on:
  push:
    branches:
      - "fix/solo-engine-runtime-stability-*"
      - "feature/solo-crossplay-foundation"
  pull_request:

jobs:
  runtime-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test engine/tests/runtime-safety.test.mjs
      - run: node engine/tests/check-play-script.mjs
