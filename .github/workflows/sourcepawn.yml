name: SourceMod plugin compile

on:
  push:
    paths:
      - "sourcemod/**/*.sp"
      - ".github/workflows/sourcepawn.yml"
  pull_request:
    paths:
      - "sourcemod/**/*.sp"
      - ".github/workflows/sourcepawn.yml"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SourcePawn compiler
        uses: rumblefrog/setup-sp@master
        with:
          version: "1.12.x"

      - name: Compile CSSBC plugin
        run: |
          spcomp sourcemod/scripting/cssbc.sp -o cssbc.smx
          test -s cssbc.smx

      - name: Compile Smart Bots Overhaul prototype
        run: |
          spcomp sourcemod/scripting/smartbots_overhaul.sp -o smartbots_overhaul.smx
          test -s smartbots_overhaul.smx

      - name: Upload compiled plugins
        uses: actions/upload-artifact@v4
        with:
          name: cssbc-sourcemod-prototypes
          path: |
            cssbc.smx
            smartbots_overhaul.smx
