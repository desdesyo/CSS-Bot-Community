name: Chat autonomous repair

on:
  workflow_run:
    workflows: ["GitHub Chat checks"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Failed GitHub Chat checks run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  repair:
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.head_branch == 'github-chat-prototype' &&
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve failed run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN: ${{ inputs.run_id }}
          EVENT_RUN: ${{ github.event.workflow_run.id }}
        run: |
          echo "run_id=${INPUT_RUN:-${EVENT_RUN}}" >> "$GITHUB_OUTPUT"
      - name: Send failure to autonomous chat agent
        env:
          CHAT_ENDPOINT: ${{ secrets.CSSBC_CHAT_ENDPOINT }}
          CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "$CHAT_ENDPOINT" || -z "$CHAT_APP_PASSWORD" ]]; then
            echo "::error::Set repository secrets CSSBC_CHAT_ENDPOINT and CSSBC_CHAT_APP_PASSWORD"
            exit 1
          fi
          RUN_JSON="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          RUN_URL="$(jq -r .html_url <<<"$RUN_JSON")"
          SHA="$(jq -r .head_sha <<<"$RUN_JSON")"
          BRANCH="$(jq -r .head_branch <<<"$RUN_JSON")"
          JOBS="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate)"
          FAILED="$(jq -r '[.jobs[] | select(.conclusion=="failure") | .name + ": " + ([.steps[] | select(.conclusion=="failure") | .name] | join(", "))] | join("\n")' <<<"$JOBS")"
          ARTIFACTS="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate | jq -r '[.artifacts[] | select(.expired==false) | .name + " (artifact id " + (.id|tostring) + ")"] | join("\n")')"
          MESSAGE="$(cat <<EOF
AUTONOMOUS REPAIR TASK — GitHub Chat checks failed.
Repository: $REPO
Branch: $BRANCH
Commit: $SHA
Failed run: $RUN_URL
Failed steps:
$FAILED
Artifacts:
$ARTIFACTS

You must autonomously investigate this exact failure: inspect the run logs and downloadable artifacts through GitHub API/tools, identify root cause from evidence, modify the repository on branch github-chat-prototype, commit a minimal fix, run/trigger verification, and report commit SHA plus test evidence. Do not merely describe a plan. Do not alter secrets or unrelated files. If the failure is external/flaky, document evidence and avoid speculative code changes.
EOF
)"
          jq -n --arg message "$MESSAGE" '{message:$message}' > payload.json
          curl --fail-with-body --silent --show-error             --max-time 900             -H "Authorization: Bearer $CHAT_APP_PASSWORD"             -H "Content-Type: application/json"             --data @payload.json             "$CHAT_ENDPOINT/api/chat" | tee agent-response.json
          jq -e '.reply and (.reply|length>0)' agent-response.json >/dev/null
