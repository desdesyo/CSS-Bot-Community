name: GitHub Chat checks

on:
  push:
    branches: [github-chat-prototype]
    paths:
      - "web-chat/**"
      - ".github/workflows/github-chat-check.yml"
      - ".github/workflows/agent-*.yml"
      - ".github/workflows/deploy-github-chat.yml"
      - ".github/workflows/github-chat-e2e.yml"
      - "agent-team/**"
      - "AGENTS.md"
  pull_request:
    paths:
      - "web-chat/**"
      - ".github/workflows/github-chat-check.yml"
      - ".github/workflows/agent-*.yml"
      - ".github/workflows/deploy-github-chat.yml"
      - "agent-team/**"
      - "AGENTS.md"

permissions:
  contents: read
  issues: write

concurrency:
  group: solo-chat-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install durable agent dependencies
        working-directory: web-chat
        run: npm install
      - name: Type-check durable agent runtime
        working-directory: web-chat
        run: npm run check
      - name: Bundle Worker without deploying
        working-directory: web-chat
        run: npx wrangler deploy --dry-run --outdir /tmp/cssbc-worker-dry-run
      - name: Check local computer companion syntax
        run: node --check computer-bridge/agent.mjs
      - name: Check SOLO Compute worker syntax and policy tests
        run: node --check web-chat/compute-worker.mjs && node --test web-chat/compute-worker.test.mjs
      - name: Validate local bridge config example
        run: node -e "JSON.parse(require('fs').readFileSync('computer-bridge/config.example.json','utf8'))"
      - name: Check Worker JavaScript syntax
        run: node --input-type=module --check < web-chat/worker.js
      - name: Check browser JavaScript syntax
        run: node -e "const fs=require('fs');const html=fs.readFileSync('web-chat/public/index.html','utf8');const m=html.match(/<script>([\\s\\S]*?)<\\/script>/);if(!m)throw new Error('inline script missing');new Function(m[1]);"
      - name: Verify required app files
        run: |
          test -s web-chat/public/index.html
          test -s web-chat/worker.js
          test -s web-chat/wrangler.toml
          test -s web-chat/agent-runtime/src/index.ts
          test -s computer-bridge/agent.mjs
          test -s web-chat/README.md
      - name: Run Chat Tester assertions
        run: set -o pipefail; npm test --prefix web-chat 2>&1 | tee chat-tester-report.txt

      - name: Upload Chat Tester report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-tester-report-${{ github.run_id }}
          path: chat-tester-report.txt
          if-no-files-found: ignore
      - name: Send failure to AI Tester inbox
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const body = `## ❌ Chat Tester / CI failure\n\n- Commit: \`${{ github.sha }}\`\n- Run: ${run}\n- Branch: \`${{ github.ref_name }}\`\n\nАвтоматический тестер/проверки упали. Полный лог приложен к Actions run как artifact **chat-tester-report-${{ github.run_id }}** (если тестер успел сформировать файл).\n\nИИ-разработчик: открой run, найди первый FAILED step, скачай artifact при наличии, исправь причину в ветке и повторно запусти проверки.`;
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 4, body});
      - name: Check whitespace errors
        run: git diff --check
