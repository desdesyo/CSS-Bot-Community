name: CSSBC Map Builder
on:
  workflow_dispatch:
    inputs:
      map_name:
        description: VMF basename
        required: true
        default: CSSBC_ModernDistrict
        type: string
  push:
    branches: [sdk-foundation]
    paths: ["maps/ModernDistrict/*.vmf", ".github/workflows/map-builder.yml"]
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install SteamCMD
        shell: pwsh
        run: |
          Invoke-WebRequest https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip -OutFile "$env:RUNNER_TEMP\steamcmd.zip"
          Expand-Archive "$env:RUNNER_TEMP\steamcmd.zip" "$env:RUNNER_TEMP\steamcmd" -Force
          "STEAMCMD=$env:RUNNER_TEMP\steamcmd\steamcmd.exe" >> $env:GITHUB_ENV
      - name: Install Source SDK tools and CS:S content
        shell: pwsh
        run: |
          $sdk="$env:RUNNER_TEMP\sdk"
          $css="$env:RUNNER_TEMP\css"
          & $env:STEAMCMD +force_install_dir $sdk +login anonymous +app_update 211 validate +quit
          if ($LASTEXITCODE -ne 0) { throw "SteamCMD Source SDK (App 211) install failed" }
          & $env:STEAMCMD +force_install_dir $css +login anonymous +app_update 232330 validate +quit
          if ($LASTEXITCODE -ne 0) { throw "SteamCMD CS:S dedicated content install failed" }
          $vbsp=Get-ChildItem $sdk -Filter vbsp.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$vbsp) { $vbsp=Get-ChildItem $css -Filter vbsp.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (!$vbsp) { throw "VBSP.exe absent after SDK install; SDK depot does not provide compiler on this runner." }
          $vvis=Get-ChildItem $sdk -Filter vvis.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $vrad=Get-ChildItem $sdk -Filter vrad.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          "VBSP=$($vbsp.FullName)" >> $env:GITHUB_ENV
          "VVIS=$($vvis.FullName)" >> $env:GITHUB_ENV
          "VRAD=$($vrad.FullName)" >> $env:GITHUB_ENV
          "CSSDIR=$css" >> $env:GITHUB_ENV
      - name: Compile VMF
        shell: pwsh
        run: |
          $name="${{ inputs.map_name || 'CSSBC_ModernDistrict' }}"
          $vmf="maps/ModernDistrict/$name.vmf"
          if (!(Test-Path $vmf)) { throw "VMF missing: $vmf" }
          New-Item -ItemType Directory -Force build | Out-Null
          & $env:VBSP -game "$env:CSSDIR\cstrike" "$vmf" 2>&1 | Tee-Object build\vbsp.log
          if ($LASTEXITCODE -ne 0) { throw "VBSP failed with exit code $LASTEXITCODE" }
          $bsp="maps/ModernDistrict/$name.bsp"
          if (!(Test-Path $bsp)) { throw "VBSP output missing: $bsp" }
          Copy-Item $bsp "build\$name.bsp" -Force
      - name: Run visibility and lighting
        shell: pwsh
        run: |
          $name="${{ inputs.map_name || 'CSSBC_ModernDistrict' }}"
          $bsp="build\$name.bsp"
          if ($env:VVIS -and (Test-Path $env:VVIS)) {
            & $env:VVIS $bsp 2>&1 | Tee-Object build\vvis.log
            if ($LASTEXITCODE -ne 0) { throw "VVIS failed" }
          }
          if ($env:VRAD -and (Test-Path $env:VRAD)) {
            & $env:VRAD -game "$env:CSSDIR\cstrike" -noextra $bsp 2>&1 | Tee-Object build\vrad.log
            if ($LASTEXITCODE -ne 0) { throw "VRAD failed" }
          }
      - name: Upload BSP and compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CSSBC-map-${{ inputs.map_name || 'CSSBC_ModernDistrict' }}
          path: |
            build/*.bsp
            build/*.log
          if-no-files-found: warn
          retention-days: 14
