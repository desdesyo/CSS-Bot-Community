name: CSSBC Map Builder

on:
  workflow_dispatch:
    inputs:
      map_name:
        description: VMF basename (without extension)
        required: true
        default: CSSBC_ModernDistrict
        type: string
      full_lighting:
        description: Run VVIS and VRAD (requires Source SDK tools)
        required: true
        default: false
        type: boolean
  push:
    branches: [sdk-foundation]
    paths:
      - "maps/ModernDistrict/*.vmf"
      - ".github/workflows/map-builder.yml"

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout map sources
        uses: actions/checkout@v4

      - name: Locate VMF
        shell: pwsh
        run: |
          $vmf = "maps/ModernDistrict/${{ inputs.map_name || 'CSSBC_ModernDistrict' }}.vmf"
          if (!(Test-Path $vmf)) { throw "VMF missing: $vmf" }
          "VMF=$vmf" >> $env:GITHUB_ENV
          "MAPNAME=${{ inputs.map_name || 'CSSBC_ModernDistrict' }}" >> $env:GITHUB_ENV

      - name: Download and unpack Source SDK tools (Steam depot)
        shell: pwsh
        run: |
          # App  mod 4000 is CS:S; depot 4001 contains game binaries, not VBSP.
          # Source SDK tools are distributed separately; never silently substitute incompatible binaries.
          $sdkCandidates = @(
            "C:\Program Files (x86)\Steam\steamapps\common\Source SDK\bin\vbsp.exe",
            "C:\Program Files\Steam\steamapps\common\Source SDK\bin\vbsp.exe"
          )
          $found = $sdkCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$found) {
            Write-Host "::warning::VBSP not preinstalled on hosted runner. See README for supported SDK setup."
            throw "Source SDK VBSP is not installed on this runner. No fake BSP will be produced."
          }
          "VBSP=$found" >> $env:GITHUB_ENV
          $sdkDir = Split-Path $found
          foreach ($tool in @("vvis.exe","vrad.exe")) {
            if (Test-Path (Join-Path $sdkDir $tool)) {
              " ${{ '' }}" | Out-Null
            }
          }

      - name: Compile VMF to BSP
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "$env:MAPNAME.bsp"
          & $env:VBSP -game "$PWD\cstrike" -o "$out" "$env:VMF"
          if ($LASTEXITCODE -ne 0) { throw "VBSP exited $LASTEXITCODE" }
          if (!(Test-Path $out)) { throw "VBSP did not create BSP" }
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Copy-Item $out "build\$env:MAPNAME.bsp"
          Get-Item "build\$env:MAPNAME.bsp" | Format-List

      - name: Upload compiled map and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CSSBC-map-${{ inputs.map_name || 'CSSBC_ModernDistrict' }}
          path: |
            build/*.bsp
            maps/ModernDistrict/*.vmf
          if-no-files-found: warn
          retention-days: 14
