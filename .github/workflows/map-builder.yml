name: CSSBC Map Builder
on:
  workflow_dispatch:
    inputs:
      map_name:
        description: VMF basename (maps/ModernDistrict)
        required: true
        default: CSSBC_ModernDistrict
        type: string
  push:
    branches: [sdk-foundation]
    paths: ["maps/ModernDistrict/*.vmf", ".github/workflows/map-builder.yml"]
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download standalone Tools++ compilers
        shell: pwsh
        run: |
          $url="https://github.com/ficool2/misc_tools/releases/download/v1/tools++_windows.zip"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\toolspp.zip"
          Expand-Archive "$env:RUNNER_TEMP\toolspp.zip" "$env:RUNNER_TEMP\toolspp" -Force
          $root="$env:RUNNER_TEMP\toolspp"
          $vbsp=Get-ChildItem $root -Filter vbspplusplus.exe -Recurse | Select-Object -First 1
          $vvis=Get-ChildItem $root -Filter vvisplusplus.exe -Recurse | Select-Object -First 1
          $vrad=Get-ChildItem $root -Filter vradplusplus.exe -Recurse | Select-Object -First 1
          if (!$vbsp -or !$vvis -or !$vrad) {
            Get-ChildItem $root -Recurse -File | Select-Object FullName
            throw "Official Tools++ archive lacks one or more compiler executables"
          }
          "VBSP=$($vbsp.FullName)" >> $env:GITHUB_ENV
          "VVIS=$($vvis.FullName)" >> $env:GITHUB_ENV
          "VRAD=$($vrad.FullName)" >> $env:GITHUB_ENV

      - name: Locate CSS game content (optional repository payload)
        id: css
        shell: pwsh
        run: |
          $candidate=@(
            "$env:GITHUB_WORKSPACE\cstrike",
            "$env:GITHUB_WORKSPACE\game\cstrike",
            "$env:GITHUB_WORKSPACE\content\cstrike"
          ) | Where-Object { Test-Path "$_\gameinfo.txt" } | Select-Object -First 1
          if (!$candidate) {
            "available=false" >> $env:GITHUB_OUTPUT
            Write-Host "CS:S content not supplied. Skipping BSP compile; source VMF will still be uploaded."
          } else {
            "available=true" >> $env:GITHUB_OUTPUT
            "CSSDIR=$candidate" >> $env:GITHUB_ENV
          }

      - name: Compile VMF (VBSP++)
        if: steps.css.outputs.available == 'true'
        shell: pwsh
        run: |
          $name="${{ inputs.map_name || 'CSSBC_ModernDistrict' }}"
          if ($name -notmatch '^[A-Za-z0-9_-]+$') { throw "Invalid map name" }
          $vmf="maps/ModernDistrict/$name.vmf"
          if (!(Test-Path $vmf)) { throw "VMF missing: $vmf" }
          New-Item -ItemType Directory -Force build | Out-Null
          & $env:VBSP -game "$env:CSSDIR" -verbose "$vmf" 2>&1 | Tee-Object build\vbsp.log
          if ($LASTEXITCODE -ne 0) { throw "VBSP++ failed: $LASTEXITCODE" }
          $bsp="maps/ModernDistrict/$name.bsp"
          if (!(Test-Path $bsp)) { throw "BSP not produced at $bsp" }
          Copy-Item $bsp "build\$name.bsp" -Force

      - name: Compile visibility (VVIS++)
        if: steps.css.outputs.available == 'true'
        shell: pwsh
        run: |
          $name="${{ inputs.map_name || 'CSSBC_ModernDistrict' }}"
          & $env:VVIS -game "$env:CSSDIR" -fast "build\$name.bsp" 2>&1 | Tee-Object build\vvis.log
          if ($LASTEXITCODE -ne 0) { throw "VVIS++ failed: $LASTEXITCODE" }

      - name: Compile lighting (VRAD++)
        if: steps.css.outputs.available == 'true'
        shell: pwsh
        run: |
          $name="${{ inputs.map_name || 'CSSBC_ModernDistrict' }}"
          & $env:VRAD -game "$env:CSSDIR" -noextra -fast "build\$name.bsp" 2>&1 | Tee-Object build\vrad.log
          if ($LASTEXITCODE -ne 0) { throw "VRAD++ failed: $LASTEXITCODE" }

      - name: Validate BSP output
        if: steps.css.outputs.available == 'true'
        shell: pwsh
        run: |
          $bsp="build${{ inputs.map_name || 'CSSBC_ModernDistrict' }}.bsp"
          if (!(Test-Path $bsp) -or (Get-Item $bsp).Length -lt 10000) { throw "BSP missing or suspiciously small" }
          Get-Item $bsp | Format-List FullName,Length

      - name: Upload BSP, source VMF and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CSSBC-Map-${{ inputs.map_name || 'CSSBC_ModernDistrict' }}-${{ github.run_number }}
          path: |
            build/*.bsp
            build/*.log
            maps/ModernDistrict/${{ inputs.map_name || 'CSSBC_ModernDistrict' }}.vmf
          if-no-files-found: warn
          retention-days: 30
