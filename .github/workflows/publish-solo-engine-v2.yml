name: Publish SOLO Engine V2
# Rebuild the latest fully-tested feature/solo-engine-v2 head after renderer, diagnostics, and safe-batching fixes (r4).

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-solo-engine-v2.yml"
      - "engine/v2/**"
  workflow_run:
    workflows:
      - "SOLO Engine V2 source checks"
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: solo-engine-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'feature/solo-engine-v2' || github.event.workflow_run.head_branch == 'fix/solo-report-controls')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out tested SOLO Engine V2 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: Download last known-good Pages artifact for model fallback
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .previous-pages
          run-id: 46135445052
          github-token: ${{ github.token }}

      - name: Extract fallback soldier assets
        run: |
          mkdir -p .previous-pages/extracted
          tar -xf .previous-pages/artifact.tar -C .previous-pages/extracted

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run engine unit tests
        run: node --test engine/v2/engine.test.mjs

      - name: Prepare static game
        shell: bash
        run: |
          set -euo pipefail
          test -s engine/play.html
          test -s engine/import.html
          test -s engine/v2/index.html
          test -s engine/v2/engine.js
          rm -rf dist
          mkdir -p dist/client dist/engine/v2
          # GitHub Pages root must launch the current SOLO: Wet Ground V2 build.
          # Keep the legacy prototype available only at its explicit old path.
          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=./engine/v2/index.html"><title>SOLO: Wet Ground</title></head><body><p>Загрузка SOLO: Wet Ground…</p><script>location.replace("./engine/v2/index.html");</script></body></html>
          HTML
          cp engine/import.html dist/import.html
          cp -R engine/client/. dist/client/
          cp -R engine/v2/. dist/engine/v2/
          mkdir -p dist/engine/v2/assets
          for model in military-male-01 military-male-02 military-male-03 military-male-04 military-female-01 military-female-02; do
            target="dist/engine/v2/assets/${model}.glb"
            if ! curl --fail --silent --show-error --location --retry 2 --retry-delay 2 "https://models.codelove.in/models/${model}.glb" -o "$target"; then
              echo "Primary model host unavailable; restoring last known-good model: ${model}"
              cp ".previous-pages/extracted/engine/v2/assets/${model}.glb" "$target"
            fi
            test -s "$target"
          done
          for clip in m_idle_neutral_01 m_walk_neutral_01 m_run_neutral_01; do
            target="dist/engine/v2/assets/${clip}.glb"
            if ! curl --fail --silent --show-error --location --retry 2 --retry-delay 2 "https://models.codelove.in/animations/${clip}.glb" -o "$target"; then
              echo "Primary animation host unavailable; restoring last known-good clip: ${clip}"
              cp ".previous-pages/extracted/engine/v2/assets/${clip}.glb" "$target"
            fi
            test -s "$target"
          done
          echo "Downloaded six rigged soldier models and three Biped animation clips."
          python3 - <<'PY'
          import json, pathlib, struct
          root = pathlib.Path("dist/engine/v2/assets")
          def read_glb(path):
              data = path.read_bytes()
              magic, version, total = struct.unpack_from("<4sII", data, 0)
              assert magic == b"glTF" and version == 2 and total == len(data), f"Invalid GLB: {path.name}"
              offset = 12
              while offset + 8 <= len(data):
                  size, kind = struct.unpack_from("<I4s", data, offset)
                  offset += 8
                  chunk = data[offset:offset + size]
                  offset += size
                  if kind == b"JSON":
                      return json.loads(chunk.decode("utf-8").rstrip("\x00 "))
              raise AssertionError(f"Missing JSON chunk: {path.name}")
          model_names = ["military-male-01", "military-male-02", "military-male-03", "military-male-04", "military-female-01", "military-female-02"]
          skeleton_names = None
          for name in model_names:
              doc = read_glb(root / f"{name}.glb")
              assert doc.get("meshes") and doc.get("skins"), f"Not a skinned character: {name}"
              joints = {doc["nodes"][i]["name"] for i in doc["skins"][0]["joints"]}
              assert len(joints) == 80, f"Expected 80-bone rig in {name}, got {len(joints)}"
              skeleton_names = skeleton_names or joints
              assert len(joints & skeleton_names) == 80, f"Skeleton mismatch in {name}"
          for name in ["m_idle_neutral_01", "m_walk_neutral_01", "m_run_neutral_01"]:
              doc = read_glb(root / f"{name}.glb")
              assert doc.get("animations"), f"Missing animation group: {name}"
              targets = {doc["nodes"][c["target"]["node"]]["name"] for a in doc["animations"] for c in a["channels"]}
              assert len(targets & skeleton_names) >= 20, f"Animation cannot retarget to soldier skeleton: {name}"
          print("GLB validation passed: 6 skinned 80-bone soldiers + 3 compatible motion clips.")
          PY
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/engine/v2/index.html
          test -s dist/engine/v2/engine.js
          echo "Pages artifact prepared."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'feature/solo-engine-v2' || github.event.workflow_run.head_branch == 'fix/solo-report-controls')) }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
