name: Publish SOLO Engine V2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-solo-engine-v2.yml"
  workflow_run:
    workflows:
      - "SOLO Engine V2 source checks"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: solo-engine-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'feature/solo-engine-v2') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out tested SOLO Engine V2 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'feature/solo-engine-v2' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run engine unit tests
        run: node --test engine/v2/engine.test.mjs

      - name: Prepare static game
        shell: bash
        run: |
          set -euo pipefail
          test -s engine/play.html
          test -s engine/import.html
          test -s engine/v2/index.html
          test -s engine/v2/engine.js
          rm -rf dist
          mkdir -p dist/client dist/engine/v2
          cp engine/play.html dist/index.html
          cp engine/import.html dist/import.html
          cp -R engine/client/. dist/client/
          cp -R engine/v2/. dist/engine/v2/
          mkdir -p dist/engine/v2/assets
          for model in military-male-01 military-male-02 military-male-03 military-male-04 military-female-01 military-female-02; do
            curl --fail --location --retry 3 --retry-delay 2 "https://models.codelove.in/models/${model}.glb" -o "dist/engine/v2/assets/${model}.glb"
            test -s "dist/engine/v2/assets/${model}.glb"
          done
          for clip in m_idle_neutral_01 m_walk_neutral_01 m_run_neutral_01; do
            curl --fail --location --retry 3 --retry-delay 2 "https://models.codelove.in/animations/${clip}.glb" -o "dist/engine/v2/assets/${clip}.glb"
            test -s "dist/engine/v2/assets/${clip}.glb"
          done
          echo "Downloaded six rigged soldier models and three Biped animation clips."
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/engine/v2/index.html
          test -s dist/engine/v2/engine.js
          echo "Pages artifact prepared."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'feature/solo-engine-v2') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
