name: Publish SOLO Engine V2
# Rebuild the latest fully-tested feature/solo-engine-v2 head after renderer, diagnostics, and safe-batching fixes (r4).

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-solo-engine-v2.yml"
      - "engine/v2/**"
  workflow_run:
    workflows:
      - "SOLO Engine V2 source checks"
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: solo-engine-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'feature/solo-engine-v2' || github.event.workflow_run.head_branch == 'fix/solo-report-controls')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out tested SOLO Engine V2 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: Download last known-good Pages artifact for model fallback
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .previous-pages
          run-id: 46135445052
          github-token: ${{ github.token }}

      - name: Restore last known-good Pages site
        run: |
          mkdir -p dist
          tar -xf .previous-pages/artifact.tar -C dist

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run engine unit tests
        run: node --test engine/v2/engine.test.mjs

      - name: Prepare static game
        shell: bash
        run: |
          set -euo pipefail
          test -s engine/v2/engine.js
          test -s dist/index.html
          test -s dist/engine/v2/index.html
          # The only runtime source changed in this release is engine.js; preserve every verified asset.
          cp engine/v2/engine.js dist/engine/v2/engine.js
          test -s dist/engine/v2/engine.js
          echo "Updated SOLO Engine V2 runtime over the last known-good Pages site."
          
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'feature/solo-engine-v2' || github.event.workflow_run.head_branch == 'fix/solo-report-controls')) }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
