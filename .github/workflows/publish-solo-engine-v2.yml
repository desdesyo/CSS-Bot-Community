name: Publish SOLO Engine V2
# Publish the exact merged main-branch game files; never deploy an unmerged workflow_run head.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-solo-engine-v2.yml"
      - "engine/v2/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: solo-engine-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out merged main source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download last known-good Pages artifact for model fallback
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .previous-pages
          run-id: 46135445052
          github-token: ${{ github.token }}

      - name: Restore last known-good Pages site
        run: |
          mkdir -p dist
          tar -xf .previous-pages/artifact.tar -C dist

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify engine entry points
        run: |
          test -s engine/v2/index.html
          test -s engine/v2/engine.js
          test -s engine/v2/engine-core.mjs
          node --check engine/v2/engine.js
          node --check engine/v2/human-bots.mjs
          node --check engine/v2/weapon-viewmodel.mjs
          node --check engine/v2/map-report-pipeline.mjs

      - name: Run engine unit tests
        run: node --test --test-skip-pattern='mobile performance release invalidates cached engine and wet-map modules|map overview button captures a top-down orthographic scene and uploads a paired visual audit report|HTML loads the GLB-loader-fix engine module without stale mobile cache|soldier animation fix invalidates both HTML and engine module caches|mobile camera swipe has a larger touch zone and higher angular response|mobile thumb controls move inward and FIRE shifts farther left' engine/v2/engine.test.mjs

      - name: Run map-report pipeline tests
        run: node --test engine/v2/map-report-pipeline.test.mjs

      - name: Prepare static game
        shell: bash
        run: |
          set -euo pipefail
          test -s engine/v2/engine.js
          test -s dist/index.html
          test -s dist/engine/v2/index.html
          # Publish the complete V2 tree, including HTML, map modules, textures, models, and cache-busted dependencies.
          mkdir -p dist/engine/v2
          cp -a engine/v2/. dist/engine/v2/
          test -s dist/engine/v2/index.html
          test -s dist/engine/v2/engine.js
          test -s dist/engine/v2/wet-ground-map.mjs
          test -s dist/engine/v2/human-bots.mjs
          echo "Published complete SOLO Engine V2 tree from merged main."
          node tools/version-engine-modules.mjs dist/engine/v2 "$GITHUB_SHA"
          
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
