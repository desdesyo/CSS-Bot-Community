name: Publish SOLO Engine V2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-solo-engine-v2.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: solo-engine-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SOLO Engine V2 source
        uses: actions/checkout@v4
        with:
          ref: feature/solo-engine-v2

      - name: Prepare static game
        shell: bash
        run: |
          set -euo pipefail
          test -s engine/play.html
          test -s engine/import.html
          test -s engine/v2/index.html
          test -s engine/v2/engine.js
          rm -rf dist
          mkdir -p dist/client dist/engine/v2
          cp engine/play.html dist/index.html
          cp engine/import.html dist/import.html
          cp -R engine/client/. dist/client/
          cp -R engine/v2/. dist/engine/v2/
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/engine/v2/index.html
          test -s dist/engine/v2/engine.js
          echo "Pages artifact prepared from feature/solo-engine-v2."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
