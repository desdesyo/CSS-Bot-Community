name: Local computer bridge checks

on:
  push:
    branches: [github-chat-prototype]
    paths:
      - "computer-bridge/**"
      - ".github/workflows/computer-bridge.yml"
  pull_request:
    paths:
      - "computer-bridge/**"
      - ".github/workflows/computer-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          node --check computer-bridge/agent.mjs
          node --check computer-bridge/file-policy.mjs
          node --check computer-bridge/task-journal.mjs
          node --check computer-bridge/file-transaction.mjs
      - name: Run bridge safety and recovery tests
        run: node --test computer-bridge/tests/*.test.mjs
      - name: Package Windows companion
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/computer-bridge | Out-Null
          Copy-Item computer-bridge/agent.mjs,computer-bridge/file-policy.mjs,computer-bridge/task-journal.mjs,computer-bridge/file-transaction.mjs,computer-bridge/config.example.json,computer-bridge/README.md,computer-bridge/START-SOLO-CHAT.cmd package/computer-bridge/
          Compress-Archive -Path package/computer-bridge -DestinationPath SOLO-Chat-Computer-Bridge.zip -Force
      - name: Upload companion package
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: SOLO-Chat-Computer-Bridge
          path: SOLO-Chat-Computer-Bridge.zip
          if-no-files-found: error
          retention-days: 14
