name: CSSBC model pack validation

on:
  push:
    paths:
      - "tools/model_pack/**"
      - "src/CSSBC_ModelRoster.*"
      - "tests/model_roster_tests.cpp"
      - "CMakeLists.txt"
      - "docs/PLAYER_MODEL_PACK.md"
      - ".github/workflows/model-pack.yml"
  pull_request:
    paths:
      - "tools/model_pack/**"
      - "src/CSSBC_ModelRoster.*"
      - "tests/model_roster_tests.cpp"
      - "CMakeLists.txt"
      - "docs/PLAYER_MODEL_PACK.md"
      - ".github/workflows/model-pack.yml"
  workflow_dispatch:

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile tools
        run: python -m py_compile tools/model_pack/generate_armored_pack.py tools/model_pack/build_valvebiped_pack.py
      - name: Generate exact 27-character source roster
        run: python tools/model_pack/generate_armored_pack.py --output build/cssbc-models
      - name: Retarget to full ValveBiped skeleton
        run: python tools/model_pack/build_valvebiped_pack.py --pack build/cssbc-models
      - name: Run model-pack tests
        run: |
          python -m unittest discover -s tests -p "test_armored_pack.py" -v
          python -m unittest discover -s tests -p "test_reference_inspector.py" -v
          python -m unittest discover -s tests -p "test_valvebiped_pack.py" -v
      - name: Verify final source pack
        run: |
          test "$(find build/cssbc-models -name '*.qc' | wc -l)" -eq 27
          test "$(find build/cssbc-models -name 'model.smd' | wc -l)" -eq 27
          grep -q 'ValveBiped.Bip01_Head1' build/cssbc-models/ct_assault/model.smd
      - name: Publish ValveBiped source pack
        uses: actions/upload-artifact@v4
        with:
          name: cssbc-player-models-27-valvebiped-source
          path: build/cssbc-models/
          if-no-files-found: error
          retention-days: 30

  validate-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "tools/model_pack/install_css_v34.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
