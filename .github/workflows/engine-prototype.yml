name: SOLO Engine prototype checks
on:
  push:
    branches: [develop, "feature/**"]
    paths: ["engine/**", ".github/workflows/engine-prototype.yml"]
  pull_request:
    branches: [develop]
    paths: ["engine/**", ".github/workflows/engine-prototype.yml"]
  workflow_dispatch:
jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node --check engine/client/game.js
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: engine/server/package.json
      - run: npm install
      - run: npm test
