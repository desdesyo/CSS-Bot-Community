name: SOLO Engine prototype checks
on:
  push:
    branches: [develop, "feature/**"]
    paths: ["engine/**", ".github/workflows/engine-prototype.yml"]
  pull_request:
    branches: [develop]
    paths: ["engine/**", ".github/workflows/engine-prototype.yml"]
  workflow_dispatch:
jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node --check engine/client/game.js
      - name: Validate inline game module and startup initialization order
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const html = fs.readFileSync('engine/play.html', 'utf8');
          const moduleStart = html.indexOf('<script type="module">');
          const moduleEnd = html.indexOf('</script>', moduleStart);
          if (moduleStart < 0 || moduleEnd < 0) throw new Error('SOLO Engine module script is missing');
          const modulePath = '/tmp/solo-engine-inline.mjs';
          fs.writeFileSync(modulePath, html.slice(moduleStart + '<script type="module">'.length, moduleEnd));
          execFileSync(process.execPath, ['--check', modulePath], { stdio: 'inherit' });
          const declaration = html.indexOf('let controlLogs=');
          const firstRead = html.indexOf('if(controlLogs.length)');
          if (declaration < 0 || firstRead < declaration) {
            throw new Error('controlLogs is read before its let declaration');
          }
          const movementDefaults = /leftInvertX=false,leftInvertY=false/.test(html);
          if (!movementDefaults) throw new Error('Gamepad must start with standard axis polarity; calibration is user-controlled');
          if (!html.includes('const dx=moveX*cos+moveZ*sin,dz=-moveX*sin+moveZ*cos;')) {
            throw new Error('Camera-relative movement basis regression: movement must follow camera yaw');
          }
          if (!html.includes('leftAxisX=0,leftAxisY=1') || !html.includes('padAxisX') || !html.includes('padAxisY') || !html.includes('padResetAxes')) {
            throw new Error('Gamepad axis selection and reset controls are required');
          }
          if (!html.includes('lastPadPanelRefresh>150')) throw new Error('Gamepad diagnostics refresh must be throttled');
          if (!html.includes("Math.atan2(-dxp,-dzp)")) throw new Error('Bot weapon facing must point toward its selected target');
          if (!html.includes('spawnBallisticProjectile(muzzleFrom,shotDir.normalize(),b.team,b,target,155)') || !html.includes('b.muzzleFlash.visible=true')) throw new Error('Bot shots must use visible muzzle flash and physical projectile travel');
          if (!html.includes("muzzleFlash.visible=b.flashTime>0")) throw new Error('Bot muzzle flash state must be animated');
          if (!html.includes("headshot?100:bodyHit?34:20")) throw new Error('Player damage must distinguish head, body, and limb/equipment hits');
          if (!html.includes("const RELOAD_DURATION=1.6")) throw new Error('Reload duration must be shared by timing and animation');
          if (!html.includes("magazine.position.y=-.51-")) throw new Error('Reload must animate the magazine, not only tilt the weapon');
          if (!html.includes("new THREE.CylinderGeometry(.235,.29,.58,10,1)")) throw new Error('Bot torso must use a shaped tapered silhouette');
          if (!html.includes("box(0,5.92,0,63,.22,59,roofMat,false)")) throw new Error('Warehouse roof deck is missing');
          if (html.includes("for(let z=-24;z<=24;z+=12)")) throw new Error('Dense roof lattice regression: use the simplified roof layout');
          if (!html.includes('function analyzeControlLogs(') || !html.includes('diagnostics:analyzeControlLogs(controlLogs)')) throw new Error('Control log analyzer and uploaded diagnostics summary are required');
          if (!html.includes('function updateAimSensitivity(dt)') || !html.includes('dynamicLookSensitivity')) throw new Error('Aim sensitivity controller is required');
          if (!html.includes('fireBtn.addEventListener(\'pointermove\'') || !html.includes('applyTouchLook(dx,dy)')) throw new Error('Touch fire button must support simultaneous fire-and-look drag');
          if (!html.includes('dynamicLookSensitivity=(fire||pad.fire)?1:')) throw new Error('Right-stick sensitivity must not be reduced while firing');
          if (!html.includes('sepX+=ux*push*4.2') || !html.includes('Final pairwise separation prevents overlapping capsules') || !html.includes('Math.cos((a.index+1)*2.399)')) throw new Error('Deterministic bot collision separation is required');
          if (!html.includes('b.group.rotation.y+=turnDelta*Math.min(1,dt*12)')) throw new Error('Bot yaw must interpolate without unstable full-angle snaps');
          if (!html.includes("import('three/addons/loaders/GLTFLoader.js')") || !html.includes('function attachRealBotModels()')) throw new Error('Rigged soldier GLB loader and model attachment are required');
          if (!html.includes("https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/models/gltf/Soldier.glb") || !html.includes("https://raw.githubusercontent.com/mrdoob/three.js/r160/examples/models/gltf/Soldier.glb")) throw new Error('Verified primary and fallback soldier GLB assets are required');
          if (!html.includes('size=isTouchDevice?512:2048') || !html.includes('bumpMap:concreteTexture') || !html.includes('anisotropy=Math.min(isTouchDevice?2:16')) throw new Error('HD PBR texture pipeline is required');
          if (!html.includes("import('three/addons/loaders/KTX2Loader.js')") || !html.includes('setKTX2Loader(realBotKtx2Loader)')) throw new Error('KTX2 compressed texture support is required');
          if (!html.includes('ACESFilmicToneMapping') || !html.includes('sun.castShadow=!isTouchDevice') || !html.includes('RoomEnvironment')) throw new Error('PBR lighting, tone mapping and shadow pipeline are required');
          if (!html.includes("await import('./client/operator-roster.js')") || !html.includes('boneBounds.expandByPoint(bone.getWorldPosition') || !html.includes('const scale=1.72/measuredHeight') || !html.includes('normalizedHeight<1.55||normalizedHeight>1.9') || !html.includes('/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)') || !html.includes('renderer.shadowMap.enabled=true')) throw new Error('Browser operator roster, skeleton utilities and high-quality shadow pipeline are required');
          if (!html.includes('function compactBotMeshes(') || !html.includes('mergeGeometries(pieces,false)') || !html.includes('function disposeBotVisuals(') || !html.includes('o.frustumCulled=!o.isSkinnedMesh') || !html.includes('operatorWaveIndex++') || !html.includes("spawnBot(0,-25,'enemy','juggernaut')")) throw new Error('Mobile bot batching and 27-operator round rotation are required');
          if (!html.includes('now-lastSkeletonDiagAt>=2500') || !html.includes('boneData.length>=12')) throw new Error('Skeleton diagnostics must be throttled and size-limited');
          if (!html.includes('setLinearDamping(.85).setAngularDamping(2.4)') || !html.includes('if(speed>14)') || !html.includes('cuboid(250,.15,250)') || !html.includes('MAX_RAGDOLLS=isTouchDevice?2:4') || !html.includes('RAGDOLL_LIFETIME=isTouchDevice?4.5:8') || !html.includes('t.y< -2')) throw new Error('Ragdoll stability, lifetime and out-of-bounds cleanup must be enforced');
          if (!html.includes('function spawnBallisticProjectile(') || !html.includes('p.velocity.y-=9.81*dt') || !html.includes('function updateProjectiles(dt)')) throw new Error('Projectile travel, gravity and collision simulation are required');
          const sunDeclaration = html.indexOf('const sun=');
          const sunShadowUse = html.indexOf('sun.shadow.mapSize');
          if (sunDeclaration < 0 || sunShadowUse < sunDeclaration) throw new Error('Sun shadow settings must only be accessed after the sun light is initialized');
          for (const slot of ['primary','pistol','grenade','knife']) {
            if (!html.includes('data-slot="'+slot+'"')) throw new Error('Weapon wheel slot is missing: '+slot);
          }
          if (!html.includes("openWeaponWheel('keyboard')") || !html.includes("closeWeaponWheel(true)")) throw new Error('PC TAB weapon wheel press/release handling is required');
          if (!html.includes('const l1Down=pressed(4)') || !html.includes('selectWheelByPoint(innerWidth/2+rx*110')) throw new Error('Android gamepad L1 + right-stick weapon wheel handling is required');
          if (!html.includes('id="weaponSelect"')) throw new Error('Touchscreen weapon selector control is required');
          if (!html.includes('function mobileTouchOnly()') || !html.includes('handleMobileEmptyMagazine')) throw new Error('Automatic ammo fallback must remain touch-only');
          if (!html.includes('function throwGrenade()') || !html.includes('function spawnGrenadeProjectile(') || !html.includes('p.fuse<=0') || !html.includes('function createGrenadeExplosion(') || !html.includes('grenadeThrowAnim=1')) throw new Error('Grenade mesh, throw animation, fuse and visible explosion are required');
          if (!html.includes('function knifeAttack()')) throw new Error('Knife melee attack is required');
          if (!html.includes('id="miniMap"') || !html.includes('function drawMinimap(')) throw new Error('Live minimap canvas and renderer are required');
          if (!html.includes("b.team==='ally'?'#65d7d0':'#ff6557'") || !html.includes('ctx.rotate(-yaw)')) throw new Error('Minimap must show team markers and player heading');
          if (!html.includes('id="hpFill"') || !html.includes('id="armorFill"') || !html.includes('id="trustFill"')) throw new Error('HP, armor and reserved mana/trust HUD meters are required');
          if (!html.includes('const incoming=8,absorbed=Math.min(armor,Math.ceil(incoming*.65))')) throw new Error('Armor must absorb a portion of incoming player damage');
          if (!html.includes('#mapPanel{left:9px;top:72px') || !html.includes('#mapPanel{position:fixed;left:16px;bottom:16px')) throw new Error('HUD minimap must avoid the Android joystick and anchor bottom-left on desktop');
          if (!html.includes('@dimforge/rapier3d-compat@0.17.3') || !html.includes('function makeRagdoll(') || !html.includes('JointData.spherical')) throw new Error('Rapier articulated ragdoll physics is required');
          if (!html.includes('function damageBot(') || !html.includes('function killBot(')) throw new Error('Unified hit damage and death handling are required');
          if (!html.includes('lookPointers=new Map()') || !html.includes("lookArea.addEventListener('pointermove'")) throw new Error('Independent multi-touch look input is required');
          if (!html.includes("new THREE.AnimationMixer(model)") || !html.includes("playRealBotAnimation(bot,'Idle')") || !html.includes("movingNow?(dist>13?'Run':'Walk')")) throw new Error('Imported soldier locomotion animations must be wired into the bot update');
          if (!html.includes('b.realRecoil=.18') || !html.includes('b.realRightArmBone.rotation.x') || !html.includes('b.realSpineBone.rotation.x')) throw new Error('Skinned soldier firing recoil must animate upper body bones');
          if (!html.includes('В браузер встроены 27 отдельных 3D-вариантов бойцов') || !html.includes('spawnWave();updateHud()') || !html.includes('id="operatorSelect"')) throw new Error('Training mode must expose the browser-native 27-character roster and selection');
          if (!html.includes('antialias:true') || !html.includes('qualityScale=isTouchDevice?1.0:1.25') || !html.includes('minQuality=isTouchDevice?.68:.78,maxQuality=isTouchDevice?1.0:1.5')) throw new Error('Adaptive render profile must allow mobile downscaling while preserving a quality floor');
          if (!html.includes('minQuality=isTouchDevice?.68:.78') || !html.includes('p90>targetFrameMs*1.25')) throw new Error('Adaptive render safety fallback and mobile quality floor are required');
          if (!html.includes('aimRaycaster.intersectObjects(aimTargets,false)')) throw new Error('Aim raycast must use the static collider list');
          if (!html.includes('livingAllies=[],livingEnemies=[]') || !html.includes('b.losTimer=.14')) throw new Error('Bot AI work must reuse team lists and throttle line-of-sight checks');
          if (!html.includes('if(!isTouchDevice){const lamp=new THREE.PointLight')) throw new Error('Mobile point-light budget must be limited');
          if (!html.includes("localStorage.setItem(CONTROL_TOKEN_KEY,token)") || !html.includes("function clearControlToken()")) {
            throw new Error('Control log token must persist locally and have a user-accessible clear action');
          }
          if (!html.includes("localStorage.removeItem(CONTROL_TOKEN_KEY)")) throw new Error('Saved control token clear path is missing');
          console.log('Inline module syntax, log initialization, camera-relative movement, gamepad calibration, and persistent token storage: OK');
          NODE
      - name: Test V2 simulation and adaptive quality
        run: node --test engine/v2/engine.test.mjs
      - name: Syntax check V2 browser module
        run: node --input-type=module --check < engine/v2/engine.js
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: engine/server/package.json
      - run: npm install
      - run: npm test
