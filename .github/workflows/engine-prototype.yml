name: SOLO Engine prototype checks
on:
  push:
    branches: [develop, "feature/**"]
    paths: ["engine/**", ".github/workflows/engine-prototype.yml"]
  pull_request:
    branches: [develop]
    paths: ["engine/**", ".github/workflows/engine-prototype.yml"]
  workflow_dispatch:
jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node --check engine/client/game.js
      - name: Validate inline game module and startup initialization order
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const html = fs.readFileSync('engine/play.html', 'utf8');
          const moduleStart = html.indexOf('<script type="module">');
          const moduleEnd = html.indexOf('</script>', moduleStart);
          if (moduleStart < 0 || moduleEnd < 0) throw new Error('SOLO Engine module script is missing');
          const modulePath = '/tmp/solo-engine-inline.mjs';
          fs.writeFileSync(modulePath, html.slice(moduleStart + '<script type="module">'.length, moduleEnd));
          execFileSync(process.execPath, ['--check', modulePath], { stdio: 'inherit' });
          const declaration = html.indexOf('let controlLogs=');
          const firstRead = html.indexOf('if(controlLogs.length)');
          if (declaration < 0 || firstRead < declaration) {
            throw new Error('controlLogs is read before its let declaration');
          }
          const movementDefaults = /leftInvertX=false,leftInvertY=false/.test(html);
          if (!movementDefaults) throw new Error('Gamepad must start with standard axis polarity; calibration is user-controlled');
          if (!html.includes('const dx=moveX*cos+moveZ*sin,dz=-moveX*sin+moveZ*cos;')) {
            throw new Error('Camera-relative movement basis regression: movement must follow camera yaw');
          }
          if (!html.includes('leftAxisX=0,leftAxisY=1') || !html.includes('padAxisX') || !html.includes('padAxisY') || !html.includes('padResetAxes')) {
            throw new Error('Gamepad axis selection and reset controls are required');
          }
          if (!html.includes('lastPadPanelRefresh>150')) throw new Error('Gamepad diagnostics refresh must be throttled');
          if (!html.includes("Math.atan2(-dxp,-dzp)")) throw new Error('Bot weapon facing must point toward its selected target');
          if (!html.includes("spawnTracer(muzzleFrom,targetPoint")) throw new Error('Bot shots must have visible muzzle/tracer feedback');
          if (!html.includes("muzzleFlash.visible=b.flashTime>0")) throw new Error('Bot muzzle flash state must be animated');
          if (!html.includes("headshot?100:bodyHit?34:20")) throw new Error('Player damage must distinguish head, body, and limb/equipment hits');
          if (!html.includes("const RELOAD_DURATION=1.6")) throw new Error('Reload duration must be shared by timing and animation');
          if (!html.includes("magazine.position.y=-.51-")) throw new Error('Reload must animate the magazine, not only tilt the weapon');
          if (!html.includes("new THREE.CylinderGeometry(.235,.29,.58,10,1)")) throw new Error('Bot torso must use a shaped tapered silhouette');
          if (!html.includes("box(0,5.92,0,63,.22,59,roofMat,false)")) throw new Error('Warehouse roof deck is missing');
          if (html.includes("for(let z=-24;z<=24;z+=12)")) throw new Error('Dense roof lattice regression: use the simplified roof layout');
          if (!html.includes('function analyzeControlLogs(') || !html.includes('diagnostics:analyzeControlLogs(controlLogs)')) throw new Error('Control log analyzer and uploaded diagnostics summary are required');
          if (!html.includes('function updateAimSensitivity(dt)') || !html.includes('dynamicLookSensitivity')) throw new Error('Aim sensitivity controller is required');
          if (!html.includes('fireBtn.addEventListener(\'pointermove\'') || !html.includes('applyTouchLook(dx,dy)')) throw new Error('Touch fire button must support simultaneous fire-and-look drag');
          if (!html.includes('dynamicLookSensitivity=(fire||pad.fire)?1:')) throw new Error('Right-stick sensitivity must not be reduced while firing');
          if (!html.includes('sepX+=ox/od*push*2.6') || !html.includes('Final pairwise separation prevents overlapping capsules')) throw new Error('Bot collision avoidance and separation are required');
          if (!html.includes('b.group.rotation.y+=turnDelta*Math.min(1,dt*12)')) throw new Error('Bot yaw must interpolate without unstable full-angle snaps');
          if (!html.includes('antialias:true') || !html.includes('qualityScale=isTouchDevice?1.35:1.5') || !html.includes('minQuality=isTouchDevice?1.05:1.0,maxQuality=isTouchDevice?1.65:1.75')) throw new Error('Mobile render quality must not be capped at one pixel per CSS pixel');
          if (!html.includes('qualityScale=isTouchDevice?1.35:1.5') || !html.includes('measuredFps<43')) throw new Error('Adaptive render resolution is required');
          if (!html.includes('aimRaycaster.intersectObjects(aimTargets,false)')) throw new Error('Aim raycast must use the static collider list');
          if (!html.includes('livingAllies=[],livingEnemies=[]') || !html.includes('b.losTimer=.14')) throw new Error('Bot AI work must reuse team lists and throttle line-of-sight checks');
          if (!html.includes('if(!isTouchDevice){const lamp=new THREE.PointLight')) throw new Error('Mobile point-light budget must be limited');
          if (!html.includes("localStorage.setItem(CONTROL_TOKEN_KEY,token)") || !html.includes("function clearControlToken()")) {
            throw new Error('Control log token must persist locally and have a user-accessible clear action');
          }
          if (!html.includes("localStorage.removeItem(CONTROL_TOKEN_KEY)")) throw new Error('Saved control token clear path is missing');
          console.log('Inline module syntax, log initialization, camera-relative movement, gamepad calibration, and persistent token storage: OK');
          NODE
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: engine/server/package.json
      - run: npm install
      - run: npm test
