<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101820"><title>SOLO Engine — Crossplay Prototype</title><link rel="stylesheet" href="./style.css"></head>
<body><main id="app"><header><strong>SOLO ENGINE</strong><span id="connection">Одиночная тренировка</span><span id="players">Игроков: 1</span></header><canvas id="game" aria-label="Игровое поле"></canvas><section id="panel"><label>Имя <input id="nickname" maxlength="16" value="Player"></label><label>Адрес сервера <input id="server" placeholder="wss://your-server.example"></label><button id="connect">Подключиться</button><button id="disconnect">Отключиться</button><button id="restart">Новая тренировка</button><p>ПК: WASD — движение, мышь — прицел, ЛКМ — огонь. Телефон: левый стик — движение, кнопка FIRE — огонь. Геймпад: левый стик, правый стик, RT.</p></section><div id="touch"><div id="stick"><div id="nub"></div></div><button id="fire">FIRE</button></div><div id="message" role="status">Загрузка…</div></main><script type="module" src="./game.js"></script></body></html>
