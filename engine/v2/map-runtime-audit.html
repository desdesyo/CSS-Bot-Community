<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOLO map runtime audit</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#fff;font:14px system-ui}#renderCanvas{width:100%;height:100%;display:block}#status{position:fixed;top:10px;left:10px;padding:8px 12px;background:#101820dd;border:1px solid #587078;border-radius:7px;z-index:2}</style></head>
<body><div id="status">Building map…</div><canvas id="renderCanvas"></canvas>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script type="module">
const B=window.BABYLON;if(!B?.Engine)throw new Error('Babylon.js global runtime did not initialize');
import { buildWetGroundMap } from './wet-ground-map.mjs?v=runtime-audit-1';
const canvas=document.getElementById('renderCanvas');
const mobile=new URLSearchParams(location.search).get('mobile')==='1';
const engine=new B.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:false,antialias:true});
const scene=new B.Scene(engine);scene.clearColor=new B.Color4(.025,.045,.06,1);
const camera=new B.ArcRotateCamera('audit-camera',-Math.PI/2,1.12,105,new B.Vector3(0,4,0),scene);
camera.attachControl(canvas,true);camera.lowerRadiusLimit=12;camera.upperRadiusLimit=180;scene.activeCamera=camera;
const hemi=new B.HemisphericLight('audit-ambient',new B.Vector3(0,1,0),scene);hemi.intensity=.8;
const key=new B.DirectionalLight('audit-key',new B.Vector3(-.45,-1,.35),scene);key.position=new B.Vector3(35,65,-35);key.intensity=.9;
const shadows=new B.ShadowGenerator(mobile?512:1024,key);shadows.useBlurExponentialShadowMap=true;shadows.blurKernel=mobile?8:16;
let result;try{result=await buildWetGroundMap(B,scene,mobile,shadows);}catch(error){window.__SOLO_MAP_AUDIT_ERROR__=String(error?.stack||error);throw error;}
engine.runRenderLoop(()=>scene.render());window.addEventListener('resize',()=>engine.resize());
window.__SOLO_MAP_AUDIT__={engine,scene,result,mobile,metrics(){
 const active=scene.getActiveMeshes();
 return {mobile:this.mobile,fps:+engine.getFps().toFixed(1),meshCount:scene.meshes.length,activeMeshCount:active.length,totalVertices:scene.getTotalVertices(),sourceMeshCount:result.sourceMeshCount,staticMeshCount:result.staticMeshCount,mergedMaterialGroups:result.mergedMaterialGroups,lateMergedGroups:result.lateMergedGroups,lateMergedSourceMeshCount:result.lateMergedSourceMeshCount,textureAudit:result.textureAudit,signAtlas:result.signAtlas,surfaceAudit:result.surfaceAudit};
}};
document.getElementById('status').textContent=(mobile?'MOBILE':'DESKTOP')+' runtime · '+result.staticMeshCount+' static meshes · '+result.sourceMeshCount+' source meshes';
</script></body></html>
