<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101820"><title>SOLO Engine V2 — Tactical FPS</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111820;color:#e8edf2;font:14px system-ui,sans-serif}#renderCanvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:0}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 5px #000}#top{position:absolute;top:env(safe-area-inset-top,10px);left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start;font-weight:800}#brand,#round,#stats span{background:#101a20d9;border:1px solid #64736d;border-radius:7px;padding:7px 10px}#brand{color:#e6bf7b;letter-spacing:2px}#stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;font-size:11px}#stats span{white-space:nowrap}#cross{position:absolute;left:50%;top:50%;width:16px;height:16px;transform:translate(-50%,-50%)}#cross:before,#cross:after{content:"";position:absolute;background:#f3f6e9;box-shadow:0 0 4px #000}#cross:before{width:2px;height:16px;left:7px}#cross:after{height:2px;width:16px;top:7px}#bottom{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#081116bb;padding:7px 12px;border-radius:6px;color:#c6d0d3;font-size:11px;white-space:nowrap}#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#081116d9;z-index:5}#card{width:min(440px,calc(100vw - 32px));padding:26px;border:1px solid #8c754f;background:linear-gradient(145deg,#202c2b,#111a1a);text-align:center;box-shadow:0 22px 80px #000b}h1{color:#e4c28a;letter-spacing:4px;margin:0 0 10px}p{color:#c4cfd0;line-height:1.5}button{border:1px solid #b18e59;border-radius:5px;background:linear-gradient(#80633d,#58442c);color:#fff2d9;padding:12px 20px;font-weight:800;letter-spacing:1px}#touch{display:none;position:fixed;inset:0;pointer-events:none}#stick{position:absolute;left:22px;bottom:max(22px,env(safe-area-inset-bottom));width:118px;height:118px;border:2px solid #dce9e877;border-radius:50%;background:#10202b66;pointer-events:auto;touch-action:none}#nub{position:absolute;left:34px;top:34px;width:46px;height:46px;border-radius:50%;background:#b6d7d0bb}#look{position:absolute;right:0;top:0;width:62%;height:100%;pointer-events:auto;touch-action:none}#fire{position:absolute;right:22px;bottom:max(26px,env(safe-area-inset-bottom));width:78px;height:78px;border-radius:50%;background:#87372f;border:2px solid #e5a69f;pointer-events:auto;touch-action:none}#quality{position:absolute;left:12px;bottom:12px;color:#d7e2df;background:#101820aa;padding:4px 7px;border-radius:5px;font:10px ui-monospace,monospace}@media(pointer:coarse){#touch{display:block}#bottom{display:none}#stats{font-size:9px}#brand{font-size:10px}} 
</style>
</head>
<body>
<canvas id="renderCanvas" touch-action="none"></canvas>
<div id="hud"><div id="top"><div id="brand">SOLO ENGINE / V2</div><div id="stats"><span id="round">ROUND 01</span><span id="health">HP 100</span><span id="ammo">30 / 90</span><span id="fps">-- FPS</span></div></div><div id="cross"></div><div id="bottom">WASD — движение · мышь — обзор · ЛКМ — огонь · ESC — курсор</div><div id="quality">INITIALIZING RENDERER…</div></div>
<div id="touch"><div id="stick"><div id="nub"></div></div><div id="look"></div><button id="fire">FIRE</button></div>
<div id="overlay"><div id="card"><h1>SOLO ENGINE V2</h1><p>Новая архитектура рендеринга. Отдельные циклы симуляции и изображения, адаптивная чёткость, мобильное управление.</p><p id="loadState">Загрузка графического ядра…</p><button id="start" disabled>ЗАПУСК</button></div></div>
<script>
window.addEventListener('error',event=>{const node=document.getElementById('loadState');if(node&&event.message)node.textContent='Ошибка загрузки: '+event.message;});
window.addEventListener('unhandledrejection',event=>{const node=document.getElementById('loadState');if(node)node.textContent='Ошибка загрузки: '+(event.reason?.message||String(event.reason));});
</script>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script type="module" src="./engine.js?v=20261127-2"></script>
</body></html>
