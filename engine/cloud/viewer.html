<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#080d12"><title>SOLO Cloud Gaming</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d12;color:#edf3f5;font:14px system-ui}#video{width:100%;height:100%;object-fit:contain;background:#000}#status{position:fixed;top:env(safe-area-inset-top,8px);left:8px;background:#101a20d9;padding:7px 10px;border-radius:5px;z-index:5}#controls{position:fixed;inset:0;pointer-events:none}#stick{position:absolute;left:20px;bottom:max(20px,env(safe-area-inset-bottom));width:120px;height:120px;border:2px solid #dce9e877;border-radius:50%;background:#10202b66;pointer-events:auto;touch-action:none}#nub{position:absolute;left:34px;top:34px;width:48px;height:48px;border-radius:50%;background:#b6d7d0bb}#look{position:absolute;right:0;top:0;width:62%;height:100%;pointer-events:auto;touch-action:none}button{border:1px solid #e5b5a1;background:#773c34;color:white;border-radius:50%;font-weight:800;pointer-events:auto;touch-action:none}#fire{position:absolute;right:20px;bottom:max(25px,env(safe-area-inset-bottom));width:76px;height:76px}#reload{position:absolute;right:112px;bottom:max(38px,env(safe-area-inset-bottom));border-radius:8px;padding:12px}#jump{position:absolute;right:112px;bottom:max(94px,calc(env(safe-area-inset-bottom) + 94px));border-radius:8px;padding:12px}#connect{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;background:#111c23ee;border:1px solid #a78b61;padding:20px;width:min(340px,calc(100vw - 30px));text-align:center}#connect input{width:100%;padding:10px;margin:7px 0;background:#0b1319;color:white;border:1px solid #63727b}#connect button{border-radius:5px;padding:10px 16px}#controls{display:none}@media(pointer:coarse){#controls{display:block}}</style></head>
<body><video id="video" autoplay playsinline></video><div id="status">Не подключено</div>
<div id="connect"><b>SOLO CLOUD GAMING</b><p>Код комнаты и адрес сигнального сервера</p><input id="room" placeholder="Код комнаты"><input id="signal" placeholder="wss://адрес-сервера"><button id="join">ПОДКЛЮЧИТЬСЯ</button></div>
<div id="controls"><div id="look"></div><div id="stick"><div id="nub"></div></div><button id="fire">FIRE</button><button id="reload">RELOAD</button><button id="jump">JUMP</button></div><script type="module" src="./viewer.js"></script></body></html>
