name = "cssbc-github-chat"
main = "agent-runtime/src/index.ts"
compatibility_date = "2026-11-14"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[r2_buckets]]
binding = "FILES"
bucket_name = "cssbc-chat-files"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "AGENT_SESSIONS"
class_name = "AgentSession"

[[migrations]]
tag = "agent-v1"
new_sqlite_classes = ["AgentSession"]
