name = "cssbc-github-chat"
main = "agent-runtime/src/index.ts"
compatibility_date = "2026-11-14"
compatibility_flags = ["nodejs_compat"]
workers_dev = true


[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"

[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
GITHUB_WORK_REPO = "desdesyo/CSS-Bot-Community"
GITHUB_WORK_BRANCH = "github-chat-prototype"
PI_MODEL = "@cf/zai-org/glm-4.7-flash"
SOLO_AI_MODEL = "solo-ai"
SOLO_AGENT_AUTOMATION_ENABLED = "false"

[[durable_objects.bindings]]
name = "AGENT_SESSIONS"
class_name = "AgentSession"

[durable_objects.code_update_strategy]
mode = "deferred"
max_delay = 300

[[migrations]]
tag = "agent-v1"
new_sqlite_classes = ["AgentSession"]

