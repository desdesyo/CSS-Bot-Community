name = "cssbc-github-chat"
main = "agent-runtime/src/index.ts"
compatibility_date = "2026-11-14"
compatibility_flags = ["nodejs_compat"]
workers_dev = true


[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"

[vars]
GITHUB_WORK_REPO = "desdesyo/modhaul"
GITHUB_WORK_BRANCH = "main"
PI_MODEL = "@cf/zai-org/glm-4.7-flash"

[[durable_objects.bindings]]
name = "AGENT_SESSIONS"
class_name = "AgentSession"

[[migrations]]
tag = "agent-v1"
new_sqlite_classes = ["AgentSession"]


[[kv_namespaces]]
binding = "FILES"
id = "KV_NAMESPACE_ID"
