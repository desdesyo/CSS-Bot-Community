<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSSBC Map Studio</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#10151d;color:#e8edf5}*{box-sizing:border-box}body{margin:0;display:grid;grid-template-columns:330px 1fr;min-height:100vh}aside{padding:22px;background:#171e29;border-right:1px solid #2b3545}h1{font-size:22px;margin:0 0 6px}p{color:#9ba9bc;line-height:1.45}label{display:block;margin:15px 0 5px;color:#bdc9d9}input,select{width:100%;padding:10px;background:#0d1219;border:1px solid #354155;border-radius:7px;color:white}button{width:100%;padding:12px;border:0;border-radius:8px;background:#55a5ff;color:#07121f;font-weight:700;margin-top:14px;cursor:pointer}button.secondary{background:#2a3545;color:#eaf2ff}main{padding:24px;display:flex;flex-direction:column;gap:15px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.pill{background:#1d2937;padding:8px 12px;border-radius:20px;color:#8fc5ff}canvas{width:100%;height:min(72vh,800px);background:#0b1016;border:1px solid #2c3748;border-radius:12px}.stats{display:flex;gap:12px;flex-wrap:wrap;color:#9eacc0}.stats b{color:#e9f3ff}.note{font-size:12px;color:#8190a5}
@media(max-width:800px){body{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #2b3545}canvas{height:55vh}}
</style>
<body><aside><h1>CSSBC Map Studio</h1><p>Генератор районов для Counter-Strike: Source v34. VMF выгружается прямо из браузера.</p>
<label>Имя карты</label><input id="name" value="CSSBC_District" maxlength="48">
<label>Размер квартала (units)</label><select id="block"><option>512</option><option selected>1024</option><option>1536</option><option>2048</option></select>
<label>Этажей в зданиях</label><select id="floors"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select>
<label>Ширина улицы</label><select id="road"><option>384</option><option selected>512</option><option>640</option><option>768</option></select>
<label>Материал стен</label><select id="material"><option>DEV/DEV_MEASUREGENERIC01B</option><option>BRICK/BRICKWALL001A</option><option>CONCRETE/CONCRETEWALL001A</option></select>
<button id="build">Обновить предпросмотр</button><button class="secondary" id="download">Скачать VMF</button><button class="secondary" id="reset">Сброс параметров</button>
<p class="note">VMF — исходник карты. Для BSP нужен Hammer/VBSP из легальной установки CS:S.</p></aside>
<main><div class="top"><div><h2 style="margin:0">Предпросмотр планировки</h2><p style="margin:4px 0">Схема сверху · здания с дверными проёмами</p></div><span class="pill">Map Studio · v0.1</span></div><canvas id="view" width="1000" height="760"></canvas><div class="stats" id="stats"></div></main>
<script>
const $=id=>document.getElementById(id),cv=$('view'),ctx=cv.getContext('2d');
function config(){return{name:$('name').value.replace(/[^a-zA-Z0-9_-]/g,'_')||'CSSBC_District',B:+$('block').value,F:+$('floors').value,R:+$('road').value,M:$('material').value}}
function draw(){let c=config(),W=cv.width,H=cv.height,scale=Math.min((W-100)/(c.B*4),(H-100)/(c.B*4)),cx=W/2,cy=H/2;ctx.clearRect(0,0,W,H);ctx.fillStyle='#111923';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#253244';ctx.lineWidth=1;for(let x=0;x<W;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
const rect=(x,y,w,h,col)=>{ctx.fillStyle=col;ctx.fillRect(cx+x*scale,cy+y*scale,w*scale,h*scale);ctx.strokeStyle='#a4b7cc';ctx.strokeRect(cx+x*scale,cy+y*scale,w*scale,h*scale)};
rect(-2*c.B,-c.R/2,4*c.B,c.R,'#394858');rect(-2*c.B,-c.R/2-64,4*c.B,64,'#65717e');rect(-2*c.B,c.R/2,4*c.B,64,'#65717e');
for(let [x,y] of [[-c.B,-c.B],[c.B/2,-c.B],[-c.B,c.B/2],[c.B/2,c.B/2]]){rect(x,y,c.B/2,c.B/2,'#34404e');ctx.fillStyle='#59b8ff';ctx.fillRect(cx+(x+c.B/4-48)*scale,cy+y*scale,96*scale,8*scale);ctx.fillStyle='#d5e4f5';ctx.font='14px system-ui';ctx.fillText(c.F+'F',cx+(x+20)*scale,cy+(y+28)*scale)}
for(let [x,y,col] of [[-128,-128,'#35d07f'],[128,128,'#ffad48']]){ctx.fillStyle=col;ctx.beginPath();ctx.arc(cx+x*scale,cy+y*scale,8,0,Math.PI*2);ctx.fill()}
$('stats').innerHTML='<span><b>4</b> здания</span><span><b>'+c.F+'</b> этаж(а)</span><span><b>2</b> spawn</span><span><b>'+Math.round(4*c.B)+'</b> units размер</span>'}
function vmf(){let c=config(),id=2,sol=[],ent=[];function brush(a,b,mat){let[x,y,z]=a,[X,Y,Z]=b;if(!(x<X&&y<Y&&z<Z))throw Error('Некорректные координаты');let fs=[[[x,y,z],[x,Y,z],[x,Y,Z]],[[X,Y,Z],[X,Y,z],[X,y,z]],[[x,y,z],[X,y,z],[X,y,Z]],[[X,Y,Z],[x,Y,Z],[x,Y,z]],[[x,Y,z],[X,Y,z],[X,Y,Z]],[[X,y,Z],[x,y,Z],[x,y,z]]];let n=id;id+=7;return 'solid\n{\n"id" "'+n+'"\n'+fs.map((f,i)=>'side\n{\n"id" "'+(n+i+1)+'"\n"plane" "'+f.map(p=>'('+p.join(' ')+')').join(' ')+'"\n"material" "'+mat+'"\n"uaxis" "[1 0 0 0] 0.25"\n"vaxis" "[0 -1 0 0] 0.25"\n"rotation" "0"\n"lightmapscale" "16"\n"smoothing_groups" "0"\n}').join('\n')+'\n}'}function E(cls,origin,angles){return 'entity\n{\n"id" "'+(id++)+'"\n"classname" "'+cls+'"\n"origin" "'+origin.join(' ')+'"\n"angles" "'+angles+'"\n}'}let B=c.B,R=c.R,w=B/2,d=B/2,t=16,h=c.F*256;sol.push(brush([-2*B,-2*B,-64],[2*B,2*B,0],'DEV/DEV_MEASUREGENERIC01B'),brush([-2*B,-R/2,-8],[2*B,R/2,0],'CONCRETE/CONCRETE_FLOOR'),brush([-2*B,-R/2-64,-8],[2*B,-R/2,0],'CONCRETE/CONCRETE_FLOOR'),brush([-2*B,R/2,-8],[2*B,R/2+64,0],'CONCRETE/CONCRETE_FLOOR'));
for(let [x,y]of[[-B,-B],[B/2,-B],[-B,B/2],[B/2,B/2]]){let mid=x+w/2,D=96,DH=160;sol.push(brush([x,y,0],[x+t,y+d,h],c.M),brush([x+w-t,y,0],[x+w,y+d,h],c.M),brush([x+t,y,0],[mid-D/2,y+t,DH],c.M),brush([mid+D/2,y,0],[x+w-t,y+t,DH],c.M),brush([mid-D/2,y,DH],[mid+D/2,y+t,h],c.M),brush([x+t,y+d-t,0],[x+w-t,y+d,h],c.M),brush([x,y,h-t],[x+w,y+d,h],c.M))}
ent.push(E('info_player_counterterrorist',[-128,-128,8],'0 0 0'),E('info_player_terrorist',[128,128,8],'0 180 0'));
return 'versioninfo\n{\n"editorversion" "400"\n"editorbuild" "0"\n"mapversion" "1"\n"formatversion" "100"\n"prefab" "0"\n}\nvisgroups\n{}\nviewsettings\n{\n"bSnapToGrid" "1"\n"bShowGrid" "1"\n"bShowLogicalGrid" "0"\n"nGridSpacing" "64"\n"bShow3DGrid" "0"\n}\nworld\n{\n"id" "1"\n"classname" "worldspawn"\n"mapversion" "1"\n"skyname" "sky_day01_01"\n"detailmaterial" "detail/detailsprites"\n"detailvbsp" "detail.vbsp"\n"maxpropscreenwidth" "-1"\n'+sol.join('\n')+'\n}\n'+ent.join('\n')}
$('build').onclick=draw;$('download').onclick=()=>{let blob=new Blob([vmf()],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=config().name+'.vmf';a.click();URL.revokeObjectURL(a.href)};$('reset').onclick=()=>{$('name').value='CSSBC_District';$('block').value='1024';$('floors').value='2';$('road').value='512';$('material').selectedIndex=0;draw()};draw();
</script></body></html>
